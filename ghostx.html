<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bike Ghost Racer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0c12}

/* ── MAP ── */
#map{position:absolute;inset:0;z-index:1}
.leaflet-top.leaflet-right{top:64px}

/* ── UI LAYER ── */
#ui{position:absolute;inset:0;z-index:10;pointer-events:none}

/* ── TOP BAR ── */
#top{
  position:absolute;top:12px;left:0;right:0;
  padding:0 14px;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none
}
.badge{
  pointer-events:auto;display:none;align-items:center;gap:7px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:20px;padding:6px 12px 6px 9px;font-size:12px;font-weight:600
}
.badge.on{display:flex}
.badge-ghost{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#f87171}
.badge-plan{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80}
.badge-x{color:inherit;opacity:.45;cursor:pointer;font-size:14px;margin-left:2px}

#big{display:none;text-align:center;pointer-events:none}
#big.on{display:block}
#big-num{
  font-size:70px;font-weight:800;font-family:'Courier New',monospace;
  letter-spacing:-3px;line-height:1;color:var(--nc,#22c55e);
  text-shadow:0 0 40px var(--gw,rgba(34,197,94,.2))
}
#big-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.rdot{display:inline-block;width:9px;height:9px;background:#f43f5e;border-radius:50%;animation:blink 1.1s ease-in-out infinite;vertical-align:middle;margin-right:4px;margin-bottom:2px}
.ahead{--nc:#22c55e;--gw:rgba(34,197,94,.3)}
.behind{--nc:#f43f5e;--gw:rgba(244,63,94,.3)}
.neutral{--nc:rgba(255,255,255,.45);--gw:transparent}

/* ── BOTTOM ── */
#bottom{
  position:absolute;bottom:0;left:0;right:0;
  padding:0 14px 30px;display:flex;flex-direction:column;align-items:stretch;gap:9px;
  pointer-events:none
}
#hint{
  display:none;align-self:center;
  background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:5px 13px;
  color:rgba(255,255,255,.38);font-size:11px;pointer-events:none
}
#hint.on{display:block}

.row{display:flex;gap:9px;pointer-events:auto}
.row.off{display:none}

.btn{
  flex:1;height:54px;border:none;border-radius:16px;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s;letter-spacing:.1px
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.28;cursor:not-allowed}

.btn-green{background:#22c55e;color:#fff;box-shadow:0 4px 20px rgba(34,197,94,.35)}
.btn-green:hover:not(:disabled){background:#16a34a}
.btn-red{background:#f43f5e;color:#fff;box-shadow:0 4px 20px rgba(244,63,94,.32);flex:0 0 54px}
.btn-glass{
  background:rgba(10,12,18,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.78);flex:0 0 54px
}
.btn-ghost-out{
  background:rgba(244,63,94,.09);border:1px solid rgba(244,63,94,.28);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#f87171;flex:0 0 54px
}
.btn-plan{
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#4ade80;flex:0 0 54px
}
.btn-cp-list{
  background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.22);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#4ade80
}
/* Big pulsing GPS checkpoint button */
.btn-gps-cp{
  flex:0 0 70px;height:70px;border-radius:20px;font-size:24px;
  background:rgba(34,197,94,.14);border:2px solid rgba(34,197,94,.5);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#4ade80;
  box-shadow:0 0 0 0 rgba(34,197,94,.4);animation:cpulse 2s ease-in-out infinite
}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.35)}70%{box-shadow:0 0 0 11px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btn-xrace{
  background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.18));
  border:1px solid rgba(168,85,247,.4);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#c4b5fd;flex:0 0 54px;font-size:18px
}

/* ── OVERLAY + SHEETS ── */
#overlay{display:none;position:absolute;inset:0;z-index:18;pointer-events:auto}
#overlay.on{display:block}
.sheet{
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  background:rgba(8,10,16,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.07);border-radius:24px 24px 0 0;
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  pointer-events:auto;max-height:72vh
}
.sheet.open{transform:translateY(0)}
.sdrag{width:34px;height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin:11px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 11px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.stitle{font-size:15px;font-weight:700;color:#fff}
.sx{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.07);border:none;color:rgba(255,255,255,.4);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sbody{overflow-y:auto;flex:1;padding:11px 15px 26px;-webkit-overflow-scrolling:touch}

.run-card{
  display:flex;align-items:center;gap:12px;padding:12px 11px;
  border-radius:13px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);
  margin-bottom:8px;cursor:pointer;transition:all .13s
}
.run-card:hover,.run-card:active{background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.24)}
.run-card.sel{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.44)}
.run-icon{font-size:20px;flex-shrink:0}
.run-info{flex:1;min-width:0}
.run-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.run-meta{font-size:10px;color:rgba(255,255,255,.3);display:flex;gap:9px}
.run-chk{color:#f43f5e;font-size:15px;opacity:0;transition:opacity .2s}
.run-card.sel .run-chk{opacity:1}

.cp-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cp-row:last-child{border-bottom:none}
.cp-num{width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cp-num-plan{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);color:#4ade80}
.cp-num-gps{background:rgba(99,179,237,.1);border:1px solid rgba(99,179,237,.3);color:#90cdf4}
.cp-num-map{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.28);color:#fbbf24}
.cp-name{flex:1;font-size:12px;color:#fff;font-weight:500}
.cp-src{font-size:9px;padding:2px 5px;border-radius:6px;font-weight:700;letter-spacing:.4px;flex-shrink:0}
.cp-src-plan{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.cp-src-gps{background:rgba(99,179,237,.1);color:#90cdf4;border:1px solid rgba(99,179,237,.2)}
.cp-src-map{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.cp-time{font-size:10px;color:rgba(255,255,255,.3);font-family:monospace;min-width:36px;text-align:right}
.cp-del{width:24px;height:24px;background:rgba(244,63,94,.1);border:none;border-radius:6px;color:#f87171;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.empty{text-align:center;padding:32px 18px;color:rgba(255,255,255,.2)}
.empty-ico{font-size:40px;margin-bottom:9px;opacity:.3}
.empty-txt{font-size:12px;line-height:1.6}

/* ── SAVE MODAL ── */
#save-modal{
  display:none;position:absolute;inset:0;z-index:30;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  align-items:flex-end;pointer-events:auto
}
#save-modal.open{display:flex}
.modal-inner{width:100%;background:rgba(8,10,16,.97);border-top:1px solid rgba(255,255,255,.07);border-radius:24px 24px 0 0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px 13px;border-bottom:1px solid rgba(255,255,255,.05)}
.modal-title{font-size:15px;font-weight:700;color:#fff}
.modal-body{padding:15px 19px 0}
.modal-foot{display:flex;gap:9px;padding:13px 19px 30px}
.lbl{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.26);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:5px}
.field{margin-bottom:13px}
input[type=text],textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:9px 11px;color:#fff;font-size:13px;font-family:inherit}
input[type=text]:focus,textarea:focus{outline:none;border-color:rgba(34,197,94,.4)}
::placeholder{color:rgba(255,255,255,.16)}
textarea{resize:none;height:56px}
.save-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.save-stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:11px;text-align:center}
.save-stat-lbl{font-size:9px;color:rgba(255,255,255,.26);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.save-stat-val{font-size:19px;font-weight:700;color:#22c55e}

/* ── TOAST ── */
#toast{
  position:absolute;bottom:108px;left:50%;
  transform:translateX(-50%) translateY(13px);
  background:rgba(8,10,16,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);border-radius:18px;
  padding:7px 16px;color:#fff;font-size:12px;font-weight:500;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── X RACE CANVAS ── */
#xrace{
  display:none;position:absolute;inset:0;z-index:5;
  background:#000008
}
#xrace.on{display:block}
#xrace canvas{position:absolute;inset:0;width:100%;height:100%}
#xrace-hud{
  position:absolute;inset:0;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;padding:14px
}
#xrace-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#xrace-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}

.xhud-card{
  background:rgba(0,0,8,.72);border-radius:14px;padding:10px 13px;
  border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(10px);min-width:110px
}
.xhud-name{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.xhud-speed{font-size:28px;font-weight:800;font-family:'Courier New',monospace;letter-spacing:-1px;line-height:1}
.xhud-unit{font-size:9px;color:rgba(255,255,255,.35);margin-top:1px}
.xhud-warp{font-size:9px;font-weight:600;letter-spacing:1px;margin-top:3px}

.you-col{color:#22c55e;border-color:rgba(34,197,94,.2)}
.ghost-col{color:#f43f5e;border-color:rgba(244,63,94,.2)}

#xrace-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none
}
#xdiff{font-size:44px;font-weight:800;font-family:'Courier New',monospace;letter-spacing:-2px;color:var(--nc,#fff);text-shadow:0 0 30px var(--gw,rgba(255,255,255,.2))}
#xdiff-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:3px}

#xrace-close{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,8,.8);border:1px solid rgba(255,255,255,.12);border-radius:20px;
  padding:6px 16px;color:rgba(255,255,255,.5);font-size:11px;font-weight:600;
  cursor:pointer;pointer-events:auto;z-index:6;letter-spacing:1px
}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>

<!-- X RACE VIEW -->
<div id="xrace">
  <canvas id="xcanvas"></canvas>
  <div id="xrace-hud">
    <div id="xrace-top">
      <div class="xhud-card you-col">
        <div class="xhud-name">Du</div>
        <div class="xhud-speed" id="xspeed-you">0</div>
        <div class="xhud-unit">km/h</div>
        <div class="xhud-warp" id="xwarp-you" style="color:#22c55e">IMPULSE</div>
      </div>
      <div style="text-align:center;flex:1">
        <div id="xrace-center">
          <div id="xdiff">0.0s</div>
          <div id="xdiff-lbl">Zeitdifferenz</div>
        </div>
      </div>
      <div class="xhud-card ghost-col" style="text-align:right">
        <div class="xhud-name" style="text-align:right">Ghost</div>
        <div class="xhud-speed" id="xspeed-ghost">—</div>
        <div class="xhud-unit">km/h</div>
        <div class="xhud-warp" id="xwarp-ghost" style="color:#f43f5e">IMPULSE</div>
      </div>
    </div>
    <div id="xrace-bottom">
      <div class="xhud-card" style="color:rgba(255,255,255,.6)">
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px">Zeit</div>
        <div style="font-size:20px;font-weight:700;font-family:'Courier New',monospace" id="xtime">00:00</div>
      </div>
      <div style="pointer-events:auto">
        <button onclick="closeXRace()" style="background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.35);border-radius:14px;padding:12px 20px;color:#f87171;font-size:13px;font-weight:700;cursor:pointer">⏹ Beenden</button>
      </div>
      <div class="xhud-card" style="color:rgba(255,255,255,.6);text-align:right">
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px">Distanz</div>
        <div style="font-size:20px;font-weight:700;font-family:'Courier New',monospace" id="xdist">0.0km</div>
      </div>
    </div>
  </div>
</div>

<div id="ui">
  <div id="top">
    <div id="badge-ghost" class="badge badge-ghost">
      <span>👻</span>
      <span id="badge-ghost-name">Ghost</span>
      <span class="badge-x" onclick="clearGhost()">✕</span>
    </div>
    <div id="badge-plan" class="badge badge-plan">
      <span>🗺️</span>
      <span id="badge-plan-txt">0 CPs geplant</span>
    </div>
    <div id="big" class="neutral">
      <div id="big-num">00:00</div>
      <div id="big-lbl">Aufnahme</div>
    </div>
  </div>

  <div id="bottom">
    <div id="hint">Karte antippen → Checkpoint</div>

    <!-- IDLE, kein Ghost -->
    <div class="row" id="row-idle">
      <button class="btn btn-green" onclick="startRecording()">🔴 Aufnahme</button>
      <button class="btn btn-plan" onclick="togglePlanning()" title="Route vorher planen">🗺️</button>
      <button class="btn btn-glass" onclick="openSheet('ghost-sheet')">👻</button>
    </div>

    <!-- IDLE, Ghost geladen -->
    <div class="row off" id="row-ghost">
      <button class="btn btn-green" onclick="startRace()">🏁 Rennen</button>
      <button class="btn btn-glass" onclick="startRecording()" style="font-size:17px">🔴</button>
      <button class="btn btn-plan" onclick="togglePlanning()">🗺️</button>
      <button class="btn btn-ghost-out" onclick="openSheet('ghost-sheet')">👻</button>
    </div>

    <!-- PLANNING -->
    <div class="row off" id="row-plan">
      <button class="btn btn-green" onclick="startRecording()">▶ Aufnahme starten</button>
      <button class="btn btn-cp-list" onclick="openSheet('cp-sheet')" style="flex:0 0 54px">📋</button>
      <button class="btn btn-glass" onclick="togglePlanning()">✕</button>
    </div>

    <!-- RECORDING -->
    <div class="row off" id="row-rec">
      <button class="btn btn-gps-cp" onclick="addGpsCheckpoint()" title="GPS-Checkpoint jetzt">📍</button>
      <button class="btn btn-cp-list" onclick="openSheet('cp-sheet')">📋 CPs (<span id="cp-count">0</span>)</button>
      <button class="btn btn-red" onclick="stopActivity()">⏹</button>
    </div>

    <!-- RACING (Karte) -->
    <div class="row off" id="row-race">
      <button class="btn btn-xrace" onclick="openXRace()" title="X Race — 3D Modus">🚀</button>
      <button class="btn btn-red" onclick="stopActivity()" style="flex:1">⏹ Rennen beenden</button>
    </div>
  </div>

  <div id="overlay" onclick="closeSheets()"></div>

  <div class="sheet" id="ghost-sheet">
    <div class="sdrag"></div>
    <div class="shead"><div class="stitle">👻 Ghost wählen</div><button class="sx" onclick="closeSheets()">✕</button></div>
    <div class="sbody" id="ghost-list"></div>
  </div>

  <div class="sheet" id="cp-sheet">
    <div class="sdrag"></div>
    <div class="shead"><div class="stitle">📍 Checkpoints</div><button class="sx" onclick="closeSheets()">✕</button></div>
    <div class="sbody" id="cp-list"></div>
  </div>
</div>

<div id="toast"></div>

<div id="save-modal">
  <div class="modal-inner">
    <div class="modal-head">
      <div class="modal-title">💾 Route speichern</div>
      <button class="sx" onclick="discardRecording()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label class="lbl">Routenname</label><input type="text" id="routeName" placeholder="Morgenrunde"></div>
      <div class="field"><label class="lbl">Notizen</label><textarea id="routeNotes" placeholder="Bedingungen, Gefühl…"></textarea></div>
      <div class="save-grid">
        <div class="save-stat"><div class="save-stat-lbl">Dauer</div><div class="save-stat-val" id="saveDuration">00:00</div></div>
        <div class="save-stat"><div class="save-stat-lbl">Checkpoints</div><div class="save-stat-val" id="saveCheckpoints">0</div></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-glass" onclick="discardRecording()" style="flex:1;height:48px">Verwerfen</button>
      <button class="btn btn-green" onclick="confirmSave()" style="flex:2;height:48px">Route speichern</button>
    </div>
  </div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
const st = {
  map: null, userMarker: null, ghostMarker: null,
  routeLine: null, ghostLine: null,
  cpMarkers: [],
  recordedRoute: [], liveRoute: [],
  checkpoints: [],
  mode: 'idle',          // idle | planning | recording | racing
  planning: false,
  startTime: null,
  watchId: null,
  timerInterval: null,
  runs: [], selectedGhost: null,
  lastPos: null, lastPosTime: null, currentSpeedKmh: 0,
  xraceOpen: false, xctx: null, xAnimId: null
};

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
function init() {
  st.map = L.map('map', {zoomControl: false}).setView([52.52, 13.40], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OSM', maxZoom:19}).addTo(st.map);
  L.control.zoom({position:'topright'}).addTo(st.map);

  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { st.map.setView([p.coords.latitude, p.coords.longitude], 16); placeUser(p.coords.latitude, p.coords.longitude); },
    ()=>{}, {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );

  st.map.on('click', e => {
    if (st.planning || st.mode === 'recording')
      addCheckpoint(e.latlng.lat, e.latlng.lng, 'map');
  });

  st.routeLine = L.polyline([], {color:'#22c55e', weight:4, opacity:.85}).addTo(st.map);
  st.ghostLine = L.polyline([], {color:'#f43f5e', weight:3, dashArray:'6,6', opacity:.65}).addTo(st.map);

  loadData();
  renderGhostList();
  setMode('idle');
}

/* ══════════════════════════════════════════
   MODE MANAGEMENT
══════════════════════════════════════════ */
function setMode(m) {
  st.mode = m;
  const hg = !!st.selectedGhost;
  const rows = {
    'row-idle':   m === 'idle' && !st.planning && !hg,
    'row-ghost':  m === 'idle' && !st.planning && hg,
    'row-plan':   m === 'idle' && st.planning,
    'row-rec':    m === 'recording',
    'row-race':   m === 'racing'
  };
  Object.entries(rows).forEach(([id,v]) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('off', !v);
  });
  const showHint = st.planning || m === 'recording';
  document.getElementById('hint').classList.toggle('on', showHint);
  document.getElementById('hint').textContent = st.planning
    ? 'Karte antippen → Checkpoint planen'
    : 'Karte antippen → Checkpoint setzen';
  document.getElementById('big').classList.toggle('on', m !== 'idle');
}

/* ══════════════════════════════════════════
   PLANNING MODE
══════════════════════════════════════════ */
function togglePlanning() {
  st.planning = !st.planning;
  setMode('idle');
  if (st.planning) {
    document.getElementById('badge-plan').classList.add('on');
    updatePlanBadge();
    toast('🗺️ Planungsmodus — Karte antippen');
  } else {
    if (!st.checkpoints.length) document.getElementById('badge-plan').classList.remove('on');
    toast('Planung beendet');
  }
}

function updatePlanBadge() {
  const n = st.checkpoints.length;
  document.getElementById('badge-plan-txt').textContent = n + (n===1?' CP geplant':' CPs geplant');
  if (n > 0) document.getElementById('badge-plan').classList.add('on');
  document.getElementById('cp-count').textContent = n;
}

/* ══════════════════════════════════════════
   CHECKPOINTS
══════════════════════════════════════════ */
function addCheckpoint(lat, lng, source) {
  const elapsed = (st.mode === 'recording') ? Date.now() - st.startTime : null;
  const cp = { lat, lng, name: 'CP ' + (st.checkpoints.length + 1), time: elapsed, source: source || 'map' };
  st.checkpoints.push(cp);
  placeCpMarker(cp, st.checkpoints.length - 1);
  updatePlanBadge();
  renderCpListIfOpen();
  if (source === 'gps') toast('📍 GPS-CP gesetzt!');
  else if (source === 'plan' || st.planning) toast('📍 ' + cp.name + ' geplant');
  else toast('📍 ' + cp.name);
}

function addGpsCheckpoint() {
  if (!st.lastPos) { toast('⚠️ Noch kein GPS-Signal'); return; }
  addCheckpoint(st.lastPos.lat, st.lastPos.lng, 'gps');
}

function placeCpMarker(cp, idx) {
  const c = cp.source === 'gps' ? '#63b3ed' : cp.source === 'map' ? '#f59e0b' : '#22c55e';
  const tc = cp.source === 'gps' ? '#90cdf4' : cp.source === 'map' ? '#fbbf24' : '#4ade80';
  const m = L.marker([cp.lat, cp.lng], {
    draggable: true,
    icon: L.divIcon({
      html: `<div style="width:26px;height:26px;background:#0a0c12;border:2px solid ${c};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${tc}">${idx+1}</div>`,
      iconSize:[26,26], iconAnchor:[13,26], className:''
    })
  }).addTo(st.map);
  m.on('dragend', () => { const ll = m.getLatLng(); st.checkpoints[idx].lat = ll.lat; st.checkpoints[idx].lng = ll.lng; });
  m.on('click', () => { const n = prompt('Umbenennen:', st.checkpoints[idx].name); if(n&&n.trim()){st.checkpoints[idx].name=n.trim();renderCpListIfOpen();} });
  st.cpMarkers[idx] = m;
}

function refreshCpMarkerIcons() {
  st.cpMarkers.forEach((m, i) => {
    if (!m) return;
    const cp = st.checkpoints[i];
    const c = cp.source === 'gps' ? '#63b3ed' : cp.source === 'map' ? '#f59e0b' : '#22c55e';
    const tc = cp.source === 'gps' ? '#90cdf4' : cp.source === 'map' ? '#fbbf24' : '#4ade80';
    m.setIcon(L.divIcon({
      html: `<div style="width:26px;height:26px;background:#0a0c12;border:2px solid ${c};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${tc}">${i+1}</div>`,
      iconSize:[26,26], iconAnchor:[13,26], className:''
    }));
  });
}

function deleteCheckpoint(idx) {
  st.map.removeLayer(st.cpMarkers[idx]);
  st.checkpoints.splice(idx, 1);
  st.cpMarkers.splice(idx, 1);
  refreshCpMarkerIcons();
  updatePlanBadge();
  renderCpList();
  if (!st.checkpoints.length) document.getElementById('badge-plan').classList.remove('on');
}

function renderCpListIfOpen() {
  const s = document.getElementById('cp-sheet');
  if (s.classList.contains('open')) renderCpList();
}

function renderCpList() {
  const el = document.getElementById('cp-list');
  if (!st.checkpoints.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">📍</div><div class="empty-txt">Noch keine Checkpoints.<br>Karte antippen oder 📍 drücken.</div></div>';
    return;
  }
  const srcInfo = { plan:['cp-src-plan','PLAN'], gps:['cp-src-gps','GPS'], map:['cp-src-map','MAP'] };
  el.innerHTML = st.checkpoints.map((cp, i) => {
    const numCls = cp.source === 'gps' ? 'cp-num-gps' : cp.source === 'map' ? 'cp-num-map' : 'cp-num-plan';
    const [srcCls, srcTxt] = srcInfo[cp.source] || srcInfo.map;
    const t = cp.time != null ? fmt(cp.time) : '—:——';
    return `<div class="cp-row">
      <div class="cp-num ${numCls}">${i+1}</div>
      <div class="cp-name">${cp.name}</div>
      <span class="cp-src ${srcCls}">${srcTxt}</span>
      <div class="cp-time">${t}</div>
      <button class="cp-del" onclick="deleteCheckpoint(${i})">✕</button>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════
   RECORDING
══════════════════════════════════════════ */
function startRecording() {
  // Behalte geplante CPs, aber beende Planungsmodus
  st.planning = false;
  st.liveRoute = [];
  st.routeLine.setLatLngs([]);
  st.startTime = Date.now();

  document.getElementById('big-num').innerHTML = '<span class="rdot"></span>00:00';
  document.getElementById('big-lbl').textContent = 'Aufnahme';
  document.getElementById('big').className = 'on neutral';

  setMode('recording');
  closeSheets();

  st.timerInterval = setInterval(() => {
    const e = Date.now() - st.startTime;
    document.getElementById('big-num').innerHTML = '<span class="rdot"></span>' + fmt(e);
  }, 500);

  watchGPS();
  const planned = st.checkpoints.length;
  toast(planned > 0 ? `▶ Aufnahme — ${planned} CP(s) vorgeladen` : '▶ Aufnahme — Karte tippen oder 📍');
}

/* ══════════════════════════════════════════
   RACING
══════════════════════════════════════════ */
function startRace() {
  if (!st.selectedGhost) return;
  st.planning = false;
  st.liveRoute = [];
  st.routeLine.setLatLngs([]);
  st.startTime = Date.now();
  closeSheets();
  st.ghostLine.setLatLngs(st.selectedGhost.route.map(p => [p.lat, p.lng]));
  document.getElementById('big-num').textContent = '0.0s';
  document.getElementById('big-lbl').textContent = 'vs Ghost';
  document.getElementById('big').className = 'on neutral';
  setMode('racing');
  watchGPS();
}

/* ══════════════════════════════════════════
   GPS WATCH
══════════════════════════════════════════ */
function watchGPS() {
  if (!navigator.geolocation) { toast('⚠️ Kein GPS'); return; }
  if (st.watchId) navigator.geolocation.clearWatch(st.watchId);
  st.watchId = navigator.geolocation.watchPosition(
    pos => {
      const {latitude:lat, longitude:lng, speed} = pos.coords;
      const elapsed = Date.now() - st.startTime;
      // Speed from GPS (m/s) or calculate from positions
      if (speed != null) {
        st.currentSpeedKmh = speed * 3.6;
      } else if (st.lastPos && st.lastPosTime) {
        const dt = (Date.now() - st.lastPosTime) / 1000;
        const dist = haverDist(st.lastPos.lat, st.lastPos.lng, lat, lng);
        st.currentSpeedKmh = dt > 0 ? (dist / dt) * 3.6 : 0;
      }
      st.lastPos = {lat, lng};
      st.lastPosTime = Date.now();
      placeUser(lat, lng);
      st.map.panTo([lat, lng], {animate:true, duration:0.4});
      if (st.mode === 'recording') {
        st.liveRoute.push({lat, lng, time:elapsed});
        st.routeLine.addLatLng([lat, lng]);
      }
      if (st.mode === 'racing') {
        st.liveRoute.push({lat, lng, time:elapsed});
        st.routeLine.addLatLng([lat, lng]);
        updateDiff(lat, lng, elapsed);
      }
    },
    err => toast(err.code === 1 ? '❌ Standort verweigert' : '⚠️ GPS nicht verfügbar'),
    {enableHighAccuracy:true, maximumAge:0, timeout:8000}
  );
}

function placeUser(lat, lng) {
  if (!st.userMarker) {
    st.userMarker = L.circleMarker([lat, lng], {color:'#22c55e', radius:9, fillColor:'#22c55e', fillOpacity:1, weight:0}).addTo(st.map);
  } else {
    st.userMarker.setLatLng([lat, lng]);
  }
}

function updateDiff(lat, lng, elapsed) {
  const ghost = st.selectedGhost;
  let bestDist = Infinity, closest = ghost.route[0];
  ghost.route.forEach(p => { const d = Math.hypot(p.lat-lat, p.lng-lng); if(d<bestDist){bestDist=d;closest=p;} });
  const gPos = interpGhost(ghost.route, elapsed);
  if (gPos) {
    if (!st.ghostMarker) {
      st.ghostMarker = L.marker([gPos.lat, gPos.lng], {
        icon: L.divIcon({html:'<div style="font-size:22px;line-height:1">👻</div>', iconSize:[24,24], iconAnchor:[12,12], className:''})
      }).addTo(st.map);
    } else { st.ghostMarker.setLatLng([gPos.lat, gPos.lng]); }
  }
  const diff = (elapsed - closest.time) / 1000;
  const abs = Math.abs(diff).toFixed(1);
  const disp = document.getElementById('big');
  const num = document.getElementById('big-num');
  const lbl = document.getElementById('big-lbl');
  if (diff < -0.3) { num.textContent='+'+abs+'s'; lbl.textContent='vor Ghost'; disp.className='on ahead'; }
  else if (diff > 0.3) { num.textContent='-'+abs+'s'; lbl.textContent='hinter Ghost'; disp.className='on behind'; }
  else { num.textContent=abs+'s'; lbl.textContent='gleichauf'; disp.className='on neutral'; }
}

function interpGhost(route, t) {
  if (!route.length) return null;
  if (t <= route[0].time) return route[0];
  if (t >= route[route.length-1].time) return route[route.length-1];
  for (let i = 1; i < route.length; i++) {
    if (route[i].time >= t) {
      const f = (t - route[i-1].time) / (route[i].time - route[i-1].time);
      return {lat: route[i-1].lat + f*(route[i].lat-route[i-1].lat), lng: route[i-1].lng + f*(route[i].lng-route[i-1].lng)};
    }
  }
  return route[route.length-1];
}

/* ══════════════════════════════════════════
   STOP / RESET
══════════════════════════════════════════ */
function stopActivity() {
  closeXRace();
  if (st.watchId) { navigator.geolocation.clearWatch(st.watchId); st.watchId = null; }
  clearInterval(st.timerInterval); st.timerInterval = null;
  if (st.mode === 'recording') {
    st.recordedRoute = [...st.liveRoute];
    if (st.recordedRoute.length > 2) openSaveModal();
    else { toast('⚠️ Zu kurz — nochmal versuchen'); resetRide(); }
  } else if (st.mode === 'racing') {
    if (st.ghostMarker) { st.map.removeLayer(st.ghostMarker); st.ghostMarker = null; }
    st.routeLine.setLatLngs([]);
    toast('Rennen beendet!');
    setMode('idle');
  }
}

function resetRide() {
  st.routeLine.setLatLngs([]);
  clearCpMarkers();
  st.checkpoints = [];
  st.planning = false;
  document.getElementById('badge-plan').classList.remove('on');
  document.getElementById('cp-count').textContent = '0';
  setMode('idle');
}

function clearCpMarkers() {
  st.cpMarkers.forEach(m => { if(m) st.map.removeLayer(m); });
  st.cpMarkers = [];
}

/* ══════════════════════════════════════════
   GHOST
══════════════════════════════════════════ */
function clearGhost() {
  st.selectedGhost = null;
  st.ghostLine.setLatLngs([]);
  document.getElementById('badge-ghost').classList.remove('on');
  setMode('idle');
}

function renderGhostList() {

  if (!st.runs.length) {

  }

      <div class="run-icon">🛤️</div>
      <div class="run-info">
        <div class="run-name">${r.name}</div>
        <div class="run-meta"><span>⏱ ${fmt(r.duration)}</span><span>📍 ${r.checkpoints.length}</span><span>${(r.date||'').split(' ')[0]}</span></div>
      </div>
      <div class="run-chk">●</div>
    </div>`
  ).join('');
}

function selectGhost(idx) {
  st.selectedGhost = st.runs[idx];

}

   SAVE MODAL
══════════════════════════════════════════ */
function openSaveModal() {
  const dur = st.recordedRoute[st.recordedRoute.length-1]?.time || 0;
  document.getElementById('routeName').value = 'Route ' + new Date().toLocaleDateString('de-DE');
  document.getElementById('routeNotes').value = '';

  document.getElementById('saveCheckpoints').textContent = st.checkpoints.length;
  document.getElementById('save-modal').classList.add('open');
}

function confirmSave() {
  const last = st.recordedRoute[st.recordedRoute.length-1];
  const run = {
    id: Date.now(),
    name: document.getElementById('routeName').value || 'Unbenannt',
    notes: document.getElementById('routeNotes').value,
    date: new Date().toLocaleString('de-DE'),
    duration: last ? last.time : 0,
    route: st.recordedRoute,
    checkpoints: [...st.checkpoints],

  };

}

/* ══════════════════════════════════════════
   X RACE — 3D SPACE
══════════════════════════════════════════ */
const XR = {
  stars: [],
  you: { x:0, y:0, z:0, vx:0, vy:0, trail:[] },
  ghost: { x:0, y:0, z:0, vx:0, vy:0, trail:[] },
  camera: { zoom: 1.0, targetZoom: 1.0 },
  lastTime: 0,
  ghostSpeed: 0,
  diffSeconds: 0,
  totalDist: 0
};

function warpLevelFromKmh(kmh) {
  // 0=Impulse, 1-9=Warp 1-9 (0-40 km/h mapped)
  if (kmh < 2) return { level: 'IMPULSE', factor: 0 };
  const w = Math.min(9, Math.floor(kmh / 40 * 9) + 1);
  return { level: 'WARP ' + w, factor: kmh / 40 };
}

function initXRace() {
  const canvas = document.getElementById('xcanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  XR.ctx = canvas.getContext('2d');

  // Generate starfield
  XR.stars = [];
  for (let i = 0; i < 350; i++) {
    XR.stars.push({
      x: (Math.random() - 0.5) * 2000,
      y: (Math.random() - 0.5) * 2000,
      z: Math.random() * 1000,
      size: Math.random() * 1.5 + 0.3,
      bright: Math.random()
    });
  }

  // Init ship positions
  XR.you.x = -120; XR.you.y = 0; XR.you.z = 0;
  XR.you.trail = [];
  XR.ghost.x = 120; XR.ghost.y = 0; XR.ghost.z = 0;
  XR.ghost.trail = [];

  XR.camera.zoom = 1.0;
  XR.camera.targetZoom = 1.0;
  XR.lastTime = performance.now();

  XR.ghostSpeed = 0;
  XR.diffSeconds = 0;
  XR.totalDist = 0;
}

function openXRace() {
  if (st.mode !== 'racing') return;
  st.xraceOpen = true;
  document.getElementById('xrace').classList.add('on');
  initXRace();
  xraceLoop();
}

function closeXRace() {
  st.xraceOpen = false;
  document.getElementById('xrace').classList.remove('on');
  if (XR.animId) { cancelAnimationFrame(XR.animId); XR.animId = null; }
}

function xraceLoop() {
  if (!st.xraceOpen) return;
  const now = performance.now();
  const dt = Math.min((now - XR.lastTime) / 1000, 0.1);
  XR.lastTime = now;

  // Get current diff from race state
  const elapsed = Date.now() - st.startTime;
  const ghost = st.selectedGhost;
  let diff = 0;
  if (ghost && st.lastPos) {
    let bestDist = Infinity, closest = ghost.route[0];
    const lat = st.lastPos.lat, lng = st.lastPos.lng;
    ghost.route.forEach(p => { const d = Math.hypot(p.lat-lat, p.lng-lng); if(d<bestDist){bestDist=d;closest=p;} });
    diff = (elapsed - closest.time) / 1000; // positive = behind
  }
  XR.diffSeconds = diff;

  // Speed factors (0-1)
  const youFactor = Math.min(1, st.currentSpeedKmh / 40);
  const ghostKmh = ghost ? estimateGhostSpeed(ghost.route, elapsed) : 0;
  const ghostFactor = Math.min(1, ghostKmh / 40);
  XR.ghostSpeed = ghostKmh;

  // Zoom: close together = zoom in (1.8), far apart = zoom out (0.4)
  // diff range: 0s = full zoom in, 60s = max zoom out
  const absDiff = Math.min(60, Math.abs(diff));
  const targetZoom = 1.8 - (absDiff / 60) * 1.4;  // 1.8 → 0.4
  XR.camera.targetZoom = targetZoom;
  XR.camera.zoom += (XR.camera.targetZoom - XR.camera.zoom) * dt * 2;

  // Move ships
  const baseSpeed = 180;
  // You ship: moves faster = further forward in Z
  XR.you.z += baseSpeed * youFactor * dt * 40;
  XR.ghost.z += baseSpeed * ghostFactor * dt * 40;

  // Gentle lateral drift based on speed
  XR.you.x = -120 + Math.sin(now * 0.0008) * 25 * youFactor;
  XR.you.y = 20 + Math.cos(now * 0.0011) * 15 * youFactor;
  XR.ghost.x = 120 + Math.sin(now * 0.0009 + 1) * 25 * ghostFactor;
  XR.ghost.y = -20 + Math.cos(now * 0.0012 + 2) * 15 * ghostFactor;

  // Trail
  XR.you.trail.push({x: XR.you.x, y: XR.you.y, z: XR.you.z % 2000, t: now});
  XR.ghost.trail.push({x: XR.ghost.x, y: XR.ghost.y, z: XR.ghost.z % 2000, t: now});
  const maxTrail = 60;
  if (XR.you.trail.length > maxTrail) XR.you.trail.shift();
  if (XR.ghost.trail.length > maxTrail) XR.ghost.trail.shift();

  // Distance
  if (st.liveRoute.length > 1) {
    const r = st.liveRoute;
    XR.totalDist = calcDist(r);
  }

  drawXRace(dt, youFactor, ghostFactor, elapsed);
  updateXHUD(elapsed, youFactor, ghostKmh, diff);

  XR.animId = requestAnimationFrame(xraceLoop);
}

function estimateGhostSpeed(route, elapsed) {
  // Look at ghost position 2 seconds ago vs now to estimate speed
  const now = interpGhost(route, elapsed);
  const past = interpGhost(route, Math.max(0, elapsed - 2000));
  if (!now || !past) return 0;
  const d = haverDist(past.lat, past.lng, now.lat, now.lng);
  return (d / 2) * 3.6; // m/s to km/h
}

function drawXRace(dt, youF, ghostF, elapsed) {
  const canvas = document.getElementById('xcanvas');
  const ctx = XR.ctx;
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const zoom = XR.camera.zoom;

  ctx.clearRect(0, 0, W, H);

  // Deep space bg
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  // Warp speed lines (more when faster)
  const avgF = (youF + ghostF) / 2;
  if (avgF > 0.05) {
    const numLines = Math.floor(avgF * 60);
    ctx.save();
    for (let i = 0; i < numLines; i++) {
      const angle = (i / numLines) * Math.PI * 2;
      const r0 = 80 + i * 4;
      const len = avgF * 120 + 20;
      const alpha = avgF * 0.35;
      const hue = 180 + i * 3;
      ctx.strokeStyle = `hsla(${hue},80%,75%,${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * r0, cy + Math.sin(angle) * r0);
      ctx.lineTo(cx + Math.cos(angle) * (r0 + len), cy + Math.sin(angle) * (r0 + len));
      ctx.stroke();
    }
    ctx.restore();
  }

  // Stars — parallax with z
  const now = performance.now();
  ctx.save();
  XR.stars.forEach(s => {
    const zOff = (s.z + now * 0.04 * avgF) % 1000;
    const perspective = 600 / (zOff + 1);
    const sx = cx + s.x * perspective * zoom * 0.003;
    const sy = cy + s.y * perspective * zoom * 0.003;
    const sr = s.size * perspective * 0.008 * zoom;
    if (sx < 0 || sx > W || sy < 0 || sy > H) return;
    const alpha = Math.min(1, perspective * 0.006) * (0.4 + s.bright * 0.6);
    const starHue = s.bright > 0.7 ? 200 : s.bright > 0.4 ? 60 : 0;
    ctx.fillStyle = `hsla(${starHue},60%,90%,${alpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.3, sr), 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();

  // Nebula-like subtle glow in bg
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W,H)*0.6);
  grd.addColorStop(0, 'rgba(20,10,60,0.18)');
  grd.addColorStop(0.5, 'rgba(5,0,30,0.1)');
  grd.addColorStop(1, 'rgba(0,0,8,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Project ship to screen
  function project(ship) {
    // Z-based perspective (camera looks forward, ships at z=0 plane)
    const fov = 500 * zoom;
    const zd = 300; // camera distance
    const px = cx + ship.x * fov / (zd + 200);
    const py = cy + ship.y * fov / (zd + 200);
    return {px, py};
  }

  // Draw trails
  function drawTrail(trail, color) {
    if (trail.length < 2) return;
    for (let i = 1; i < trail.length; i++) {
      const a = project(trail[i-1]);
      const b = project(trail[i]);
      const alpha = (i / trail.length) * 0.6;
      ctx.strokeStyle = color.replace(')',`,${alpha})`).replace('rgb','rgba');
      ctx.lineWidth = (i / trail.length) * 2.5;
      ctx.beginPath();
      ctx.moveTo(a.px, a.py);
      ctx.lineTo(b.px, b.py);
      ctx.stroke();
    }
  }

  drawTrail(XR.you.trail, 'rgb(34,197,94)');
  drawTrail(XR.ghost.trail, 'rgb(244,63,94)');

  // Draw ships
  function drawShip(ship, color, isGhost) {
    const {px, py} = project(ship);
    const speed = isGhost ? ghostF : youF;
    const size = (18 + speed * 12) * zoom;

    ctx.save();
    ctx.translate(px, py);

    // Engine glow
    if (speed > 0.05) {
      const glowR = ctx.createRadialGradient(0, size*0.6, 0, 0, size*0.6, size*1.4*speed);
      glowR.addColorStop(0, color.replace('rgb','rgba').replace(')',`,${speed*0.8})`));
      glowR.addColorStop(1, 'rgba(0,0,8,0)');
      ctx.fillStyle = glowR;
      ctx.fillRect(-size, -size*0.5, size*2, size*3);
    }

    // Ship body — sleek arrowhead
    ctx.fillStyle = '#e8ecf0';
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size*0.38, size*0.4);
    ctx.lineTo(size*0.18, size*0.2);
    ctx.lineTo(0, size*0.45);
    ctx.lineTo(-size*0.18, size*0.2);
    ctx.lineTo(-size*0.38, size*0.4);
    ctx.closePath();
    ctx.fill();

    // Wing accent
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(0, -size*0.6);
    ctx.lineTo(size*0.3, size*0.2);
    ctx.lineTo(0, 0);
    ctx.lineTo(-size*0.3, size*0.2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // Engine exhaust
    if (speed > 0.02) {
      const exLen = size * 0.8 * speed;
      const grad = ctx.createLinearGradient(0, size*0.4, 0, size*0.4 + exLen);
      grad.addColorStop(0, color.replace('rgb','rgba').replace(')',',0.9)'));
      grad.addColorStop(0.4, color.replace('rgb','rgba').replace(')',',0.4)'));
      grad.addColorStop(1, 'rgba(0,0,8,0)');
      ctx.fillStyle = grad;
      const w = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(-w, size*0.4);
      ctx.lineTo(w, size*0.4);
      ctx.lineTo(w*0.3, size*0.4 + exLen);
      ctx.lineTo(-w*0.3, size*0.4 + exLen);
      ctx.closePath();
      ctx.fill();
    }

    // Ghost overlay
    if (isGhost) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, size*0.7, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  drawShip(XR.you, 'rgb(34,197,94)', false);
  drawShip(XR.ghost, 'rgb(244,63,94)', true);

  // Diff indicator beam between ships
  const absDiff = Math.abs(XR.diffSeconds);
  if (absDiff < 5) {
    const yp = project(XR.you), gp = project(XR.ghost);
    const beamAlpha = (1 - absDiff/5) * 0.3;
    ctx.strokeStyle = `rgba(255,255,255,${beamAlpha})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(yp.px, yp.py);
    ctx.lineTo(gp.px, gp.py);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function updateXHUD(elapsed, youF, ghostKmh, diff) {
  // Speed
  const youKmh = st.currentSpeedKmh;
  document.getElementById('xspeed-you').textContent = youKmh.toFixed(1);
  document.getElementById('xspeed-ghost').textContent = ghostKmh.toFixed(1);

  // Warp levels
  const yw = warpLevelFromKmh(youKmh);
  const gw = warpLevelFromKmh(ghostKmh);
  document.getElementById('xwarp-you').textContent = yw.level;
  document.getElementById('xwarp-ghost').textContent = gw.level;

  // Diff
  const absDiff = Math.abs(diff);
  const diffEl = document.getElementById('xdiff');
  const diffLbl = document.getElementById('xdiff-lbl');
  if (absDiff < 0.5) {
    diffEl.textContent = '0.0s';
    diffEl.style.cssText = '--nc:#fff;--gw:rgba(255,255,255,.2)';
    diffLbl.textContent = 'gleichauf';
  } else if (diff < 0) {
    diffEl.textContent = '+' + absDiff.toFixed(1) + 's';
    diffEl.style.cssText = '--nc:#22c55e;--gw:rgba(34,197,94,.3)';
    diffLbl.textContent = 'vor Ghost';
  } else {
    diffEl.textContent = '-' + absDiff.toFixed(1) + 's';
    diffEl.style.cssText = '--nc:#f43f5e;--gw:rgba(244,63,94,.3)';
    diffLbl.textContent = 'hinter Ghost';
  }

  // Time
  document.getElementById('xtime').textContent = fmt(elapsed);

  // Distance
  const distKm = XR.totalDist / 1000;
  document.getElementById('xdist').textContent = distKm.toFixed(2) + 'km';
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function fmt(ms) {
  const s = Math.floor((ms||0)/1000), m = Math.floor(s/60);
  return String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function haverDist(lat1, lng1, lat2, lng2) {
  const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcDist(route) {
  let d = 0;
  for (let i = 1; i < route.length; i++) d += haverDist(route[i-1].lat, route[i-1].lng, route[i].lat, route[i].lng);
  return d;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

function saveData() { try { localStorage.setItem('bikeGhostRuns', JSON.stringify(st.runs)); } catch(e){} }
function loadData() { try { const s = localStorage.getItem('bikeGhostRuns'); if(s) st.runs = JSON.parse(s); } catch(e){} }

  }
});
