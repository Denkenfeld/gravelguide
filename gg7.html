<style>

 limHit=mFb=true;try{mmap.setTerrain(null);mmap.once('style.load',()=>{mRidesInit();mRides(true);mReady=true;document.body.classList.add('mm')});mmap.setStyle(mFallback(),{diff:false})}catch(e){}say('MapTiler-Limit erreicht · einfache Karte aktiv')}
function mInit(){
 if(maplibregl.config)maplibregl.config.MAX_PARALLEL_IMAGE_REQUESTS=32;
 mmap=new maplibregl.Map({container:'mp',style:mStyleUrl(),center:[8.856553,48.247994],zoom:13,pitch:mview==='2d'?0:55,bearing:mview==='2d'?0:-10,maxPitch:85,antialias:true,maxTileCacheSize:1200,fadeDuration:150});
 mmap.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
 mmap.addControl(new maplibregl.ScaleControl({unit:'metric'}),mob.matches?'bottom-right':'bottom-left');
 mmap.once('style.load',()=>{mStyleLoaded();mFit()});
 setTimeout(()=>{if(!mReady&&mmap&&!limHit){try{mmap.remove()}catch(e){}mmap=null;say('Karte konnte nicht geladen werden')}},9000);
 for(const ev of['move','sourcedata','idle','resize'])mmap.on(ev,()=>{mVer++});
 mmap.on('error',e=>{const st=e&&e.error&&(e.error.status||e.error.statusCode)||((e&&e.error&&e.error.message)||'').match(/\b(402|403)\b/)?.[0];if(st==402||st==403)mLimit()})}
function setView(v){if(v===mview)return;
 const ok=typeof maplibregl!=='undefined';
 if(v!=='live'&&!ok){say('MapLibre konnte nicht geladen werden');return}
 mview=v;document.body.classList.toggle('mv',v!=='live');
 document.querySelectorAll('#vw [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));tip.style.display='none';
 if(!ok)return;
 if(v!=='live'&&nS<rides.length){play=false;bp.textContent='▶';setN(rides.length)}
 if(!mmap)mInit();else{mmap.resize();mApplyTerrain();mRidesVis();mmap.easeTo({pitch:v==='2d'?0:55,bearing:v==='2d'?0:-10,duration:900})}}
document.getElementById('vw').onclick=e=>{const bt=e.target.closest('button');if(!bt)return;const B=document.body;
 if(bt.id==='vwt')B.classList.toggle('vwo');
 else if(bt.id==='lgi'){const l=document.getElementById('lgd');l.open=!l.open;bt.classList.toggle('on',l.open)}
 else if(bt.id==='lyb'){layerMode=(layerMode+1)%3;mApplyLayer()}
 else if(bt.dataset.v){setView(bt.dataset.v);if(mob.matches)B.classList.remove('vwo')}};
window.GravelGuide={importFiles:readFiles};
/* ---------- Start ---------- */
size();let saved=null;try{saved=JSON.parse(localStorage.getItem('axon1'))}catch(e){}
setRaws(saved&&saved.length?saved:[],false);if(typeof maplibregl!=='undefined')mInit();
requestAnimationFrame(frame);
</script><script src="hammerhead-sync.js"></script>
