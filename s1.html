<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GravelGuide</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0e0e12; --surface:rgba(14,14,18,.96); --border:rgba(255,255,255,.1);
  --text:#f0f0f0; --dim:#888; --accent:#00d4ff; --green:#00e676;
  --red:#ff4d6b; --orange:#ff9800; --yellow:#ffd700;
  --font:'Inter',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);}

/* ── MAP ── */
#map{position:fixed;inset:0;z-index:0;}

/* ── OVERLAYS (modals) ── */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);}
.dlg{background:rgba(18,18,24,.98);border:1px solid var(--border);border-radius:20px;
  padding:28px 24px;max-width:360px;width:90%;text-align:center;}
.dlg h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.dlg p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:18px;}
.dlg input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:10px;}
.btn{padding:11px 20px;border-radius:10px;border:1px solid var(--border);cursor:pointer;
  font-size:14px;font-weight:600;font-family:var(--font);transition:.15s;}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

/* ── SHEET (bottom drawer) ── */
#sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--border);
  border-radius:20px 20px 0 0;backdrop-filter:blur(24px);
  height:52vh;display:flex;flex-direction:column;
  transform:translateY(calc(100% - 52px));transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#sheet.open{transform:translateY(0);}
#sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;
  margin:10px auto 0;flex-shrink:0;cursor:pointer;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab-btn{flex:1;padding:11px 8px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent);}
.tab-pane{display:none;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 40px;}
.tab-pane.on{display:block;}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 6px;}
.sc{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 4px;text-align:center;}
.sv{font-size:17px;font-weight:700;}
.sl{font-size:10px;color:var(--dim);margin-top:2px;}
.cal-row{padding:2px 14px 10px;font-size:13px;color:var(--dim);}
.cal-row span{font-weight:700;color:var(--yellow);}

/* Waypoint list */
#wp-list{padding:6px 12px 0;}
.wp-empty{padding:16px 4px;color:var(--dim);font-size:14px;line-height:1.6;}
.wp-item{display:flex;align-items:center;gap:8px;padding:9px 4px;
  border-bottom:1px solid rgba(255,255,255,.05);}
.wp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.wp-name{flex:1;font-size:13px;color:var(--dim);}
.wp-del{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 4px;}

/* Profile buttons */
#prof-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 12px 0;}
.prof-btn{padding:8px 4px;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;color:var(--dim);font-size:12px;text-align:center;cursor:pointer;transition:.15s;}
.prof-btn.on{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.3);color:var(--accent);}

/* Saves list */
#saves-list{padding:0 12px;}
.save-item{display:flex;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.05);}
.save-name{flex:1;font-size:13px;}
.save-meta{font-size:11px;color:var(--dim);}
.save-load{background:rgba(255,255,255,.07);border:none;border-radius:8px;
  padding:5px 10px;color:var(--text);font-size:12px;cursor:pointer;}
.save-del{background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;padding:2px;}

/* Tools buttons */
.tool-row{padding:6px 12px;}
.tool-btn{width:100%;margin-bottom:6px;padding:11px 14px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:11px;color:var(--text);
  font-size:14px;text-align:left;cursor:pointer;transition:.15s;font-family:var(--font);}
.tool-btn:active{background:rgba(255,255,255,.1);}
.tool-btn.on{background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.25);color:var(--green);}
.tool-section{padding:8px 12px 2px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;}

/* ── FABs ── */
.fab{position:fixed;z-index:45;width:50px;height:50px;border-radius:50%;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:.2s;backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.4);}
#fab-locate{right:12px;bottom:calc(52px + 14px);background:rgba(20,20,28,.9);border:1px solid var(--border);}
#fab-navi{right:12px;bottom:calc(52px + 76px);background:rgba(0,230,118,.2);
  border:1px solid rgba(0,230,118,.4);color:var(--green);display:none;}
#fab-navi.visible{display:flex;}
#fab-undo{left:12px;bottom:calc(52px + 14px);background:rgba(20,20,28,.9);border:1px solid var(--border);
  display:none;}
#fab-undo.visible{display:flex;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;z-index:300;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading.hidden{display:none;}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(52vh + 16px);left:50%;transform:translateX(-50%);
  z-index:100;background:rgba(20,20,28,.95);border:1px solid var(--border);
  border-radius:20px;padding:9px 18px;font-size:13px;pointer-events:none;
  opacity:0;transition:opacity .2s;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── NAVIGATION HUD ── */
#navi-hud{position:fixed;top:0;left:0;right:0;z-index:60;display:none;
  padding:env(safe-area-inset-top,0) 0 0;}
#navi-hud.visible{display:block;}
#navi-bar{display:flex;align-items:center;gap:0;
  background:rgba(14,14,18,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);}
.nv{flex:1;text-align:center;padding:12px 4px;}
.nv-val{font-size:22px;font-weight:800;}
.nv-lbl{font-size:10px;color:var(--dim);margin-top:1px;}
#navi-turn{padding:10px 16px;background:rgba(0,212,255,.08);border-bottom:1px solid rgba(0,212,255,.15);
  display:none;align-items:center;gap:12px;}
#navi-turn.visible{display:flex;}
#navi-turn-arrow{font-size:28px;}
#navi-turn-info{flex:1;}
#navi-turn-dist{font-size:20px;font-weight:700;color:var(--accent);}
#navi-turn-street{font-size:13px;color:var(--dim);margin-top:2px;}

/* Navi FABs */
#navi-stop{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:65;
  width:54px;height:54px;border-radius:50%;background:rgba(255,77,107,.2);
  border:2px solid rgba(255,77,107,.5);color:var(--red);font-size:22px;
  cursor:pointer;display:none;backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(255,77,107,.3);}
#navi-stop.visible{display:flex;align-items:center;justify-content:center;}
#navi-zoom{position:fixed;right:12px;bottom:calc(52px + 140px);z-index:65;
  display:none;flex-direction:column;gap:6px;}
#navi-zoom.visible{display:flex;}
.zoom-btn{width:44px;height:44px;border-radius:50%;background:rgba(20,20,28,.9);
  border:1px solid var(--border);color:var(--text);font-size:20px;
  cursor:pointer;backdrop-filter:blur(12px);}

/* Shortcut col (left side during navi) */
#navi-sc{position:fixed;left:12px;bottom:calc(52px + 14px);z-index:65;
  display:none;flex-direction:column;gap:8px;}
#navi-sc.visible{display:flex;}
.sc-fab{width:44px;height:44px;border-radius:50%;background:rgba(20,20,28,.9);
  border:1px solid var(--border);color:var(--text);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);}
.sc-fab.on{background:rgba(0,230,118,.15);border-color:rgba(0,230,118,.3);color:var(--green);}

/* Finish modal */
#finish{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);}
#finish.visible{display:flex;}
#finish-inner{background:rgba(18,18,24,.98);border:1px solid var(--border);border-radius:22px;
  padding:28px 22px;max-width:340px;width:90%;text-align:center;}
.finish-trophy{font-size:48px;margin-bottom:8px;}
.finish-title{font-size:22px;font-weight:800;margin-bottom:16px;}
.finish-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.finish-cell{background:rgba(255,255,255,.04);border-radius:12px;padding:12px 8px;}
.finish-val{font-size:20px;font-weight:700;}
.finish-lbl{font-size:11px;color:var(--dim);margin-top:2px;}
.finish-btns{display:flex;flex-direction:column;gap:8px;}
.finish-btn{padding:12px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.07);color:var(--text);font-size:14px;
  font-weight:600;cursor:pointer;font-family:var(--font);}
.finish-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);}

/* GPX hidden input */
#gpx-file{display:none;}

/* Map marker overrides */
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none;}
</style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- LOADING -->
<div id="loading">
  <div class="spin"></div>
  <div style="color:var(--dim);font-size:14px;">Karte wird geladen…</div>
</div>

<!-- API KEY DIALOG -->
<div class="overlay" id="api-overlay" style="display:none;">
  <div class="dlg">
    <h2>GRAVEL<em style="color:var(--accent)">GUIDE</em></h2>
    <p>Kostenlosen MapTiler-Key eingeben oder Demo-Modus nutzen.</p>
    <input id="api-inp" placeholder="MapTiler API Key" autocomplete="off">
    <div class="btn-row">
      <button class="btn ghost" onclick="launch('')">Demo</button>
      <button class="btn primary" onclick="launch(document.getElementById('api-inp').value.trim())">Starten →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- FABs -->
<button class="fab" id="fab-locate" onclick="locateMe()" title="Standort">📍</button>
<button class="fab" id="fab-navi" onclick="startNavi()" title="Navigation starten">▶</button>
<button class="fab" id="fab-undo" onclick="undoWp()" title="Undo">↩</button>

<!-- NAVIGATION HUD -->
<div id="navi-hud">
  <div id="navi-bar">
    <div class="nv"><div class="nv-val" id="nv-remain">—</div><div class="nv-lbl">Rest km</div></div>
    <div class="nv"><div class="nv-val" id="nv-speed" style="color:var(--accent)">—</div><div class="nv-lbl">km/h</div></div>
    <div class="nv"><div class="nv-val" id="nv-ridden" style="color:var(--green)">0</div><div class="nv-lbl">Gefahren km</div></div>
    <div class="nv"><div class="nv-val" id="nv-climb" style="color:var(--red)">0</div><div class="nv-lbl">↑ hm</div></div>
    <div class="nv"><div class="nv-val" id="nv-time" style="color:var(--yellow)">0:00</div><div class="nv-lbl">Zeit</div></div>
  </div>
  <div id="navi-turn">
    <div id="navi-turn-arrow">↑</div>
    <div id="navi-turn-info">
      <div id="navi-turn-dist">—</div>
      <div id="navi-turn-street">—</div>
    </div>
  </div>
</div>

<!-- Navi controls -->
<button id="navi-stop" onclick="stopNavi()">✕</button>
<div id="navi-zoom">
  <button class="zoom-btn" onclick="map.zoomIn()">+</button>
  <button class="zoom-btn" onclick="map.zoomOut()">−</button>
</div>
<div id="navi-sc">
  <button class="sc-fab" id="sc-3d" onclick="toggle3D()" title="3D">🏔</button>
  <button class="sc-fab" id="sc-sat" onclick="toggleSat()" title="Satellit">🛰</button>
  <button class="sc-fab" id="sc-north" onclick="map.resetNorth()" title="Norden">🧭</button>
  <button class="sc-fab" id="sc-tbt" onclick="toggleTBT()" title="Turn-by-Turn">↗</button>
</div>

<!-- FINISH MODAL -->
<div id="finish">
  <div id="finish-inner">
    <div class="finish-trophy">🏆</div>
    <div class="finish-title">Ziel erreicht!</div>
    <div class="finish-grid">
      <div class="finish-cell"><div class="finish-val" style="color:var(--accent)" id="fn-dist">—</div><div class="finish-lbl">km gefahren</div></div>
      <div class="finish-cell"><div class="finish-val" style="color:var(--green)" id="fn-time">—</div><div class="finish-lbl">Fahrzeit</div></div>
      <div class="finish-cell"><div class="finish-val" style="color:var(--red)" id="fn-climb">—</div><div class="finish-lbl">hm ↑</div></div>
      <div class="finish-cell"><div class="finish-val" style="color:var(--yellow)" id="fn-speed">—</div><div class="finish-lbl">Ø km/h</div></div>
    </div>
    <div class="finish-btns">
      <button class="finish-btn primary" onclick="shareRoute()">🔗 Route teilen</button>
      <button class="finish-btn" onclick="exportGPX()">⬇ GPX exportieren</button>
      <button class="finish-btn" onclick="closeFinish()">✕ Schließen</button>
    </div>
  </div>
</div>

<!-- BOTTOM SHEET -->
<div id="sheet">
  <div id="sheet-handle"></div>
  <div class="tab-bar">
    <button class="tab-btn on" onclick="tab('t-route',this)">Route</button>
    <button class="tab-btn" onclick="tab('t-tools',this)">Tools</button>
    <button class="tab-btn" onclick="tab('t-saves',this)">Gespeichert</button>
  </div>

  <!-- ROUTE TAB -->
  <div class="tab-pane on" id="t-route">
    <div id="prof-btns"></div>
    <div id="wp-list"></div>
    <div class="stats-row" id="stats-row" style="display:none;">
      <div class="sc"><div class="sv" id="s-dist">—</div><div class="sl">km</div></div>
      <div class="sc"><div class="sv" id="s-time" style="color:var(--accent)">—</div><div class="sl">Zeit</div></div>
      <div class="sc"><div class="sv" id="s-up" style="color:var(--red)">—</div><div class="sl">↑ hm</div></div>
      <div class="sc"><div class="sv" id="s-down" style="color:var(--green)">—</div><div class="sl">↓ hm</div></div>
      <div class="sc"><div class="sv" id="s-grade" style="color:var(--orange)">—</div><div class="sl">Max%</div></div>
      <div class="sc"><div class="sv" id="s-speed" style="color:var(--yellow)">—</div><div class="sl">Ø km/h</div></div>
    </div>
    <div class="cal-row" id="cal-row" style="display:none;"><span id="s-cal">—</span> kcal</div>
  </div>

  <!-- TOOLS TAB -->
  <div class="tab-pane" id="t-tools">
    <div class="tool-section">Karte</div>
    <div class="tool-row">
      <button class="tool-btn" id="btn-3d" onclick="toggle3D()">🏔 3D Gebäude</button>
      <button class="tool-btn" id="btn-terrain" onclick="toggleTerrain()">⛰ Terrain 3D</button>
      <button class="tool-btn" id="btn-sat" onclick="toggleSat()">🛰 Satellit / Hybrid</button>
    </div>
    <div class="tool-section">Navigation</div>
    <div class="tool-row">
      <button class="tool-btn" id="btn-tbt" onclick="toggleTBT()">↗ Turn-by-Turn</button>
      <button class="tool-btn" id="btn-wide" onclick="toggleWide()">🛣 Breite Route</button>
    </div>
    <div class="tool-section">Export</div>
    <div class="tool-row">
      <button class="tool-btn" onclick="exportGPX()">⬇ GPX exportieren</button>
      <button class="tool-btn" onclick="document.getElementById('gpx-file').click()">⬆ GPX importieren</button>
      <button class="tool-btn" onclick="shareRoute()">🔗 Route teilen</button>
    </div>
  </div>

  <!-- SAVES TAB -->
  <div class="tab-pane" id="t-saves">
    <div class="tool-row">
      <button class="tool-btn" onclick="saveRoute()">💾 Aktuelle Route speichern</button>
    </div>
    <div id="saves-list" style="padding:0 12px;"></div>
  </div>
</div>

<input type="file" id="gpx-file" accept=".gpx" onchange="importGPX(this)">

<script>
'use strict';

// ── KEYS ─────────────────────────────────────────────────────────
const DEFAULT_KEYS = ['0h9bkxDZifPxKncVxFXv','S0822qXR5bPQF7vH1Ycn','zLcWav205anXVDOQZswt'];
const BROUTER_PROFILES = [
  {id:'trekking',icon:'🚵',label:'Gravel'},
  {id:'fastbike',icon:'🏎',label:'Rennrad'},
  {id:'mtb',icon:'⛰',label:'MTB'},
  {id:'electric',icon:'⚡',label:'E-Bike'},
  {id:'hiking-mountain',icon:'🥾',label:'Hike'},
  {id:'shortest',icon:'📏',label:'Kurz'},
];

// ── STATE ─────────────────────────────────────────────────────────
let map, apiKey = '';
let waypoints = [];          // [{lng,lat,elev?}]
let routeCoords = [];        // [[lng,lat],…] full polyline
let routeElevs  = [];        // [metres,…]
let brouterProfile = 'trekking';
let mapMode = 'outdoor';     // outdoor | satellite | hybrid
let buildings3D = false;
let terrainOn   = false;
let wideRoute   = false;
let tbtOn       = false;

// Navi state
let naviActive  = false;
let naviWatchId = null;
let naviStartTime = null;
let naviClimbM  = 0;
let naviLastElev = null;
let naviRiddenM = 0;
let naviLastPos = null;
let naviPassedIdx = 0;

// ── INIT ──────────────────────────────────────────────────────────
async function autoStart() {
  for (const k of DEFAULT_KEYS) {
    try {
      const r = await fetch(`https://api.maptiler.com/maps/outdoor-v2/style.json?key=${k}`);
      if (r.ok) { launch(k); return; }
    } catch(e) {}
  }
  document.getElementById('api-overlay').style.display = 'flex';
  document.getElementById('loading').classList.add('hidden');
}

function launch(key) {
  apiKey = key;
  document.getElementById('api-overlay').style.display = 'none';
  initMap();
}

function initMap() {
  const styleUrl = apiKey
    ? `https://api.maptiler.com/maps/outdoor-v2/style.json?key=${apiKey}`
    : 'https://demotiles.maplibre.org/style.json';

  map = new maplibregl.Map({
    container: 'map',
    style: styleUrl,
    center: [10.0, 51.5],
    zoom: 6,
    pitch: 0,
    bearing: 0,
    antialias: true,
  });

  map.on('load', () => {
    document.getElementById('loading').classList.add('hidden');
    addRouteLayers();
    renderProfBtns();
    renderSaves();
    loadSettings();
    checkURLHash();
  });

  map.on('click', (e) => {
    if (naviActive) return;
    addWaypoint(e.lngLat.lng, e.lngLat.lat);
  });

  // Long-press to add WP on mobile
  let holdTimer;
  map.on('touchstart', (e) => {
    if (e.points.length > 1 || naviActive) return;
    holdTimer = setTimeout(() => {
      const pt = e.lngLat;
      if (pt) addWaypoint(pt.lng, pt.lat);
    }, 450);
  });
  map.on('touchend', () => clearTimeout(holdTimer));
  map.on('touchmove', () => clearTimeout(holdTimer));

  // Sheet drag
  setupSheetDrag();
}

// ── ROUTE LAYERS ──────────────────────────────────────────────────
function addRouteLayers() {
  map.addSource('route', {type:'geojson', data: emptyFC()});
  map.addSource('wps',   {type:'geojson', data: emptyFC()});

  // Route line (shadow)
  map.addLayer({id:'route-shadow', type:'line', source:'route',
    paint:{'line-color':'#000','line-width': wideRoute ? 14 : 8,'line-opacity':.3,'line-blur':4}});
  // Route line
  map.addLayer({id:'route-line', type:'line', source:'route',
    paint:{'line-color':['case',['get','offRoute'],'#ff4d6b','#00d4ff'],
           'line-width': wideRoute ? 10 : 6, 'line-cap':'round','line-join':'round'}});
  // Waypoint circles
  map.addLayer({id:'wp-circles', type:'circle', source:'wps',
    paint:{'circle-radius':7,'circle-color':['get','color'],
           'circle-stroke-width':2,'circle-stroke-color':'#fff'}});
}

function emptyFC() { return {type:'FeatureCollection',features:[]}; }

function updateRouteLayer() {
  if (!map.getSource('route')) return;
  const fc = routeCoords.length >= 2 ? {
    type:'FeatureCollection',
    features:[{type:'Feature',geometry:{type:'LineString',coordinates:routeCoords},properties:{}}]
  } : emptyFC();
  map.getSource('route').setData(fc);

  const wpfc = {type:'FeatureCollection', features: waypoints.map((w,i) => ({
    type:'Feature',
    geometry:{type:'Point',coordinates:[w.lng,w.lat]},
    properties:{color: i===0?'#00e676': i===waypoints.length-1?'#ff4d6b':'#00d4ff'}
  }))};
  map.getSource('wps').setData(wpfc);

  const w = wideRoute;
  map.setPaintProperty('route-shadow','line-width', w?14:8);
  map.setPaintProperty('route-line','line-width', w?10:6);
}

// ── WAYPOINTS ─────────────────────────────────────────────────────
async function addWaypoint(lng, lat) {
  waypoints.push({lng, lat});
  renderWpList();
  showFab('fab-undo', true);
  if (waypoints.length >= 2) await rebuildRoute();
}

function undoWp() {
  if (!waypoints.length) return;
  waypoints.pop();
  renderWpList();
  if (waypoints.length < 2) { routeCoords = []; routeElevs = []; }
  else rebuildRoute();
  updateRouteLayer();
  updateStats();
  if (!waypoints.length) showFab('fab-undo', false);
}

function clearAll() {
  waypoints = []; routeCoords = []; routeElevs = [];
  renderWpList(); updateRouteLayer(); updateStats();
  showFab('fab-undo', false); showFab('fab-navi', false);
}

function renderWpList() {
  const el = document.getElementById('wp-list');
  if (!waypoints.length) {
    el.innerHTML = '<div class="wp-empty">Karte tippen, um Wegpunkte zu setzen</div>';
    return;
  }
  el.innerHTML = waypoints.map((w,i) => `
    <div class="wp-item">
      <div class="wp-dot" style="background:${i===0?'#00e676':i===waypoints.length-1?'#ff4d6b':'#00d4ff'}"></div>
      <div class="wp-name">${i===0?'Start':i===waypoints.length-1?'Ziel':'WP '+(i+1)}</div>
      <div style="font-size:11px;color:var(--dim)">${w.lat.toFixed(4)}, ${w.lng.toFixed(4)}</div>
      <button class="wp-del" onclick="removeWp(${i})">✕</button>
    </div>`).join('');
}

function removeWp(i) {
  waypoints.splice(i, 1);
  renderWpList();
  if (waypoints.length < 2) { routeCoords = []; routeElevs = []; updateRouteLayer(); updateStats(); }
  else rebuildRoute();
  if (!waypoints.length) showFab('fab-undo', false);
}

// ── ROUTING ───────────────────────────────────────────────────────
async function rebuildRoute() {
  if (waypoints.length < 2) return;
  showToast('Route wird berechnet…');
  const segs = [];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const seg = await fetchBRouter(waypoints[i], waypoints[i+1]);
    if (seg) segs.push(seg);
    else {
      // OSRM fallback
      const fb = await fetchOSRM(waypoints[i], waypoints[i+1]);
      if (fb) segs.push(fb);
    }
  }
  if (!segs.length) { showToast('Keine Route gefunden'); return; }
  routeCoords = segs.flatMap(s => s.coords);
  routeElevs  = segs.flatMap(s => s.elevs || []);
  updateRouteLayer();
  updateStats();
  showFab('fab-navi', true);
  showToast('');
}

async function fetchBRouter(a, b) {
  try {
    const url = `https://brouter.de/brouter?lonlats=${a.lng},${a.lat}|${b.lng},${b.lat}&profile=${brouterProfile}&alternativeidx=0&format=geojson`;
    const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
    const d = await r.json();
    if (!d.features?.length) return null;
    const coords = d.features[0].geometry.coordinates.map(c => [c[0],c[1]]);
    const elevs  = d.features[0].geometry.coordinates.map(c => c[2]!=null?(c[2]>5000?c[2]/10:c[2]):null);
    return {coords, elevs};
  } catch(e) { return null; }
}

async function fetchOSRM(a, b) {
  try {
    const url = `https://router.project-osrm.org/route/v1/cycling/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url, {signal: AbortSignal.timeout(6000)});
    const d = await r.json();
    if (d.code !== 'Ok') return null;
    const coords = d.routes[0].geometry.coordinates.map(c => [c[0],c[1]]);
    return {coords, elevs: coords.map(()=>null)};
  } catch(e) { return null; }
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats() {
  const hasRoute = routeCoords.length >= 2;
  document.getElementById('stats-row').style.display = hasRoute ? 'grid' : 'none';
  document.getElementById('cal-row').style.display   = hasRoute ? 'flex' : 'none';
  if (!hasRoute) return;

  const dist = routeDistance(routeCoords);
  let up = 0, down = 0, maxGrade = 0;
  for (let i = 1; i < routeElevs.length; i++) {
    const e0 = routeElevs[i-1], e1 = routeElevs[i];
    if (e0==null||e1==null) continue;
    const diff = e1-e0;
    if (diff>0) up+=diff; else down+=Math.abs(diff);
    const d = ptDist(routeCoords[i-1], routeCoords[i]);
    if (d>5) maxGrade = Math.max(maxGrade, Math.abs(diff)/d*100);
  }
  const speed = brouterProfile==='fastbike'?25: brouterProfile==='hiking-mountain'?4 : 18;
  const hrs = dist/1000/speed;
  const mins = Math.round(hrs*60);
  const kcal = Math.round(dist/1000 * 40 * (1 + up/5000));

  set('s-dist',  (dist/1000).toFixed(1));
  set('s-time',  mins>=60 ? `${Math.floor(mins/60)}h${String(mins%60).padStart(2,'0')}` : `${mins}min`);
  set('s-up',    Math.round(up)+'m');
  set('s-down',  Math.round(down)+'m');
  set('s-grade', maxGrade.toFixed(1)+'%');
  set('s-speed', speed+'km/h');
  set('s-cal',   kcal);
}

function routeDistance(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += ptDist(coords[i-1], coords[i]);
  return d;
}
function ptDist([lng1,lat1],[lng2,lat2]) {
  const R=6371000, rl=Math.PI/180;
  const dLat=(lat2-lat1)*rl, dLng=(lng2-lng1)*rl;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rl)*Math.cos(lat2*rl)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── PROFILE BUTTONS ──────────────────────────────────────────────
function renderProfBtns() {
  document.getElementById('prof-btns').innerHTML = BROUTER_PROFILES.map(p =>
    `<button class="prof-btn${p.id===brouterProfile?' on':''}" onclick="setProf('${p.id}')">
      ${p.icon} ${p.label}</button>`).join('');
}
function setProf(id) {
  brouterProfile = id;
  renderProfBtns();
  if (waypoints.length >= 2) rebuildRoute();
}

// ── NAVIGATION ────────────────────────────────────────────────────
function startNavi() {
  if (!routeCoords.length) { showToast('Erst Route planen'); return; }
  naviActive = true; naviPassedIdx = 0; naviClimbM = 0; naviRiddenM = 0;
  naviLastElev = null; naviLastPos = null; naviStartTime = Date.now();

  vis('navi-hud'); vis('navi-stop'); vis('navi-zoom'); vis('navi-sc');
  showFab('fab-navi', false); showFab('fab-undo', false);
  document.getElementById('sheet').style.display = 'none';

  map.setPitch(45); map.setBearing(0);

  if (!navigator.geolocation) { showToast('GPS nicht verfügbar'); return; }
  naviWatchId = navigator.geolocation.watchPosition(onNaviPos, ()=>{}, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 5000
  });

  // Start elapsed timer
  naviTimer = setInterval(updateNaviTime, 10000);
}

let naviTimer = null;

function onNaviPos(pos) {
  const {longitude:lng, latitude:lat, altitude, speed} = pos.coords;
  const now = [lng, lat];

  // Elevation gain
  const elev = altitude;
  if (elev != null && naviLastElev != null && elev > naviLastElev) {
    naviClimbM += elev - naviLastElev;
  }
  if (elev != null) naviLastElev = elev;

  // Distance ridden
  if (naviLastPos) naviRiddenM += ptDist(naviLastPos, now) * 1000;
  naviLastPos = now;

  // Find nearest point on route
  let minD = Infinity, nearIdx = 0;
  for (let i = naviPassedIdx; i < Math.min(routeCoords.length, naviPassedIdx+200); i++) {
    const d = ptDist(now, routeCoords[i]);
    if (d < minD) { minD = d; nearIdx = i; }
  }
  if (nearIdx > naviPassedIdx) naviPassedIdx = nearIdx;

  // Remaining distance
  let remM = 0;
  for (let i = naviPassedIdx; i < routeCoords.length-1; i++) {
    remM += ptDist(routeCoords[i], routeCoords[i+1]) * 1000;
  }

  // Update HUD
  set('nv-remain', (remM/1000).toFixed(1));
  set('nv-speed',  speed!=null ? (speed*3.6).toFixed(0) : '—');
  set('nv-ridden', (naviRiddenM/1000).toFixed(1));
  set('nv-climb',  Math.round(naviClimbM));
  updateNaviTime();

  // Turn-by-turn (simple bearing-based)
  if (tbtOn) updateTBT(naviPassedIdx);

  // Follow map
  map.easeTo({center:[lng,lat], bearing: pos.coords.heading||0, pitch:45, duration:800});

  // Arrived?
  const dest = routeCoords[routeCoords.length-1];
  if (ptDist(now, dest) * 1000 < 50) showFinish();
}

function updateNaviTime() {
  if (!naviStartTime) return;
  const s = Math.floor((Date.now()-naviStartTime)/1000);
  set('nv-time', `${Math.floor(s/3600)?Math.floor(s/3600)+'h':''}${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`);
}

function updateTBT(idx) {
  const ahead = Math.min(idx + 30, routeCoords.length-1);
  const dx = routeCoords[ahead][0]-routeCoords[idx][0];
  const dy = routeCoords[ahead][1]-routeCoords[idx][1];
  const angle = Math.atan2(dx,dy)*180/Math.PI;
  const arrows = {'-180':'↓','-135':'↙','-90':'←','-45':'↖','0':'↑','45':'↗','90':'→','135':'↘','180':'↓'};
  const key = Object.keys(arrows).reduce((a,b) => Math.abs(angle-b)<Math.abs(angle-a)?b:a);
  const distToTurn = 0; // simplified
  document.getElementById('navi-turn-arrow').textContent = arrows[key];
  document.getElementById('navi-turn-dist').textContent = '—';
  const el = document.getElementById('navi-turn');
  el.classList.toggle('visible', tbtOn);
}

function stopNavi() {
  naviActive = false;
  if (naviWatchId) navigator.geolocation.clearWatch(naviWatchId);
  clearInterval(naviTimer);
  hide('navi-hud'); hide('navi-stop'); hide('navi-zoom'); hide('navi-sc');
  document.getElementById('navi-turn').classList.remove('visible');
  document.getElementById('sheet').style.display = '';
  map.easeTo({pitch:0, bearing:0, duration:600});
  if (routeCoords.length) showFab('fab-navi', true);
  showFab('fab-undo', waypoints.length > 0);
}

function showFinish() {
  stopNavi();
  const elapsed = Date.now() - naviStartTime;
  const dist = naviRiddenM/1000;
  const hrs  = elapsed/3600000;
  set('fn-dist',  dist.toFixed(1));
  set('fn-time',  `${Math.floor(hrs)}h${String(Math.round((hrs%1)*60)).padStart(2,'0')}`);
  set('fn-climb', Math.round(naviClimbM));
  set('fn-speed', (dist/hrs).toFixed(1));
  vis('finish');
}

function closeFinish() { document.getElementById('finish').classList.remove('visible'); }

// ── MAP TOGGLES ───────────────────────────────────────────────────
function toggle3D() {
  buildings3D = !buildings3D;
  if (buildings3D) {
    if (!map.getLayer('3d-buildings')) {
      map.addLayer({id:'3d-buildings',type:'fill-extrusion',
        source:'composite',
        'source-layer':'building',
        paint:{'fill-extrusion-color':'#2a2a3a',
               'fill-extrusion-height':['get','height'],
               'fill-extrusion-base':['get','min_height'],
               'fill-extrusion-opacity':.8}});
    }
  } else {
    if (map.getLayer('3d-buildings')) map.removeLayer('3d-buildings');
  }
  toggle('btn-3d', buildings3D); toggle('sc-3d', buildings3D);
}

function toggleTerrain() {
  if (!apiKey) { showToast('Kein API Key'); return; }
  terrainOn = !terrainOn;
  if (terrainOn) {
    if (!map.getSource('dem')) map.addSource('dem',{type:'raster-dem',
      url:`https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${apiKey}`,tileSize:256});
    map.setTerrain({source:'dem', exaggeration:1.5});
    map.easeTo({pitch:55, duration:600});
  } else {
    map.setTerrain(null);
    map.easeTo({pitch:0, duration:600});
  }
  toggle('btn-terrain', terrainOn);
}

let satMode = 0; // 0=outdoor 1=sat 2=hybrid
function toggleSat() {
  if (!apiKey) { showToast('Kein API Key für Satellit'); return; }
  satMode = (satMode+1)%3;
  const styles = [
    `https://api.maptiler.com/maps/outdoor-v2/style.json?key=${apiKey}`,
    `https://api.maptiler.com/maps/satellite/style.json?key=${apiKey}`,
    `https://api.maptiler.com/maps/hybrid/style.json?key=${apiKey}`,
  ];
  const labels = ['🛰 Satellit','🗺 Outdoor','🛰 Hybrid'];
  map.setStyle(styles[satMode]);
  map.once('style.load', () => { addRouteLayers(); updateRouteLayer(); });
  document.getElementById('btn-sat').textContent = labels[satMode];
  document.getElementById('sc-sat').textContent  = satMode===0?'🗺':'🛰';
  toggle('btn-sat', satMode!==0); toggle('sc-sat', satMode!==0);
}

function toggleTBT() {
  tbtOn = !tbtOn;
  toggle('btn-tbt', tbtOn); toggle('sc-tbt', tbtOn);
  document.getElementById('navi-turn').classList.toggle('visible', tbtOn && naviActive);
}

function toggleWide() {
  wideRoute = !wideRoute;
  toggle('btn-wide', wideRoute);
  updateRouteLayer();
}

// ── LOCATE ────────────────────────────────────────────────────────
function locateMe() {
  if (!navigator.geolocation) { showToast('GPS nicht verfügbar'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    map.flyTo({center:[pos.coords.longitude, pos.coords.latitude], zoom:14, duration:800});
  });
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportGPX() {
  if (!routeCoords.length) { showToast('Keine Route'); return; }
  const pts = routeCoords.map((c,i) => {
    const e = routeElevs[i];
    return `<trkpt lat="${c[1].toFixed(6)}" lon="${c[0].toFixed(6)}">${e!=null?`<ele>${e.toFixed(1)}</ele>`:''}</trkpt>`;
  }).join('\n');
  const gpx = `<?xml version="1.0"?><gpx version="1.1"><trk><trkseg>${pts}</trkseg></trk></gpx>`;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'})),
    download: 'route.gpx'
  });
  a.click();
}

function importGPX(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const doc = new DOMParser().parseFromString(e.target.result, 'text/xml');
    const pts = [...doc.querySelectorAll('trkpt,wpt')];
    if (!pts.length) { showToast('Keine Punkte gefunden'); return; }
    clearAll();
    const step = Math.max(1, Math.floor(pts.length / 60));
    const sampled = pts.filter((_,i) => i===0||i===pts.length-1||i%step===0);
    sampled.forEach(pt => addWaypoint(+pt.getAttribute('lon'), +pt.getAttribute('lat')));
    showToast(`${sampled.length} Wegpunkte importiert`);
  };
  reader.readAsText(file);
  input.value = '';
}

async function shareRoute() {
  if (!routeCoords.length) { showToast('Keine Route'); return; }
  const pts = waypoints.map(w => `${w.lat.toFixed(5)},${w.lng.toFixed(5)}`).join('|');
  const hash = '#r=' + encodeURIComponent(pts) + '&p=' + brouterProfile;
  const url = location.origin + location.pathname + hash;
  try {
    if (navigator.share) await navigator.share({title:'GravelGuide Route', url});
    else { await navigator.clipboard.writeText(url); showToast('Link kopiert ✓'); }
  } catch(e) { showToast('Link: ' + url); }
}

function checkURLHash() {
  const h = location.hash;
  const rm = h.match(/[#&]r=([^&]+)/);
  const pm = h.match(/[#&]p=([^&]+)/);
  if (!rm) return;
  if (pm) brouterProfile = decodeURIComponent(pm[1]);
  const pts = decodeURIComponent(rm[1]).split('|');
  pts.forEach(p => {
    const [lat,lng] = p.split(',').map(Number);
    if (!isNaN(lat) && !isNaN(lng)) addWaypoint(lng, lat);
  });
  if (waypoints.length) {
    const c = waypoints[Math.floor(waypoints.length/2)];
    map.flyTo({center:[c.lng,c.lat],zoom:11});
  }
}

// ── SAVES ─────────────────────────────────────────────────────────
function saveRoute() {
  if (!routeCoords.length) { showToast('Keine Route'); return; }
  const name = prompt('Name:', 'Route');
  if (!name) return;
  const saves = getSaves();
  saves.push({name, date: new Date().toLocaleDateString('de'), wps: waypoints, profile: brouterProfile});
  localStorage.setItem('gg_saves', JSON.stringify(saves));
  renderSaves(); showToast('Gespeichert ✓');
}

function getSaves() {
  try { return JSON.parse(localStorage.getItem('gg_saves')) || []; } catch(e) { return []; }
}

function renderSaves() {
  const saves = getSaves();
  const el = document.getElementById('saves-list');
  if (!saves.length) { el.innerHTML = '<div class="wp-empty">Noch keine gespeicherten Routen</div>'; return; }
  el.innerHTML = saves.map((s,i) => `
    <div class="save-item">
      <div>
        <div class="save-name">${s.name}</div>
        <div class="save-meta">${s.date}</div>
      </div>
      <button class="save-load" onclick="loadSave(${i})">Laden</button>
      <button class="save-del" onclick="deleteSave(${i})">🗑</button>
    </div>`).join('');
}

function loadSave(i) {
  const s = getSaves()[i];
  if (!s) return;
  clearAll();
  brouterProfile = s.profile || 'trekking';
  renderProfBtns();
  s.wps.forEach(w => addWaypoint(w.lng, w.lat));
  tab('t-route', document.querySelector('.tab-btn'));
}

function deleteSave(i) {
  const saves = getSaves(); saves.splice(i, 1);
  localStorage.setItem('gg_saves', JSON.stringify(saves));
  renderSaves();
}

// ── SETTINGS PERSIST ─────────────────────────────────────────────
function loadSettings() {
  if (localStorage.getItem('gg_wide')==='1') { wideRoute=true; toggle('btn-wide',true); updateRouteLayer(); }
  if (localStorage.getItem('gg_tbt')==='1')  { tbtOn=true; toggle('btn-tbt',true); }
}

// ── SHEET DRAG ────────────────────────────────────────────────────
function setupSheetDrag() {
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('sheet-handle');
  let y0 = 0, open = false;

  const onDown = e => { y0 = (e.touches?.[0]||e).clientY; };
  const onUp = e => {
    const dy = (e.changedTouches?.[0]||e).clientY - y0;
    if (dy < -30) { sheet.classList.add('open'); open=true; }
    if (dy > 30)  { sheet.classList.remove('open'); open=false; }
  };
  handle.addEventListener('touchstart', onDown, {passive:true});
  handle.addEventListener('touchend', onUp, {passive:true});
  handle.addEventListener('click', () => {
    open = !open;
    sheet.classList.toggle('open', open);
  });
}

// ── TABS ──────────────────────────────────────────────────────────
function tab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.getElementById(id)?.classList.add('on');
  // find which button was clicked
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick')?.includes(id)) b.classList.add('on');
  });
}

// ── UTILS ─────────────────────────────────────────────────────────
function set(id, v) { const e = document.getElementById(id); if(e) e.textContent = v; }
function vis(id)    { document.getElementById(id)?.classList.add('visible'); }
function hide(id)   { document.getElementById(id)?.classList.remove('visible'); }
function toggle(id, on) { document.getElementById(id)?.classList.toggle('on', on); }
function showFab(id, show) { document.getElementById(id)?.classList.toggle('visible', show); }

let toastTimer;
function showToast(msg) {
  if (!msg) return;
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── START ─────────────────────────────────────────────────────────
autoStart();
