<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravel Guide – lebende Fahrradkarte</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#04060c;--fg:#cfe6ff;--dim:#6f84a3;--ln:rgba(140,190,255,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
body{height:100%}
:root{--pw:clamp(270px,24vw,330px);--ph:52vh}
#mp{position:fixed;left:0;top:0;width:calc(100% - var(--pw));height:100%;z-index:1;visibility:hidden;pointer-events:none}

body.mv #c{visibility:hidden}
body.mv #lgd,body.mv .at{display:none}
#vw{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--pw) + 16px);z-index:3;display:flex;gap:3px;background:rgba(6,12,24,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:16px;padding:3px}
#vw button{border:0;padding:3px 10px;font-size:11px;border-radius:13px}
#vw button.on{color:#7ffcec;background:rgba(127,252,236,.12);box-shadow:0 0 10px rgba(127,252,236,.3)}
#lyb{display:none;margin-left:4px}body.mv #lyb{display:block}
#c{position:fixed;left:0;top:0;width:calc(100% - var(--pw));height:100%}
#pn{position:fixed;top:0;right:0;bottom:0;width:var(--pw);display:flex;flex-direction:column;background:rgba(4,7,14,.94);border-left:1px solid rgba(140,190,255,.14);z-index:2;padding-top:env(safe-area-inset-top,0px)}
#pc{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 0}
#top{flex:none}
#top section{padding:7px 0;border-top:1px solid rgba(140,190,255,.08)}
#top h1{margin:0;font:200 15px/1.3 system-ui,sans-serif;letter-spacing:.34em;color:#fff;white-space:nowrap}

#hint:empty{display:none}
header{padding-bottom:5px}

.ri{display:flex;gap:10px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:10px;transition:background .15s}
.ri{cursor:pointer}
.ri:hover,.ri.h{background:rgba(127,252,236,.07)}
.ri.s{background:rgba(127,252,236,.12);box-shadow:inset 0 0 0 1px rgba(127,252,236,.45)}
.ri canvas{flex:none;width:64px;height:48px;border-radius:8px;background:rgba(140,190,255,.05);border:1px solid rgba(140,190,255,.1)}
.rt{min-width:0;line-height:1.6;font-size:10.5px;color:var(--dim);white-space:nowrap}

.rt span{display:block;overflow:hidden;text-overflow:ellipsis}

.em{color:var(--dim);font-size:10px;padding:10px 0}
#lgd{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3;width:max-content;max-width:min(320px,calc(100% - var(--pw) - 32px));background:rgba(6,12,24,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:16px;font-size:11px}
#lgd summary{list-style:none;cursor:pointer;user-select:none;padding:6px 12px;color:var(--dim);display:flex;align-items:center;gap:10px}
#lgd summary::-webkit-details-marker{display:none}

#lgd[open] summary::after{transform:rotate(180deg)}
#lgd summary:hover,#lgd[open] summary{color:#7ffcec}
.sr{display:grid;grid-template-columns:56px 78px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:10px;color:var(--dim)}
.sv{text-align:right;color:var(--fg);white-space:nowrap}.sv b{color:#7ffcec;font-weight:400}
.pb{position:relative;height:4px;border-radius:3px;background:rgba(140,190,255,.1)}
.pb s{position:absolute;top:-2px;bottom:-2px;width:1px;background:#fff;opacity:.75;pointer-events:none}
.pb i,.pb em{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.pb i{background:rgba(127,252,236,.22)}
.pb em{background:linear-gradient(90deg,#6e32ff,#1e78ff,#00f0d2);box-shadow:0 0 8px rgba(0,240,210,.55)}
.lg{line-height:1.8;color:var(--dim);font-size:11px;padding:2px 14px 12px}
.lg i{display:inline-block;width:38px;height:3px;margin-right:8px;vertical-align:middle;border-radius:2px}
.lg em{font-style:normal;color:var(--fg)}
.ft{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(140,190,255,.08)}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.r+.r{margin-top:8px}.r button{padding:5px 8px}#bf{flex:1}
#bff.on{border-color:#7ffcec;color:#7ffcec;background:rgba(127,252,236,.1);box-shadow:0 0 10px rgba(127,252,236,.35)}
button{background:none;border:1px solid var(--ln);color:var(--fg);font:inherit;border-radius:20px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7ffcec;color:#7ffcec}
input[type=range]{flex:1;min-width:60px;accent-color:#7ffcec}

#msg{left:calc((100% - var(--pw))/2);transform:translateX(-50%);top:calc(20px + env(safe-area-inset-top,0px))}

#dz{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,16,.7);font-size:18px;letter-spacing:.3em;color:#7ffcec;border:2px dashed #7ffcec;z-index:5}
#ch{display:flex;gap:4px}
#ch button{flex:1;padding:2px 0;font-size:10px;text-align:center}
#ch button:last-child{font-size:13px;line-height:1;padding:3px 0}
#ch button.on{border-color:#7ffcec;color:#7ffcec;background:rgba(127,252,236,.1);box-shadow:0 0 10px rgba(127,252,236,.3)}
.cc{margin:5px 0 0;color:var(--dim);font-size:10px;min-height:12px}.cc b{color:#7ffcec;font-weight:400}
.cn{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.cn u{text-decoration:none;cursor:pointer}.cn u:hover{color:#7ffcec}
.cn button{padding:0 10px;font-size:12px;line-height:18px}
.cg{display:grid;grid-template-columns:20px repeat(7,1fr);gap:2px;margin-top:4px;font-size:9.5px}
.cg>*{height:clamp(14px,1.9vh,18px);display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;color:var(--dim);font-style:normal;font-weight:400;transition:box-shadow .2s}
.cg i{opacity:.5;height:11px;cursor:default}.cg b{font-size:8px;opacity:.45}.cg b:hover{opacity:1;color:#7ffcec}
.cg .o{opacity:.35}.cg .d{color:#fff}.cg .t{text-decoration:underline;text-decoration-color:#7ffcec}
.cg div:hover{background-color:rgba(127,252,236,.14)}
.cg .s{box-shadow:inset 0 0 0 1px #7ffcec,0 0 8px rgba(127,252,236,.4);color:#fff}
@media(max-width:760px){:root{--pw:0px}#c,#mp{width:100%;height:calc(100% - var(--ph))}#pn{top:auto;left:0;width:auto;height:var(--ph);border-left:0;border-top:1px solid rgba(140,190,255,.14)}.at{bottom:calc(var(--ph) + 6px)}#pc{overflow-y:auto}#rl{flex:none;overflow:visible}#top{display:contents}#top>*{flex:none}#top #st{position:sticky;top:0;z-index:2;margin:0 -16px;padding:7px 16px;background:#04070e;border-top:0;border-bottom:1px solid rgba(140,190,255,.14)}}
</style></head><body>
<canvas id="c"></canvas><div id="mp"></div>
<div id="vw"><button data-v="live" class="on">Live</button><button data-v="2d">2D</button><button data-v="3d">3D</button><button id="lyb">🛰 Satellit</button></div>
<aside id="pn"><div id="pc"><div id="top"><header><h1>GRAVEL GUIDE</h1><p id="hint"></p></header>
<section class="tm"><div id="ch"><button data-m="day">Tag</button><button data-m="week">Woche</button><button data-m="month">Monat</button><button data-m="year">Jahr</button><button data-m="all" title="Gesamter Zeitraum">∞</button></div>
<div class="cc" id="cc"></div>

<div class="cg" id="cg"></div></section>
<section id="st"></section></div><div id="rl"></div></div>
<footer class="ft"><div class="r"><button id="bp">❚❚</button><button id="bff" title="Alle Fahrten sofort anzeigen">▶▶</button><input type="range" id="bs" min="0" max="20" value="0"><button id="br">↺</button></div><div class="r"><button id="bn">+ Fahrt</button><button id="bf">FIT laden</button><button id="bc">Löschen</button></div><input type="file" id="fi" accept=".fit" multiple hidden></footer></aside>
<details id="lgd"><summary>Legende</summary><div class="lg">
<div><i style="background:linear-gradient(90deg,#6e32ff,#1e78ff,#00f0d2,#beff3c,#ff50a0)"></i><em>Farbe</em> Tempo 7–50 km/h</div>

<div id="tip"></div><div id="msg"></div><div id="dz">.FIT-DATEIEN HIER ABLEGEN</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),tip=document.getElementById('tip'),msg=document.getElementById('msg'),stEl=document.getElementById('st'),bs=document.getElementById('bs'),bp=document.getElementById('bp'),hint=document.getElementById('hint');
let W,H,dpr,S0=1,zoom=1,S=1,CX,CY,bgG,vgG,yaw=.12,pit=1,mx=.5,my=.5,mxp=-1,myp=-1,hov=null,nS=0,play=true,ff=false,nextT=1,lt=0,rides=[],raws=[],demo=true,cwx=.5,cwy=.5,kpu=1,rad=20,aBase=0,aRange=300,cnt=new Map(),cntN=-1,lhov=null,hlast=null,items=[],sel=null,rm=[],scc={};
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);CX=W/2;CY=H*.57;S0=Math.min(.44*W,.36*H/.85)/rad;
 bgG=g.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);bgG.addColorStop(0,'#0a1222');bgG.addColorStop(1,'#03050a');
 vgG=g.createRadialGradient(CX,CY,Math.min(W,H)*.2,CX,CY,Math.max(W,H)*.62);vgG.addColorStop(0,'rgba(3,5,10,.25)');vgG.addColorStop(1,'rgba(3,5,10,1)')}
addEventListener('resize',size);
const hv=(a,b,c,d)=>{const r=Math.PI/180;return 6371*Math.hypot((d-b)*r*Math.cos((a+c)*r/2),(c-a)*r)};
const mer=(la,lo)=>[(lo+180)/360,.5-Math.log(Math.tan(Math.PI/4+la*Math.PI/360))/(2*Math.PI)];
const ST=[[7,[110,50,255]],[17,[30,120,255]],[27,[0,240,210]],[38,[190,255,60]],[50,[255,80,160]]];
function sc(v){for(let i=1;i<5;i++)if(v<=ST[i][0]||i==4){const a=ST[i-1],b=ST[i],u=Math.max(0,Math.min(1,(v-a[0])/(b[0]-a[0])));return a[1].map((c,k)=>c+(b[1][k]-c)*u)}}
const sm=(a,k)=>a.map((_,i)=>{let s=0,c=0;for(let j=i-k;j<=i+k;j++)if(a[j]!=null){s+=a[j];c++}return c?s/c:0});
/* ---------- FIT-Parser ---------- */
function rd(dv,o,s,bt,le){const sg=bt==1||bt==3||bt==5;
 if(s==1){const v=sg?dv.getInt8(o):dv.getUint8(o);return v===(sg?127:255)?null:v}
 if(s==2){const v=sg?dv.getInt16(o,le):dv.getUint16(o,le);return v===(sg?32767:65535)?null:v}
 if(s==4){if(bt==8)return dv.getFloat32(o,le);const v=sg?dv.getInt32(o,le):dv.getUint32(o,le);return v===(sg?2147483647:4294967295)?null:v}
 return null}
function parseFit(buf){
 const dv=new DataView(buf),hs=dv.getUint8(0);if(String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11))!=='.FIT')throw 0;
 const end=Math.min(buf.byteLength-2,hs+dv.getUint32(4,true)),defs={},recs=[];let p=hs,sess=null,ts=0;
 while(p<end){const h=dv.getUint8(p++);
  if(!(h&0x80)&&(h&0x40)){const lt=h&15;p++;const le=dv.getUint8(p++)===0,gm=dv.getUint16(p,le);p+=2;const nf=dv.getUint8(p++),f=[];
   for(let i=0;i<nf;i++){f.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)&31]);p+=3}
   let dsz=0;if(h&0x20){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){dsz+=dv.getUint8(p+1);p+=3}}defs[lt]={le,gm,f,dsz}}
  else{const lt=(h&0x80)?((h>>5)&3):(h&15),d=defs[lt];if(!d)break;const m={};
   for(const[n,s,bt]of d.f){m[n]=rd(dv,p,s,bt,d.le);p+=s}p+=d.dsz;
   if(h&0x80){ts+=((h&31)-(ts&31))&31;m[253]=ts}if(m[253]!=null)ts=m[253];
   if(d.gm==20)recs.push(m);else if(d.gm==18)sess=m}}
 return{recs,sess}}
function fit2raw(buf,name){
 const{recs,sess}=parseFit(buf),p=recs.filter(m=>m[0]!=null&&m[1]!=null&&m[253]!=null);if(p.length<20)throw 0;
 const D=180/2147483648,la=p.map(m=>m[0]*D),lo=p.map(m=>m[1]*D),cum=[0];
 for(let i=1;i<p.length;i++)cum[i]=cum[i-1]+hv(la[i-1],lo[i-1],la[i],lo[i]);
 const tot=cum[p.length-1];if(tot<.2)throw 0;
 const al=i=>p[i][78]!=null?p[i][78]/5-500:p[i][2]!=null?p[i][2]/5-500:null,av=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const step=Math.max(Math.min(.2,tot/60),tot/350),o={n:name,t:(p[0][253]+631065600)*1000,lat:[la[0]],lon:[lo[0]],alt:[al(0)??0],v:[0],w:[null],dt:[0],kc:sess&&sess[11]||0};
 let l=0,A=[],P=[];
 for(let i=1;i<p.length;i++){const a=al(i);if(a!=null)A.push(a);if(p[i][7]!=null)P.push(p[i][7]);
  if(cum[i]-cum[l]>=step||i==p.length-1){const dt=p[i][253]-p[l][253],d=cum[i]-cum[l];
   o.lat.push(la[i]);o.lon.push(lo[i]);o.alt.push(A.length?av(A):o.alt[o.alt.length-1]);o.v.push(dt>0?Math.min(70,d/dt*3600):20);o.w.push(P.length?av(P):null);o.dt.push(Math.max(0,dt));l=i;A=[];P=[]}}
 o.v[0]=o.v[1];o.w[0]=o.w[1];return o}
/* ---------- Fahrten aufbereiten ---------- */
function prep(o){
 const n=o.lat.length,r={...o,n},alt=sm(o.alt,2);r.alt=alt;
 r.gr=alt.map((_,i)=>{const i0=Math.max(0,i-2),i1=Math.min(n-1,i+2),d=hv(o.lat[i0],o.lon[i0],o.lat[i1],o.lon[i1])||.2;return Math.max(-20,Math.min(20,(alt[i1]-alt[i0])/(d*10)))});
 r.v=sm(o.v,1);r.est=o.w.every(w=>w==null);
 r.w=sm(o.w.map((w,i)=>w!=null?w:Math.min(500,Math.max(0,.24*(r.v[i]/3.6)**3+883*(.005+r.gr[i]/100)*r.v[i]/3.6))),1);
 r.wn=r.w.map(w=>Math.max(0,Math.min(1,(w-30)/330)));r.col=r.v.map(sc);
 let km=0,hs=0,sw=0,kc=0,up=0,mc=[0,0,0];
 for(let i=1;i<n;i++){km+=hv(o.lat[i-1],o.lon[i-1],o.lat[i],o.lon[i]);hs+=o.dt[i]/3600;sw+=r.w[i]*o.dt[i]/3600;kc+=r.w[i]*o.dt[i]/1004;up+=Math.max(0,alt[i]-alt[i-1])}
 r.col.forEach(c=>c.forEach((x,k)=>mc[k]+=x/n));
 Object.assign(r,{km,av:km/(hs||1),aw:sw/(hs||1),kcal:o.kc||kc,up,mc:mc.map(Math.round),grow:0,f:new Float32Array(n).fill(1),tg:new Float32Array(n).fill(1)});
 for(const k of['px','py','gx','gy','wd'])r[k]=new Float32Array(n);return r}
const CELL=.08;
function layout(){
 let a=9,b=-9,c=9,d=-9,lo=1e9,hi=-1e9;
 for(const r of rides){r.m=r.lat.map((la,i)=>mer(la,r.lon[i]));for(const[x,y]of r.m){a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y)}for(const e of r.alt){lo=Math.min(lo,e);hi=Math.max(hi,e)}}
 cwx=(a+b)/2;cwy=(c+d)/2;kpu=40075.016*Math.cos(Math.atan(Math.sinh(Math.PI*(1-2*cwy))));rad=0;
 for(const r of rides){r.x=r.m.map(p=>(p[0]-cwx)*kpu);r.y=r.m.map(p=>(p[1]-cwy)*kpu);for(let i=0;i<r.n;i++)rad=Math.max(rad,Math.hypot(r.x[i],r.y[i]))}
 rad=Math.max(rad*1.08,1.5);aBase=lo;aRange=hi-lo;
 const K=(x,y)=>(Math.floor(x/CELL)+60000)*120007+Math.floor(y/CELL)+60000;
 for(const r of rides){const s=new Set();
  for(let i=0;i<r.n;i++){const j=Math.max(0,i-1),dx=r.x[i]-r.x[j],dy=r.y[i]-r.y[j],m=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(CELL/2)));
   for(let k=1;k<=m;k++){const q=K(r.x[j]+dx*k/m,r.y[j]+dy*k/m);for(let u=-1;u<=1;u++)for(let v=-1;v<=1;v++)s.add(q+u*120007+v)}}
  r.set=s;r.key=r.x.map((x,i)=>K(x,r.y[i]))}
 size()}
function setN(k){
 if(cntN>=0&&k===cntN+1){for(const q of rides[cntN].set)cnt.set(q,(cnt.get(q)||0)+1)}
 else if(k!==cntN){cnt=new Map();for(let i=0;i<k;i++)for(const q of rides[i].set)cnt.set(q,(cnt.get(q)||0)+1)}
 cntN=nS=k;
 for(const r of rides){const raw=r.key.map(q=>cnt.get(q)||1);r.tg=Float32Array.from(raw.map((_,i)=>{let s=0,c=0;for(let j=i-2;j<=i+2;j++)if(raw[j]){s+=raw[j];c++}return s/c}))}
 bs.value=k;stats()}
const UL={day:'bester Tag',week:'beste Woche',month:'bester Monat',year:'bestes Jahr'};
function ukey(t,m){const d=new Date(t);return m==='day'?dk(d):m==='week'?new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime():m==='month'?d.getFullYear()*12+d.getMonth():d.getFullYear()}
function scaleOf(key){if(scc[key])return scc[key];let it;
 if(key==='ride')it=rm.map(x=>[1,x.km,x.kcal,x.up]);
 else{const g=new Map();rm.forEach(x=>{const k=ukey(x.t,key),a=g.get(k)||[0,0,0,0];a[0]++;a[1]+=x.km;a[2]+=x.kcal;a[3]+=x.up;g.set(k,a)});it=[...g.values()]}
