<style>

<header class="g" id="hd"><div class="logo">GRAVEL<em>ANALYSE</em></div><nav id="nav"><button data-v="ov" class="on">Übersicht</button><button data-v="map-s">Karte</button><button data-v="rides">Fahrten</button></nav><span id="st"></span><label class="btn">＋ Import<input type="file" id="fi" multiple accept=".gpx,.fit,.json" hidden></label></header>

<div id="empty" class="g"><h2>Fahrten importieren</h2><p>GPX, FIT und Karoo-JSON – mehrere Dateien auf einmal, oder einfach hierher ziehen.<br>Fahrten aus dem Gravel Guide sind automatisch da.</p><label class="btn" style="display:inline-block;margin:0">＋ Dateien wählen<input type="file" id="fi2" multiple accept=".gpx,.fit,.json" hidden></label></div><div id="toast" class="g"></div>
<script>

const FE=631065600;
const hav=(a,b)=>{const r=Math.PI/180,R=6371000,x=(b[0]-a[0])*r*Math.cos((a[1]+b[1])/2*r),y=(b[1]-a[1])*r;return R*Math.hypot(x,y)};
function parseFit(buf){
 const v=new DataView(buf),hs=v.getUint8(0),end=Math.min(buf.byteLength,hs+v.getUint32(4,true)),defs={},P={c:[],e:[],t:[],p:[],s:[]};
 let pos=hs,ts=0;
 while(pos<end){
  const h=v.getUint8(pos++);let d;
  if(!(h&0x80)&&(h&0x40)){
   const lt=h&15;pos++;const le=v.getUint8(pos++)===0,g=v.getUint16(pos,le);pos+=2;
   const nf=v.getUint8(pos++),f=[];let sz=0;
   for(let i=0;i<nf;i++){f.push([v.getUint8(pos),v.getUint8(pos+1)]);sz+=v.getUint8(pos+1);pos+=3}
   if(h&0x20){const nd=v.getUint8(pos++);for(let i=0;i<nd;i++){sz+=v.getUint8(pos+1);pos+=3}}
   defs[lt]={le,g,f,sz};continue;
  }
  if(h&0x80){d=defs[(h>>5)&3];const o=h&31;let n=(ts&~31)+o;if(o<(ts&31))n+=32;ts=n}else d=defs[h&15];
  if(!d)throw new Error('FIT');
  if(d.g===20){
   const r={};let q=pos;
   for(const [n,s] of d.f){r[n]=s==1?v.getUint8(q):s==2?v.getUint16(q,d.le):s==4?((n==0||n==1)?v.getInt32(q,d.le):v.getUint32(q,d.le)):null;q+=s}
   if(r[253]!=null&&r[253]!==0xFFFFFFFF)ts=r[253];
   if(r[0]!=null&&r[1]!=null&&r[0]!==0x7FFFFFFF&&r[1]!==0x7FFFFFFF){
    const ok=(x,m)=>x!=null&&x!==m;
    const al=ok(r[78],0xFFFFFFFF)?r[78]/5-500:ok(r[2],0xFFFF)?r[2]/5-500:null;
    const sp=ok(r[73],0xFFFFFFFF)?r[73]/1000:ok(r[6],0xFFFF)?r[6]/1000:null;
    P.c.push([r[1]*180/2147483648,r[0]*180/2147483648]);P.e.push(al);P.t.push(ts+FE);P.p.push(ok(r[7],0xFFFF)?r[7]:null);P.s.push(sp==null?null:sp*3.6);
   }
  }
  pos+=d.sz;
 }
 return P;
}
function parseGpx(txt){
 const d=new DOMParser().parseFromString(txt,'application/xml');if(d.querySelector('parsererror'))throw new Error('GPX');
 let pts=[...d.getElementsByTagName('trkpt')];if(pts.length<2)pts=[...d.getElementsByTagName('rtept')];
 const P={c:[],e:[],t:[],p:[],s:[]};
 for(const x of pts){const la=+x.getAttribute('lat'),lo=+x.getAttribute('lon');if(!isFinite(la)||!isFinite(lo))continue;
  const el=x.getElementsByTagName('ele')[0],tm=x.getElementsByTagName('time')[0];
  P.c.push([lo,la]);P.e.push(el?+el.textContent:null);P.t.push(tm?Date.parse(tm.textContent)/1000:null);P.p.push(null);P.s.push(null)}
 const nm=d.querySelector('trk > name, trk > n, rte > name, rte > n');return {P,name:nm&&nm.textContent.trim()};
}
function decPoly(s){const o=[];let i=0,la=0,lo=0;while(i<s.length){for(const k of[0,1]){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const dl=r&1?~(r>>1):r>>1;k?lo+=dl:la+=dl}o.push([lo/1e5,la/1e5])}
 return {c:o,e:o.map(()=>null),t:o.map(()=>null),p:o.map(()=>null),s:o.map(()=>null)}}
function dp(pts,tol){const n=pts.length,keep=new Uint8Array(n);keep[0]=keep[n-1]=1;const st=[[0,n-1]];
 while(st.length){const [a,b]=st.pop();let m=0,mi=-1;const A=pts[a],B=pts[b],dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy;
  for(let i=a+1;i<b;i++){const p=pts[i];let t=L?((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));const e=Math.hypot(p[0]-A[0]-t*dx,p[1]-A[1]-t*dy);if(e>m){m=e;mi=i}}
  if(m>tol&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}}
 const o=[];for(let i=0;i<n;i++)if(keep[i])o.push(i);return o}
function build(P,meta){
 const ix=[];P.c.forEach((c,i)=>{if(Math.abs(c[0])+Math.abs(c[1])>.01&&Math.abs(c[1])<=90&&Math.abs(c[0])<=180)ix.push(i)});
 if(ix.length<2)return null;
 const D=[0];let mt=0,up=0,ref=null,ps=0,pn=0;
 for(let k=1;k<ix.length;k++)D.push(D[k-1]+hav(P.c[ix[k-1]],P.c[ix[k]]));
 const t0=P.t[ix[0]];
 for(let k=0;k<ix.length;k++){const i=ix[k],e=P.e[i];
  if(e!=null){if(ref==null)ref=e;else if(e-ref>=3){up+=e-ref;ref=e}else if(ref-e>=3)ref=e}
  if(P.p[i]!=null){ps+=P.p[i];pn++}
  if(k&&P.t[i]!=null&&P.t[ix[k-1]]!=null){const dt=P.t[i]-P.t[ix[k-1]];if(dt>0&&dt<=10)mt+=dt}}
 const lat0=P.c[ix[0]][1],kx=111320*Math.cos(lat0*Math.PI/180),ky=110540;
 const pr=ix.map(i=>[P.c[i][0]*kx,P.c[i][1]*ky]),kp=dp(pr,4).map(k=>ix[k]),kd=dp(pr,4);
 const tl=P.t[ix[ix.length-1]];
 return {km:D[D.length-1]/1000,hm:Math.round(up),mt,dur:(tl!=null&&t0!=null)?tl-t0:0,pw:pn?Math.round(ps/pn):0,
  date:t0!=null?t0*1000:(meta&&meta.date)||Date.now(),
  c:kp.map(i=>P.c[i]),e:kp.map(i=>P.e[i]),p:kp.map(i=>P.p[i]),s:kp.map(i=>P.s[i]),d:kd.map(k=>D[k]/1000)};
}

const DB=new Promise(r=>{try{const q=indexedDB.open('gg_tracks',1);q.onupgradeneeded=()=>q.result.createObjectStore('t',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=async(m,f)=>{const db=await DB;if(!db)return[];return new Promise(r=>{const t=db.transaction('t',m),q=f(t.objectStore('t'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r([])})};

const $=id=>document.getElementById(id);let T=[],V=[],range=0,per='w',met='km',view='ov',mm='freq',F=null,map=null,CH={},sortK='date',sortD=-1,fb=0;
const KEY=localStorage.getItem('custom_maptiler_key')||'0h9bkxDZifPxKncVxFXv',WT=parseFloat(localStorage.getItem('vn_weight')||75),BW=parseFloat(localStorage.getItem('vn_bike_weight')||12);
const f0=(n,d=0)=>(+n).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:d}),esc=s=>String(s).replace(/[<&]/g,'');
const fH=h=>{const m=Math.round(h*60);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' h'},fD=t=>new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
function showLoad(m){$('st').textContent=m}function hideLoad(){$('st').textContent=''}
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
function prep(){T.forEach(t=>{t.h=(t.mt||t.dur||0)/3600;t.v=t.h?t.km/t.h:0;
 t.kc=t.pw&&t.h?t.pw*t.h*3600/1004:(()=>{const s=t.v||16,M=s<16?5.8:s<22?8.5:s<28?11:14;return M*WT*t.h+t.hm*(WT+BW)*9.81/4186/.25})()});
 T.sort((a,b)=>a.date-b.date);T.forEach((t,i)=>t.col=`hsl(${(i*47)%360},85%,58%)`)}
const kd=(ms,p)=>{const d=new Date(ms),y=d.getFullYear(),m=d.getMonth(),n=d.getDate();return(p=='d'?new Date(y,m,n):p=='w'?new Date(y,m,n-(d.getDay()+6)%7):p=='m'?new Date(y,m,1):new Date(y,0,1)).getTime()};
const nx=(ms,p)=>{const d=new Date(ms),y=d.getFullYear(),m=d.getMonth(),n=d.getDate();return(p=='d'?new Date(y,m,n+1):p=='w'?new Date(y,m,n+7):p=='m'?new Date(y,m+1,1):new Date(y+1,0,1)).getTime()};
const lb=(ms,p)=>{const d=new Date(ms);return p=='y'?d.getFullYear():p=='m'?d.toLocaleDateString('de-DE',{month:'short',year:'2-digit'}):d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
function agg(p){const m={};V.forEach(t=>{const k=kd(t.date,p),a=m[k]||(m[k]={n:0,km:0,hm:0,h:0,kc:0,ps:0,ph:0});a.n++;a.km+=t.km;a.hm+=t.hm;a.h+=t.h;a.kc+=t.kc;if(t.pw){a.ps+=t.pw*t.h;a.ph+=t.h}});
 const ks=Object.keys(m).map(Number).sort((a,b)=>a-b),o=[];if(!ks.length)return o;
 for(let k=ks[0];k<=ks[ks.length-1];k=nx(k,p)){const a=m[k]||{n:0,km:0,hm:0,h:0,kc:0,ps:0,ph:0};a.k=k;a.pw=a.ph?a.ps/a.ph:null;a.v=a.h?a.km/a.h:null;o.push(a)}return o}
const MET={km:'Kilometer',hm:'Höhenmeter',h:'Fahrzeit (h)',kc:'Kalorien (kcal)',n:'Fahrten',pw:'Ø Leistung (W)',v:'Ø Tempo (km/h)'};
function mk(id,cfg){if(CH[id])CH[id].destroy();CH[id]=new Chart($(id),cfg)}
const bar=(l,d,c)=>({type:'bar',data:{labels:l,datasets:[{data:d,backgroundColor:c||'rgba(0,212,255,.55)',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
function rKpi(){const s=f=>V.reduce((a,t)=>a+f(t),0),h=s(t=>t.h),pw=V.filter(t=>t.pw),ph=pw.reduce((a,t)=>a+t.h,0),days=new Set(V.map(t=>kd(t.date,'d'))).size;
 const K=[[V.length,'Fahrten'],[f0(s(t=>t.km)),'Kilometer'],[f0(s(t=>t.hm)),'Höhenmeter'],[fH(h),'Fahrzeit'],[f0(s(t=>t.kc)),'Kalorien kcal'],[ph?f0(pw.reduce((a,t)=>a+t.pw*t.h,0)/ph):'–','Ø Watt'],[h?f0(s(t=>t.km)/h,1):'–','Ø km/h'],[V.length?f0(s(t=>t.km)/V.length,1):'–','Ø km/Fahrt'],[days,'Aktive Tage']];
 $('kpi').innerHTML=K.map(k=>`<div class="g k"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}
function rMain(){const A=agg(per),y=A.map(a=>a[met]),P=y.map((v,i)=>v==null?null:[i,v]).filter(Boolean);let line=[],tr=null;
 if(P.length>2){const mx=P.reduce((s,p)=>s+p[0],0)/P.length,my=P.reduce((s,p)=>s+p[1],0)/P.length;let nu=0,de=0;P.forEach(p=>{nu+=(p[0]-mx)*(p[1]-my);de+=(p[0]-mx)**2});const s=de?nu/de:0;line=A.map((_,i)=>my-s*mx+s*i);tr=my?s*(P.length-1)/my*100:0}
 $('mt').textContent=MET[met]+' pro '+{d:'Tag',w:'Woche',m:'Monat',y:'Jahr'}[per];$('trend').textContent=tr==null?'':`Trend ${tr>=0?'▲':'▼'} ${f0(Math.abs(tr))} % über den Zeitraum`;
 const c=bar(A.map(a=>lb(a.k,per)),y);c.data.datasets.push({type:'line',data:line,borderColor:'#ff9100',borderDash:[6,4],pointRadius:0,borderWidth:2});mk('c-main',c)}
function rCal(){const dk={};V.forEach(t=>{const k=kd(t.date,'d');dk[k]=(dk[k]||0)+t.km});const e=new Date(kd(Date.now(),'w')),NW=53,mx=Math.max(1,...Object.values(dk));let s='';
 for(let w=0;w<NW;w++)for(let d=0;d<7;d++){const k=new Date(e.getFullYear(),e.getMonth(),e.getDate()-(NW-1-w)*7+d).getTime();if(k>Date.now())continue;const v=dk[k]||0;
  s+=`<rect x="${w*14}" y="${d*14}" width="11" height="11" rx="2.5" fill="${v?`rgba(0,212,255,${.2+.8*v/mx})`:'rgba(255,255,255,.05)'}"><title>${fD(k)}: ${f0(v,1)} km</title></rect>`}
 $('cal').innerHTML=`<svg viewBox="0 0 ${NW*14} 98">${s}</svg>`}
function rDist(){const wd=Array(7).fill(0),hr=Array(24).fill(0);V.forEach(t=>{const d=new Date(t.date);wd[(d.getDay()+6)%7]+=t.km;hr[d.getHours()]++});
 mk('c-wd',bar(['Mo','Di','Mi','Do','Fr','Sa','So'],wd.map(v=>+v.toFixed(1)),'rgba(0,230,118,.55)'));mk('c-hr',bar(hr.map((_,i)=>i+'h'),hr,'rgba(255,145,0,.6)'))}
function rRec(){const b=(f,l,fm)=>{const t=V.filter(x=>x.km>2&&f(x)>0).sort((a,c)=>f(c)-f(a))[0];return t?`<div class="rc" data-id="${t.id}"><small>${l}</small><b>${fm(t)}</b><span>${fD(t.date)} · ${esc(t.name)}</span></div>`:''};
 $('rec').innerHTML=b(t=>t.km,'Längste Fahrt',t=>f0(t.km,1)+' km')+b(t=>t.hm,'Meiste Höhenmeter',t=>f0(t.hm)+' m')+b(t=>t.v,'Schnellster Schnitt',t=>f0(t.v,1)+' km/h')+b(t=>t.pw||0,'Höchste Ø-Leistung',t=>t.pw+' W')+b(t=>t.kc,'Meiste Kalorien',t=>f0(t.kc)+' kcal')+b(t=>t.h,'Längste Zeit',t=>fH(t.h))}
function rTab(){const C=[['date','Datum',t=>fD(t.date)],['name','Name',t=>esc(t.name)],['km','km',t=>f0(t.km,1)],['hm','Hm',t=>f0(t.hm)],['h','Zeit',t=>fH(t.h)],['v','km/h',t=>f0(t.v,1)],['pw','Watt',t=>t.pw||'–'],['kc','kcal',t=>f0(t.kc)]];
 const R=[...V].sort((a,b)=>{const x=a[sortK],y=b[sortK];return(x>y?1:x<y?-1:0)*sortD});
 $('tab').innerHTML='<tr>'+C.map(c=>`<th data-s="${c[0]}">${c[1]}${sortK==c[0]?(sortD>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+R.map(t=>`<tr data-id="${t.id}">${C.map(c=>`<td>${c[2](t)}</td>`).join('')}</tr>`).join('')}
const RAMP={freq:[1,'#2b6cff',2,'#00d4ff',4,'#ffd600',8,'#ff9100',16,'#ff3d6b'],grade:[-12,'#2b6cff',-4,'#00d4ff',0,'#7a8aa0',4,'#ffd600',8,'#ff9100',14,'#ff3d6b',20,'#c026d3'],pw:[0,'#2b6cff',120,'#00d4ff',200,'#00e676',280,'#ffd600',380,'#ff9100',500,'#ff3d6b'],spd:[0,'#2b6cff',8,'#00d4ff',16,'#00e676',24,'#ffd600',32,'#ff9100',42,'#ff3d6b']};
const UN={freq:'× befahren',grade:'% Steigung',pw:'W',spd:'km/h'};
function segs(){const f=[],cells={};V.forEach(t=>{if(F&&t.id!=F)return;for(let i=0;i<t.c.length-1;i++){const a=t.c[i],b=t.c[i+1];let v=0,k;
 if(mm=='freq'){k=Math.round((a[1]+b[1])*1500)+','+Math.round((a[0]+b[0])*1050);(cells[k]=cells[k]||new Set).add(t.id)}
 else if(mm=='grade'){const dd=(t.d[i+1]-t.d[i])*1000;if(dd<4||t.e[i]==null||t.e[i+1]==null)continue;v=Math.max(-25,Math.min(25,(t.e[i+1]-t.e[i])/dd*100))}
 else if(mm=='pw'){if(t.p[i]==null||t.p[i+1]==null)continue;v=(t.p[i]+t.p[i+1])/2}
 else if(mm=='spd'){if(t.s[i]==null||t.s[i+1]==null)continue;v=(t.s[i]+t.s[i+1])/2}
 f.push({type:'Feature',properties:{v,k,c:t.col},geometry:{type:'LineString',coordinates:[a,b]}})}});
 if(mm=='freq')f.forEach(x=>x.properties.v=cells[x.properties.k].size);return f}
function mapDraw(){if(!map||!map.getSource||!map.getSource('hm'))return;map.getSource('hm').setData({type:'FeatureCollection',features:segs()});
 const R=RAMP[mm],col=mm=='ride'?['get','c']:['interpolate',['linear'],['get','v'],...R];['hm-glow','hm-line'].forEach(i=>map.setPaintProperty(i,'line-color',col));
 map.setPaintProperty('hm-line','line-width',mm=='freq'?['interpolate',['linear'],['get','v'],1,2.2,16,5.5]:3);
 $('lg').style.background=mm=='ride'?'linear-gradient(90deg,#f55,#5f5,#55f)':`linear-gradient(90deg,${R.filter((_,i)=>i%2).join(',')})`;$('ll').innerHTML=mm=='ride'?'<span>jede Fahrt eigene Farbe</span>':`<span>${R[0]}</span><span>${UN[mm]}</span><span>${R[R.length-2]}+</span>`}
function ensure(){try{if(map.getSource('hm'))return;map.addSource('hm',{type:'geojson',data:{type:'FeatureCollection',features:[]}});const L={'line-join':'round','line-cap':'round'};
 map.addLayer({id:'hm-glow',type:'line',source:'hm',layout:L,paint:{'line-width':9,'line-blur':7,'line-opacity':.28}});
 map.addLayer({id:'hm-line',type:'line',source:'hm',layout:{...L,'line-sort-key':['get','v']},paint:{'line-width':3,'line-opacity':.95}});mapDraw()}catch(e){}}
const FB={version:8,sources:{o:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'o',type:'raster',source:'o'}]};
const sty=()=>`https://api.maptiler.com/maps/${$('bs').value=='d'?'dataviz-dark':'outdoor-v2'}/style.json?key=${KEY}`;
function fitMap(){if(!map)return;const b=new maplibregl.LngLatBounds();let n=0;V.forEach(t=>{if(!F||t.id==F)t.c.forEach(c=>{b.extend(c);n++})});if(n)map.fitBounds(b,{padding:70,duration:700,maxZoom:16})}
function initMap(){if(map)return;map=new maplibregl.Map({container:'map',style:sty(),center:[8.86,48.25],zoom:10});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
 map.on('styledata',ensure);map.on('error',e=>{const s=e&&e.error&&(e.error.status||e.error.statusCode);if((s==402||s==403)&&!fb){fb=1;map.setStyle(FB)}});map.once('load',()=>{ensure();fitMap()})}
function focus(id){F=id;const t=T.find(x=>x.id==id);show('map-s');if(!t)return;$('prof').hidden=false;$('pn').textContent=t.name+' · '+fD(t.date)+' · '+f0(t.km,1)+' km · ↑'+t.hm+' m';
 const ds=[{label:'Höhe',data:t.e,borderColor:'#00e676',backgroundColor:'rgba(0,230,118,.15)',fill:true,pointRadius:0,borderWidth:1.5,yAxisID:'y'}];
 if(t.p.some(p=>p!=null))ds.push({label:'Watt',data:t.p,borderColor:'#ff9100',pointRadius:0,borderWidth:1,yAxisID:'y2'});
 mk('c-pf',{type:'line',data:{labels:t.d.map(d=>d.toFixed(1)),datasets:ds},options:{maintainAspectRatio:false,animation:false,spanGaps:true,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}},y2:{position:'right',display:ds.length>1,grid:{display:false}}}}});mapDraw();setTimeout(fitMap,200)}
function render(){const lim=range?Date.now()-range*864e5:0;V=T.filter(t=>t.date>=lim);$('empty').style.display=T.length?'none':'';
 $('ovc')&&0;if(view=='ov'){rKpi();rMain();rCal();rDist();rRec()}else if(view=='rides')rTab();else{initMap();map.resize();mapDraw()}}
function show(v){view=v;document.querySelectorAll('.v').forEach(s=>s.classList.toggle('on',s.id==v));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 $('pg').style.display=$('ms').style.display=v=='ov'?'':'none';if(v!='map-s'){F=null;$('prof').hidden=true}render();if(v=='map-s')setTimeout(fitMap,300)}
async function load(files){
 showLoad&&showLoad('Lade Fahrten…');const metas={},raw=[];let skip=0;
 for(const f of files){const n=f.name.toLowerCase(),u=(f.name.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/)||[])[0];
  try{if(n.endsWith('.fit'))raw.push({P:parseFit(await f.arrayBuffer()),u,nm:f.name.replace(/\.fit$/i,''),dt:f.lastModified});
   else if(n.endsWith('.gpx')){const r=parseGpx(await f.text());raw.push({P:r.P,nm:r.name||f.name.replace(/\.gpx$/i,''),dt:f.lastModified})}
   else if(n.endsWith('.json')){const j=JSON.parse(await f.text());if(j.name||j.polyline)metas[u||f.name]={name:j.name,poly:j.polyline,date:j.duration&&Date.parse(j.duration.startTime)}}
  }catch(e){skip++}await new Promise(r=>setTimeout(r))}
 const used={};raw.forEach(r=>{if(r.u&&metas[r.u]){r.nm=metas[r.u].name||r.nm;r.meta=metas[r.u];used[r.u]=1}});
 for(const k in metas)if(!used[k]&&metas[k].poly)raw.push({P:decPoly(metas[k].poly),nm:metas[k].name||k,meta:metas[k],dt:metas[k].date});
 let add=0;
 for(const r of raw){try{const b=build(r.P,{date:(r.meta&&r.meta.date)||r.dt});if(!b){skip++;continue}
  const id=Math.round(b.date/1000)+'_'+Math.round(b.km*100);if(T.some(t=>t.id==id))continue;
  const t={id,name:r.nm||'Fahrt',vis:true,...b};T.push(t);add++;idb('readwrite',s=>s.put(t))}catch(e){skip++}}
 hideLoad&&hideLoad();if(add){prep();render()}
 showToast(`✓ ${add} Fahrten geladen${skip?' · '+skip+' übersprungen':''}`);
}

document.getElementById('nav').onclick=e=>e.target.dataset.v&&show(e.target.dataset.v);
$('rg').onclick=e=>{if(e.target.dataset.r==null)return;range=+e.target.dataset.r;[...$('rg').children].forEach(b=>b.classList.toggle('on',b==e.target));render()};
$('pg').onclick=e=>{if(!e.target.dataset.p)return;per=e.target.dataset.p;[...$('pg').children].forEach(b=>b.classList.toggle('on',b==e.target));render()};
$('ms').onchange=e=>{met=e.target.value;render()};$('mg').onclick=e=>{if(!e.target.dataset.m)return;mm=e.target.dataset.m;[...$('mg').children].forEach(b=>b.classList.toggle('on',b==e.target));mapDraw()};
$('bs').onchange=()=>map&&map.setStyle(sty());$('px').onclick=()=>{F=null;$('prof').hidden=true;mapDraw();fitMap()};
$('tab').onclick=e=>{const s=e.target.closest('th');if(s){sortD=sortK==s.dataset.s?-sortD:-1;sortK=s.dataset.s;rTab();return}const r=e.target.closest('tr[data-id]');if(r)focus(r.dataset.id)};
$('rec').onclick=e=>{const r=e.target.closest('.rc');if(r)focus(r.dataset.id)};
['fi','fi2'].forEach(i=>$(i).onchange=e=>{load([...e.target.files]);e.target.value=''});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('drag')}));
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
document.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');if(e.dataTransfer.files.length)load([...e.dataTransfer.files])});
Chart.defaults.color='#8b9bb4';Chart.defaults.borderColor='rgba(255,255,255,.06)';Chart.defaults.font.family="'Barlow Condensed',sans-serif";
(async()=>{T=(await idb('readonly',s=>s.getAll()))||[];prep();show('ov')})();
</script></body></html>
