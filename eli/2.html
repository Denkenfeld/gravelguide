<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 - Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: Kopfzeile mit Reitern, großes Bild als Bühne, Wortkarte rechts (Handy: unten) */
:root{color-scheme:light;--bg:#f2f7ec;--panel:#fff;--panel2:#e5efdc;--line:#bbd0a9;--fg:#1d3321;--muted:#516c4c;--primary:#2c7340;--select:#a44d06;--sun:var(--primary);--teal:var(--select);
--disp:'Baloo 2',ui-rounded,'Trebuchet MS',sans-serif;--body:'Nunito',system-ui,sans-serif;--ipa:'Lucida Sans Unicode','Segoe UI',system-ui,sans-serif}
[hidden]{display:none!important}
html,body{margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 16px/1.5 var(--body)}
.wrap{max-width:1500px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}h1 span{color:var(--primary)}
h2{font-size:1.5rem}h3{font-size:1.15rem}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
nav{display:flex;gap:6px;overflow-x:auto;padding:3px;margin-bottom:12px;scrollbar-width:none}
button,select,input{font:700 .95rem var(--body);color:var(--fg)}
button{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:42px;touch-action:manipulation}
button:hover{border-color:var(--teal)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button[aria-pressed="true"]{background:var(--select);border-color:var(--select);color:#fff}
nav button{white-space:nowrap;font-family:var(--disp);font-size:1.05rem}
nav button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
select,input[type=text],input[type=search]{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:42px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1.5px}.seg button:first-child{border-radius:12px 0 0 12px;margin:0}.seg button:last-child{border-radius:0 12px 12px 0}
.spacer{flex:1}
.stagegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
#stage{overflow:auto;border:2px solid var(--line);border-radius:18px;background:var(--panel);max-height:calc(82vh + 4px);-webkit-overflow-scrolling:touch}
#scene{display:block;margin:0 auto;height:auto;user-select:none;-webkit-user-select:none}
.obj{cursor:pointer}
.obj:hover{filter:brightness(1.08) drop-shadow(0 0 5px #fff)}
.obj.sel{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 9px #ff2f7d)}
.lbl{cursor:pointer}.lbl rect{fill:#fff8e6;stroke:#10132f;stroke-width:2.5}
.lbl text{font:800 23px var(--body);fill:#10132f;text-anchor:middle;dominant-baseline:central}
.lbl:hover rect{fill:#ffd84d}.lbl.sel rect{fill:#ffd84d;stroke-width:4}.lbl.right rect{fill:#8cf0a8}.lbl.wrong rect{fill:var(--coral)}
.lead{stroke:#10132f;stroke-width:2.2;opacity:.8;pointer-events:none}
.leaddot{fill:#10132f;stroke:#fff;stroke-width:1.5;pointer-events:none}
.mk{fill:none;stroke:#e11d62;stroke-width:5;stroke-dasharray:16 12;animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.mk.right{stroke:#16a34a;stroke-width:9}.mk.wrong{stroke:#dc2626;stroke-width:9}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.tw,.mk{animation:none}}
.hint{color:var(--muted);font-size:.9rem;margin:8px 2px 0}
/* Wortkarte */
#card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
#card .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
#thumb{width:100%;aspect-ratio:1.5;border-radius:12px;background:var(--panel2);display:block;margin-bottom:10px}
#cword{font:800 2rem/1.1 var(--disp);overflow-wrap:anywhere}
.ipa{font-family:var(--ipa);color:var(--muted)}
.de{font-size:1.25rem;font-weight:800;color:var(--primary)}
.ex{border-top:1.5px solid var(--line);margin-top:12px;padding-top:10px}
.ex p{margin:0 0 4px}.ex .d{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hide-de .tr{filter:blur(6px);cursor:pointer;user-select:none}
.hide-de .tr.open{filter:none}
#close{min-height:36px;padding:4px 12px}
@media (min-width:1100px){
 .stagegrid.has{grid-template-columns:minmax(0,1fr) 320px}
 #card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
}
@media (max-width:1099px){
 #card{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:20px 20px 0 0;border-width:2px 0 0;max-height:52%;overflow:auto;box-shadow:0 -10px 30px rgba(20,20,40,.25);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
 #thumb{width:92px;aspect-ratio:1;float:right;margin:0 0 6px 10px}
 #cword{font-size:1.6rem}
 body.sheet .wrap{padding-bottom:56vh}
}
/* Wortliste */
.lists{margin-top:22px;display:grid;gap:14px}
.lists h3{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;min-height:38px;padding:6px 14px}
.chip small{color:var(--muted);font-weight:500;margin-left:6px}
.chip.seen{border-color:var(--teal)}
/* Tour-/Quizleiste */
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--primary);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.banner strong{font:700 1.3rem var(--disp)}
/* Detailbereiche */
section.block{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.cards button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:var(--panel2);line-height:1.25;justify-content:flex-start;min-width:0}
.cards svg{width:100%;max-width:150px}.cards small{color:var(--muted);font-weight:500;overflow-wrap:anywhere;hyphens:auto}
.cards button.sel,.cards button:hover{border-color:var(--select);box-shadow:0 0 0 2px var(--select)}
.figure svg{display:block;width:100%;height:auto;margin:12px auto 0}
.elbl{cursor:pointer}.elbl text{font-weight:800;font-family:var(--body);fill:#17213a;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.elbl:hover text,.elbl.sel text{stroke:#ffd84d}
.elbl:focus:not(:focus-visible),.lbl:focus:not(:focus-visible){outline:none}
/* Geschichte */
.story{display:grid;gap:10px;max-width:760px}
.line-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px}
.line-row.now{border-color:var(--primary);background:var(--panel2)}
.who{font:700 .95rem var(--disp);color:var(--primary)}.line-row.s1 .who{color:var(--select)}
.line-row p{margin:0}.line-row .tr{color:var(--muted)}
.vw{all:unset;cursor:pointer;color:var(--primary);font-weight:800;text-decoration:underline;text-underline-offset:3px;border-radius:3px}
.vw:focus-visible{outline:3px solid var(--teal)}
.round{width:46px;height:46px;border-radius:50%;padding:0}
/* Redewendungen */
.idioms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.idiom{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.idiom h3{color:var(--primary);font-size:1.35rem}.idiom p{margin:6px 0 0}.idiom .tr{color:var(--muted)}
/* Quiz */
.quizbox{max-width:640px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px}
.modes{display:grid;gap:10px;margin-top:12px}.modes button{text-align:left;padding:14px 16px}
.modes small{display:block;color:var(--muted);font-weight:500}
.qword{font:800 2.2rem/1.2 var(--disp);margin:10px 0}
.opts{display:grid;gap:8px}.opts button{text-align:left}
.opts button.right{background:#bbf7d0;border-color:#16a34a}.opts button.wrong{background:#fecaca;border-color:#dc2626}
button:disabled{cursor:default;color:var(--fg)}
.fb{min-height:1.6em;font-weight:800;margin:10px 0}
.back{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--fg);font:700 .95rem var(--body);text-decoration:none}
.back:hover{border-color:var(--teal)}.back:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div><a class="back" href="Index.html">← Zurück zum Menu</a></div>
<header>
 <h1>2 - <span>Kitchen</span></h1>
 <div class="bar" style="margin:0">
  <select id="accent" aria-label="Aussprache"><option value="en-GB">Britisches Englisch</option><option value="en-US">Amerikanisches Englisch</option></select>

  <span class="count" id="count"></span>
 </div>
</header>

<nav role="tablist" aria-label="Bereiche">
 <button role="tab" data-v="bild">Bild</button>
 <button role="tab" data-v="detail">Verben &amp; Brot</button>
 <button role="tab" data-v="geschichte">Hörgeschichte</button>
 <button role="tab" data-v="redensarten">Redewendungen</button>
 <button role="tab" data-v="quiz">Quiz</button>
</nav>

<div class="stagegrid" id="grid">
<main style="min-width:0">

<div id="v-bild">
 <div class="bar" id="tools">
  <button class="primary" id="tour">▶ Alle Wörter abspielen</button>
  <div class="seg" role="group" aria-label="Beschriftung im Bild">
   <button data-lab="en">English</button><button data-lab="de">Deutsch</button><button data-lab="q">?</button><button data-lab="off">Aus</button>
  </div>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Bildgröße"><button id="zout" aria-label="Verkleinern">−</button><button id="zfit">Ganzes Bild</button><button id="zin" aria-label="Vergrößern">+</button></div>
 </div>
 <div class="banner" id="tourbar" hidden><strong id="tourpos"></strong><span class="spacer"></span><button id="tprev">⏮ Zurück</button><button id="tpause">⏸ Pause</button><button id="tnext">Weiter ⏭</button><button id="tstop">⏹ Beenden</button></div>
 <div class="banner" id="findbar" hidden><span id="findscore" class="count"></span><strong id="findword"></strong><button id="findplay">🔊 Nochmal</button><span id="findfb" role="status"></span><span class="spacer"></span><button id="findnext" class="primary" hidden>Weiter</button><button id="findstop">Beenden</button></div>
 <div id="stage"></div>
 <p class="hint">Tippe auf ein Ding oder sein Schild, um es zu hören. Wische im Bild, um dich umzusehen. Mit „?“ kannst du dich selbst testen.</p>
 <div class="lists" id="lists">
  <input type="search" id="search" placeholder="Wort suchen (Englisch oder Deutsch)" aria-label="Wort suchen">
  <div id="chiplists"></div>
 </div>
</div>

<div id="v-detail" hidden></div>

<div id="v-geschichte" hidden>
 <h2 id="story-title" lang="en"></h2>
 <div class="bar" style="margin-top:10px">
  <button class="primary" id="splay">▶ Geschichte abspielen</button><button id="sstop">⏹ Stopp</button>
  <select id="role" aria-label="Rolle selbst sprechen"></select>
  <button id="sdone" class="primary" hidden>Fertig gesprochen, weiter</button>
 </div>
 <div class="story" id="story"></div>
</div>

<div id="v-redensarten" hidden><div class="idioms" id="idioms"></div></div>

<div id="v-quiz" hidden><div class="quizbox" id="quiz"></div></div>
</main>

<aside id="card" aria-label="Wortkarte" hidden>
 <svg id="thumb" aria-hidden="true"></svg>
 <div class="top"><div style="min-width:0"><div id="cword" lang="en"></div><div class="ipa" id="cipa"></div></div><button id="close" aria-label="Wortkarte schließen">✕</button></div>
 <div class="de tr" id="cde"></div>
 <div class="btns"><button class="primary" id="say">🔊 Anhören</button><button id="saysyl">🐢 Langsam</button><button id="sayde">🇩🇪 Deutsch</button></div>
 <div class="ex"><p lang="en" id="cex"></p><p class="d tr" id="cexde"></p><div class="btns"><button id="sayex">🔊 Satz anhören</button><button id="prev" aria-label="Voriges Wort">←</button><button id="next" aria-label="Nächstes Wort">→</button></div></div>
</aside>
</div>
</div>

<script>
/* ---------- Zeichenhilfen (eigene 2D-Illustrationen) ---------- */
const INK='#2a2238';
const C=(x,y,r,f,e='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const E=(x,y,rx,ry,f,e='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const P=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const R=(x,y,w,h,r,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${e}/>`;
const L=(d,c,w,e='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${e}/>`;
const O=(w=3)=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const o=O();
const T=(x,y,s,inner,rot=0)=>`<g transform="translate(${x} ${y})${rot?` rotate(${rot})`:''}${s!==1?` scale(${s})`:''}">${inner}</g>`;
const hitC=(x,y,r)=>C(x,y,r,'transparent','class="hit"');
const hitR=(x,y,w,h)=>R(x,y,w,h,8,'transparent','class="hit"');
const times=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
/* Szene sammeln: deco = reine Verzierung, add = anklickbares Ding */
function mkScene(){
 const parts=[],objs=[];
 return {objs,parts,
  deco(s){parts.push(`<g pointer-events="none">${s}</g>`);},
  add(id,f,l,art,a){objs.push({id,f,l,a});parts.push(`<g class="obj" data-id="${id}">${art}</g>`);},
  item(id,x,y,s,ly){this.add(id,[x,y,85*s],[x,ly],T(x,y,s,ART[id]())+hitR(x-85*s,y-60*s,170*s,120*s));}
 };
}
function buildScene(){
 const s=mkScene();LESSON.scene(s);
 return {objs:s.objs,svg:`<svg id="scene" viewBox="0 0 ${LESSON.W} ${LESSON.H}" role="group" aria-label="Bild zum Anklicken"><g id="art">${s.parts.join('')}</g><g id="labels"></g><g id="marker" pointer-events="none" hidden><circle class="mk" r="50"/></g></svg>`};
}
/* Einfache Figur, Füße bei (0,0), ca. 170 hoch */
function person(shirt,pants,hair,skin='#e8b48f',long=false){
 return L('M-14 -70L-18 -8M14 -70L18 -8',pants,17)+E(-22,-5,15,7,INK)+E(22,-5,15,7,INK)+(long?P('M-27 -132Q-34 -170 0 -172Q34 -170 27 -132L24 -118H-24Z',hair,o):'')+L('M-24 -112L-42 -76M24 -112L42 -76',shirt,13)+C(-43,-73,7,skin,O(2))+C(43,-73,7,skin,O(2))+P('M-24 -118Q0 -130 24 -118L29 -64H-29Z',shirt,o)+C(0,-143,22,skin,o)+P('M-23 -146Q-22 -172 2 -167Q24 -168 23 -143Q8 -148 2 -156Q-8 -146 -23 -146Z',hair,O(2))+C(-8,-142,2.4,INK)+C(8,-142,2.4,INK)+L('M-6 -132q6 5 12 0',INK,2.2);
}
const ART={};

const WORDS=[
['fridge','refrigerator','der Kühlschrank','rɪˈfrɪdʒəreɪtə','Put the milk in the refrigerator.','Stell die Milch in den Kühlschrank.','big'],
['freezer','freezer','das Gefrierfach','ˈfriːzə','The ice cream is in the freezer.','Das Eis ist im Gefrierfach.','big'],
['cupboard','cupboard','der Küchenschrank','ˈkʌbəd','The plates are in the cupboard.','Die Teller sind im Schrank.','big'],
['drawer','drawer','die Schublade','drɔː','Forks are in the top drawer.','Die Gabeln sind in der obersten Schublade.','big'],

['fan','extractor fan','die Dunstabzugshaube','ɪkˈstræktə fæn','Switch on the extractor fan.','Schalte die Dunstabzugshaube ein.','big'],

['toaster','toaster','der Toaster','ˈtəʊstə','The bread is in the toaster.','Das Brot ist im Toaster.','app'],
['kettle','kettle','der Wasserkocher','ˈketəl','Put the kettle on, please.','Setz bitte Wasser auf.','app'],
['coffeepot','coffee pot','die Kaffeekanne','ˈkɒfi pɒt','The coffee pot is full.','Die Kaffeekanne ist voll.','app'],
['mixer','food mixer','die Küchenmaschine','ˈfuːd ˌmɪksə','The food mixer makes the dough.','Die Küchenmaschine knetet den Teig.','app'],

['knife','knife','das Messer','naɪf','This knife is very sharp.','Dieses Messer ist sehr scharf.','tools'],
['board','chopping board','das Schneidebrett','ˈtʃɒpɪŋ bɔːd','Cut the onion on the chopping board.','Schneide die Zwiebel auf dem Brett.','tools'],
['pin','rolling pin','das Nudelholz','ˈrəʊlɪŋ pɪn','Roll the dough with a rolling pin.','Roll den Teig mit dem Nudelholz aus.','tools'],
['whisk','whisk','der Schneebesen','wɪsk','Beat the eggs with a whisk.','Verquirle die Eier mit dem Schneebesen.','tools'],
['grater','grater','die Reibe','ˈɡreɪtə','Use the grater for the cheese.','Nimm die Reibe für den Käse.','tools'],
['peeler','vegetable peeler','der Sparschäler','ˈvedʒtəbəl ˌpiːlə','Where is the vegetable peeler?','Wo ist der Sparschäler?','tools'],

const synth=window.speechSynthesis;let voices=[],run=0,keep=null;
if(synth){const load=()=>voices=synth.getVoices();load();synth.addEventListener&&synth.addEventListener('voiceschanged',load);}else $('#nospeech').hidden=false;
function voiceFor(lang){
 const norm=v=>v.lang.replace('_','-');
 const list=voices.filter(v=>norm(v)===lang);
 const pool=list.length?list:voices.filter(v=>norm(v).startsWith(lang.slice(0,2)));
 const nice=/Google|Natural|Premium|Enhanced|Daniel|Serena|Kate|Samantha|Anna|Karen/i;
 return pool.find(v=>nice.test(v.name))||pool.find(v=>v.default)||pool[0];
}
function stopAll(){run++;if(synth)synth.cancel();stopTour(true);storyIdle();}
/* Spricht einen Text; das Versprechen endet auch dann, wenn der Browser kein Ende meldet */
function speak(text,{de=false,slow=opt.slow,pitch=1}={}){
 return new Promise(res=>{
  const est=1200+text.length*(slow?150:95);
  if(!synth){setTimeout(res,est);return;}
  const u=new SpeechSynthesisUtterance(text);keep=u;
  u.lang=de?'de-DE':opt.accent;const v=voiceFor(u.lang);if(v)u.voice=v;
  u.rate=slow?.6:.95;u.pitch=pitch;
  let done=false;const end=()=>{if(!done){done=true;clearTimeout(t);res();}};
  const t=setTimeout(end,est*1.8);u.onend=end;u.onerror=end;
  synth.speak(u);
 });
}
function say(text,o){stopAll();return speak(text,o);}

/* Zoom */
let zoom=null,whole=true;
/* "Ganzes Bild": die komplette Grafik passt in Breite und Höhe auf den Bildschirm */
function fitWidth(){
 const w=Math.max(280,stage.clientWidth),below=innerHeight-(stage.getBoundingClientRect().top+scrollY)-12;
 const h=below>=innerHeight*.55?below:innerHeight-16;
 return Math.min(w,Math.max(280,Math.floor((h-4)*LW/LH)));
}
function applyZoom(w){zoom=w;scene.style.width=w+'px';stage.style.maxHeight=whole?'none':'';$('#zfit').setAttribute('aria-pressed',whole);}
function showWhole(){whole=true;applyZoom(fitWidth());stage.scrollLeft=stage.scrollTop=0;}
function setZoom(w){
 const cx=(stage.scrollLeft+stage.clientWidth/2)/zoom,cy=(stage.scrollTop+stage.clientHeight/2)/zoom,f=fitWidth();
 const next=Math.min(3600,Math.max(f,w));whole=next<=f+1;applyZoom(next);
 stage.scrollLeft=cx*next-stage.clientWidth/2;stage.scrollTop=cy*next-stage.clientHeight/2;
}
$('#zin').onclick=()=>setZoom(zoom*1.5);$('#zout').onclick=()=>setZoom(zoom/1.5);$('#zfit').onclick=showWhole;
function focusOn(id){
 const o=OBJ[id];if(!o||!zoom)return;const k=scene.getBoundingClientRect().width/LW;
 const x=(o.f[0]+o.l[0])/2*k,y=(o.f[1]+o.l[1])/2*k;
 if(!whole)stage.scrollTo({left:x-stage.clientWidth/2,top:y-stage.clientHeight/2,behavior:'smooth'});
 const card=$('#card');
 if(!card.hidden&&getComputedStyle(card).position==='fixed'){
  const r=stage.getBoundingClientRect(),free=innerHeight-card.offsetHeight;
  const bar=$$('#tourbar,#findbar').find(b=>!b.hidden);let delta;
  if(whole&&stage.offsetHeight<=free-8){
   const top=bar&&bar.offsetHeight+stage.offsetHeight+20<=free?bar:stage;delta=top.getBoundingClientRect().top-6;
  }else delta=r.top+(whole?y:Math.min(stage.clientHeight/2,y))-Math.max(70,free/2);
  window.scrollBy({top:delta,behavior:'smooth'});
 }
}

/* ---------- Tour: alles abspielen ---------- */
let tour=null;
function stopTour(silent){if(!tour)return;tour=null;$('#tourbar').hidden=true;}
async function tourStep(){
 const me=++run;if(synth)synth.cancel();
 const t=tour,id=t.ids[t.i];
 select(id,{speakIt:false,scroll:true});
 $('#tourpos').textContent=`${t.i+1} / ${t.ids.length}  ${W[id].en}`;
 const alive=()=>me===run&&tour===t&&!t.paused;
 await speak(W[id].en);if(!alive())return;await wait(450);if(!alive())return;
 if(opt.showde){await speak(W[id].de.split(' / ')[0].replace(/[()]/g,''),{de:true,slow:false});if(!alive())return;await wait(350);if(!alive())return;}
 await speak(W[id].ex);if(!alive())return;await wait(900);if(!alive())return;
 if(t.i<t.ids.length-1){t.i++;tourStep();}else{stopTour();}
}
function startTour(ids,start=0){
 stopAll();tour={ids,i:start,paused:false};
 if(view==='bild'){$('#tourbar').hidden=false;$('#tpause').textContent='⏸ Pause';}
 tourStep();
}
$('#tour').onclick=()=>startTour(SCENE_IDS,Math.max(0,SCENE_IDS.indexOf(current)));
$('#tstop').onclick=()=>stopAll();
$('#tpause').onclick=()=>{if(!tour)return;tour.paused=!tour.paused;$('#tpause').textContent=tour.paused?'▶ Weiter abspielen':'⏸ Pause';if(tour.paused){run++;synth&&synth.cancel();}else tourStep();};
const jump=d=>{if(!tour)return;tour.i=(tour.i+d+tour.ids.length)%tour.ids.length;tour.paused=false;$('#tpause').textContent='⏸ Pause';tourStep();};
$('#tprev').onclick=()=>jump(-1);$('#tnext').onclick=()=>jump(1);

/* ---------- Einstellungen ---------- */
$('#accent').value=opt.accent;
$('#accent').onchange=e=>{opt.accent=e.target.value;store.set('accent',opt.accent);if(current)openCard(current);say('Hello! Let us learn some English.');};
function applyToggles(){$('#slow').setAttribute('aria-pressed',opt.slow);$('#showde').setAttribute('aria-pressed',opt.showde);$('#showde').textContent=opt.showde?'Deutsch sichtbar':'Deutsch verdeckt';document.body.classList.toggle('hide-de',!opt.showde);$$('.tr0').forEach(e=>e.hidden=!opt.showde);$$('.tr').forEach(e=>e.classList.remove('open'));}
$('#slow').onclick=()=>{opt.slow=!opt.slow;store.set('slow',opt.slow);applyToggles();};
$('#showde').onclick=()=>{opt.showde=!opt.showde;store.set('showde',opt.showde);applyToggles();};
$$('[data-lab]').forEach(b=>b.onclick=()=>{opt.lab=b.dataset.lab;revealed=new Set();store.set('lab',opt.lab);drawLabels();});

/* ---------- Detailbereiche ---------- */
function renderDetails(){
 $('#v-detail').innerHTML=LESSON.details.map((s,i)=>{
  let body;
  if(s.type==='cards')body=`<div class="cards">${s.ids.map(id=>`<button data-id="${id}"><svg viewBox="-90 -75 180 150" aria-hidden="true">${ART[id]()}</svg><span lang="en">${W[id].en}</span><small class="tr" lang="de">${W[id].de}</small></button>`).join('')}</div>`;
  else body=`<div class="figure"><svg viewBox="${s.viewBox}" style="max-width:${s.maxWidth||760}px"><g id="fig${i}">${s.svg()}</g>${s.labels.map(([id,x,y,ax,ay])=>`<g class="elbl" data-id="${id}" tabindex="0" role="button">${ax!==undefined?L(`M${ax} ${ay}L${Math.abs(ay-y)<30?x+(ax<x?-1:1)*W[id].en.length*(s.font||22)*.3:x} ${Math.abs(ay-y)<30?y:y+(ay>y?1:-1)*(s.font||22)*.75}`,'#33405c',2)+C(ax,ay,4,'#33405c'):''}<text x="${x}" y="${y}" style="font-size:${s.font||22}px">${W[id].en}</text></g>`).join('')}</svg></div>`;
  return `<section class="block"><h2>${s.title}</h2><p class="hint">${s.hint}</p>${body}<div class="btns"><button class="primary" data-play="${i}">▶ Alle abspielen</button></div></section>`;
 }).join('');
}
const detailPick=e=>{
 const p=e.target.closest('[data-play]');if(p)return startTour(LESSON.details[p.dataset.play].ids);
 const g=e.target.closest('[data-id]');if(g)select(g.dataset.id);
};
$('#v-detail').onclick=detailPick;
$('#v-detail').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('g[data-id]')){e.preventDefault();detailPick(e);}};

/* ---------- Hörgeschichte ---------- */
const STORY=LESSON.story.lines,SPEAKERS=Object.keys(LESSON.story.voices);
const plain=s=>s.replace(/\[\[\w+\|([^\]]+)\]\]/g,'$1');
$('#story').innerHTML=STORY.map((l,i)=>`<div class="line-row s${SPEAKERS.indexOf(l[0])}" data-i="${i}"><button class="round" aria-label="Zeile anhören">▶</button><div><div class="who">${l[0]}</div><p lang="en">${l[1].replace(/\[\[(\w+)\|([^\]]+)\]\]/g,'<button class="vw" data-w="$1">$2</button>')}</p><p class="tr">${l[2]}</p></div></div>`).join('');
let waiting=null;
function storyIdle(){$$('.line-row').forEach(r=>r.classList.remove('now'));$('#sdone').hidden=true;waiting=null;}
const voiceOpt=who=>({pitch:LESSON.story.voices[who]});
$('#story-title').textContent=LESSON.story.title;
$('#role').innerHTML='<option value="">Alles anhören</option>'+SPEAKERS.map(n=>`<option value="${n}">Ich spreche ${n}</option>`).join('');
$('#story').onclick=e=>{
 const v=e.target.closest('.vw');if(v){select(v.dataset.w);return;}
 const b=e.target.closest('.round');if(!b)return;
 const r=b.closest('.line-row'),l=STORY[r.dataset.i];
 say(plain(l[1]),voiceOpt(l[0]));r.classList.add('now');const me=run;setTimeout(()=>{if(me===run)r.classList.remove('now')},1500+l[1].length*80);
};
async function playStory(from=0){
 stopAll();const me=run,role=$('#role').value;
 for(let i=from;i<STORY.length;i++){
  const l=STORY[i],r=$(`.line-row[data-i="${i}"]`);
  $$('.line-row').forEach(x=>x.classList.toggle('now',x===r));
  r.scrollIntoView({behavior:'smooth',block:'center'});
  if(l[0]===role){$('#sdone').hidden=false;$('#sdone').scrollIntoView({block:'nearest'});r.scrollIntoView({behavior:'smooth',block:'center'});
   await new Promise(res=>waiting=res);if(me!==run)return;}
  else{await speak(plain(l[1]),voiceOpt(l[0]));if(me!==run)return;await wait(500);if(me!==run)return;}
 }
 storyIdle();
}
$('#splay').onclick=()=>playStory();$('#sstop').onclick=()=>stopAll();
/* Weiter-Knopf bleibt beim Rollenspiel unten sichtbar */
Object.assign($('#sdone').style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'calc(env(safe-area-inset-bottom, 0px) + 16px)',zIndex:30,boxShadow:'0 6px 24px #000a'});
$('#sdone').onclick=()=>{const w=waiting;waiting=null;$('#sdone').hidden=true;if(w)w();};

/* ---------- Redewendungen ---------- */
const IDIOMS=LESSON.idioms;
$('#idioms').innerHTML=IDIOMS.map((d,i)=>`<article class="idiom"><h3 lang="en">${d[0]}</h3><p class="tr"><strong>${d[1]}</strong></p><p lang="en">${d[2]}</p><p class="tr">${d[3]}</p><p lang="en" style="margin-top:12px"><em>“${d[4]}”</em></p><p class="tr">${d[5]}</p><div class="btns"><button class="primary" data-i="${i}" data-p="0">🔊 Redewendung</button><button data-i="${i}" data-p="4">🔊 Beispiel</button></div></article>`).join('');
$('#idioms').onclick=e=>{const b=e.target.closest('button[data-i]');if(b)say(IDIOMS[b.dataset.i][b.dataset.p]);};

/* ---------- Quiz ---------- */
const best=store.get('best',{});
function quizMenu(){
 const b=k=>best[k]!==undefined?` Bestwert: ${best[k]} / 10`:'';
 $('#quiz').innerHTML=`<h2>Wähle ein Spiel</h2><div class="modes">
 <button data-m="find">Finde es im Bild<small>Du hörst ein Wort und tippst auf das richtige Ding.${b('find')}</small></button>
 <button data-m="choice">Übersetzen<small>Wähle die richtige Übersetzung.${b('choice')}</small></button>
 <button data-m="spell">Hören und schreiben<small>Schreibe das englische Wort auf.${b('spell')}</small></button></div>`;
}
let q=null;
function saveBest(m,s){if(best[m]===undefined||s>best[m]){best[m]=s;store.set('best',best);}}
function result(m,score){saveBest(m,score);$('#quiz').innerHTML=`<h2>${score>=8?'Fantastisch!':score>=5?'Gut gemacht!':'Weiter üben!'}</h2><div class="qword">${score} / 10</div><div class="btns"><button class="primary" data-m="${m}">Nochmal spielen</button><button data-m="menu">Anderes Spiel</button></div>`;}
$('#quiz').addEventListener('click',e=>{
 const m=e.target.closest('[data-m]');
 if(m){stopAll();const k=m.dataset.m;if(k==='menu')return quizMenu();if(k==='find')return startFind();q={m:k,list:shuffle(WORDS).slice(0,10),i:0,score:0};return ask();}
});
function ask(){
 const w=q.list[q.i],head=`<div class="count">Frage ${q.i+1} / 10 · Punkte ${q.score}</div>`;
 if(q.m==='choice'){
  const en=q.i%2===0,key=en?'de':'en';
  const opts=shuffle([w,...shuffle(WORDS.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,3)]);
  $('#quiz').innerHTML=head+`<div class="qword">${en?w.en:w.de}</div>${en?'<div class="btns" style="margin:0 0 12px"><button id="qsay">🔊 Anhören</button></div>':''}<div class="opts">${opts.map(o=>`<button data-a="${o.id}">${o[key]}</button>`).join('')}</div><div class="fb" role="status"></div><div class="btns"><button class="primary" id="qnext" hidden>Weiter</button><button data-m="menu">Beenden</button></div>`;
  if(en){$('#qsay').onclick=()=>say(w.en);say(w.en);}
  $$('#quiz [data-a]').forEach(b=>b.onclick=()=>{
   const ok=b.dataset.a===w.id;if(ok)q.score++;
   $$('#quiz [data-a]').forEach(x=>{x.disabled=true;if(x.dataset.a===w.id)x.classList.add('right');});
   if(!ok)b.classList.add('wrong');
   $('#quiz .fb').textContent=ok?'Richtig!':`Leider nein. ${w.en} = ${w.de}`;
   say(w.en);$('#qnext').hidden=false;
  });
 }else{
  $('#quiz').innerHTML=head+`<div class="btns"><button class="primary" id="qsay">🔊 Wort anhören</button><button id="qslow">🐢 Langsam</button><button id="qhint">Tipp</button></div><div class="fb" id="hint"></div><form id="qform" class="bar"><input type="text" id="qin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Englisches Wort" aria-label="Englisches Wort"><button type="submit">Prüfen</button></form><div class="fb" id="res" role="status"></div><div class="btns"><button class="primary" id="qnext" hidden>Weiter</button><button data-m="menu">Beenden</button></div>`;
  $('#qsay').onclick=()=>say(w.en,{slow:false});$('#qslow').onclick=()=>say(w.en,{slow:true});
  $('#qhint').onclick=()=>$('#hint').textContent=`Deutsch: ${w.de}`;
  let done=false;const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[\s-]+/g,'').trim();
  $('#qform').onsubmit=e=>{e.preventDefault();const v=$('#qin').value;if(done||!v.trim())return;done=true;
   const ok=norm(v)===norm(w.en);if(ok)q.score++;
   $('#res').textContent=ok?`Richtig! ${w.de}`:`So schreibt man es: ${w.en} (${w.de})`;$('#res').style.color=ok?'#15803d':'#b91c1c';
   $('#qin').disabled=true;$('#qnext').hidden=false;$('#qnext').focus({preventScroll:true});};
  say(w.en);
 }
 $('#qnext').onclick=()=>{stopAll();q.i++;q.i<10?ask():result(q.m,q.score);};
}
/* Spiel im Bild */
const ALSO=LESSON.also||{};
function startFind(){
 closeCard();find={list:shuffle(SCENE_IDS).slice(0,10),i:0,score:0,tries:0,done:false};
 show('bild');$('#findbar').hidden=false;$('#tools [data-lab]').parentElement.hidden=true;$('#tour').hidden=true;$('#lists').hidden=true;
 drawLabels();askFind();$('#findbar').scrollIntoView({block:'start'});
}
function askFind(){
 find.tries=0;find.done=false;unmark();const w=W[find.list[find.i]];
 $('#findscore').textContent=`${find.i+1} / 10 · Punkte ${find.score}`;$('#findword').textContent=`Find: ${w.en}`;$('#findfb').textContent='';$('#findnext').hidden=true;say(w.en);
}
function answerFind(id){
 if(find.done)return;const target=find.list[find.i],ok=id===target||(ALSO[target]||[]).includes(id);
 if(ok){find.done=true;if(!find.tries)find.score++;mark(target,'right');$('#findfb').textContent=`Richtig! ${W[target].de}`;say('Well done!');}
 else{find.tries++;
  if(find.tries<2){mark(id,'wrong');$('#findfb').textContent=`Das ist „${W[id].en}“. Versuch es noch einmal.`;say(W[id].en);return;}
  find.done=true;mark(target,'right');focusOn(target);$('#findfb').textContent=`Hier ist es: ${W[target].de}`;say(W[target].en);}
 $('#findscore').textContent=`${find.i+1} / 10 · Punkte ${find.score}`;$('#findnext').hidden=false;
}
function endFind(){find=null;$('#findbar').hidden=true;$('#tools [data-lab]').parentElement.hidden=false;$('#tour').hidden=false;$('#lists').hidden=false;unmark();drawLabels();}
$('#findplay').onclick=()=>say(W[find.list[find.i]].en);
$('#findnext').onclick=()=>{find.i++;if(find.i<10)return askFind();const s=find.score;endFind();show('quiz');result('find',s);};
$('#findstop').onclick=()=>{stopAll();endFind();show('quiz');quizMenu();};

/* ---------- Reiter ---------- */
const VIEWS=['bild','detail','geschichte','redensarten','quiz'];
function show(v){
 view=v;VIEWS.forEach(n=>$('#v-'+n).hidden=n!==v);
 $$('nav [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 if(v==='bild'){whole=true;refit();}
}
$$('nav [data-v]').forEach(b=>b.onclick=()=>{
 stopAll();if(find)endFind();closeCard();show(b.dataset.v);if(b.dataset.v==='quiz')quizMenu();
 try{history.replaceState(null,'','#'+b.dataset.v)}catch(e){}
});
function route(){const h=location.hash.slice(1);stopAll();if(find)endFind();closeCard();show(VIEWS.includes(h)?h:'bild');if(h==='quiz')quizMenu();}
addEventListener('hashchange',route);

drawLabels();applyToggles();updateCount();quizMenu();route();
document.fonts&&document.fonts.ready.then(drawLabels);
document.fonts&&document.fonts.load("800 23px Nunito").then(drawLabels).catch(()=>{});

</script>
</body>
