<style>

body{font:800 20px Nunito,system-ui,sans-serif;color:#1d2a4a;background:radial-gradient(circle at 6% 0,#ffc29a 330px,#0000 331px),radial-gradient(circle at 100% 100%,#8fd3ff 400px,#0000 401px),radial-gradient(circle at 93% 7%,#c9b8ff 140px,#0000 141px),#e3ecff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;height:100dvh;overflow:auto;padding:max(24px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(40px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
#app>*{flex-shrink:0}
h1{margin:0;font-size:36px;font-weight:900}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;color:inherit}
:focus-visible{outline:4px solid #4a4ae0;outline-offset:3px}
[data-s]{cursor:pointer}
.g{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:2px solid rgba(255,255,255,.85);border-radius:30px;box-shadow:0 12px 32px rgba(60,80,140,.14)}
button.g{text-align:left}
.r{display:flex;align-items:center;gap:16px}.c{display:flex;flex-direction:column}.w{flex-wrap:wrap}
.btn{color:#fff;background:#4a4ae0;border-radius:22px;min-height:60px;padding:0 28px;font-size:22px}
.back{text-decoration:none;font-size:18px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:0 22px;min-height:48px;border-radius:999px;background:rgba(255,255,255,.7);color:#1d2a4a}
.ic{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:32px;flex:none}
.on{background:#4a4ae0;color:#fff}
.m{color:#46567a;font-size:18px}
.y{color:#d97706}.e{color:#a3aecb}
.i{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:12px;border-radius:6px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:#4a4ae0}
.sb{padding:10px 20px;font-size:26px;white-space:nowrap}
.pill{padding:10px 22px;gap:10px}
.hero{padding:16px 32px;gap:24px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.lv{display:flex;flex-direction:column;align-items:stretch;padding:24px;gap:10px;min-height:240px}
.num{width:64px;height:64px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900}
.lock{border:3px dashed #8a97b8;border-radius:30px;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:240px}
.tbar{position:sticky;bottom:0;justify-content:space-around;padding:8px 20px;border-radius:40px;margin-top:auto}
.tb{flex-direction:column;padding:8px 34px;border-radius:30px;font-size:17px;gap:2px;background:none}.tb.on{background:#4a4ae0;color:#fff}
.ill{flex:0 0 430px;min-width:320px;align-items:center;justify-content:center;gap:14px;padding:20px}
.main{flex:1;min-width:420px;padding:30px 36px;gap:18px}
.pic{font-size:150px;line-height:1}.jig{animation:jig .7s}
@keyframes jig{0%,100%{transform:none}30%{transform:translateY(-26px) rotate(-8deg)}65%{transform:translateX(26px) rotate(8deg)}}
.big{font-size:64px;font-weight:900;line-height:1}.en{font-size:42px;color:#3a3ac0}
.sent{padding:18px 24px;border-radius:22px}.hl{color:#3a3ac0;border-bottom:4px solid #f59e0b}
.bub{padding:12px 22px;border-radius:24px}
table{width:100%;border-collapse:collapse;font-size:28px}td,th{padding:12px 16px;text-align:left;border-bottom:2px solid rgba(255,255,255,.8)}.h{background:rgba(74,74,224,.12);color:#3a3ac0}
.tip{flex:1;padding:24px;align-items:center;justify-content:center;gap:12px;text-align:center}
.cw{position:relative;width:min(660px,100%);height:440px;align-self:center}
.ghost{position:absolute;inset:0;transform:translate(18px,18px) rotate(2deg);opacity:.6}
.cardf{position:absolute;inset:0;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer}
.bigw{font-size:88px;font-weight:900;line-height:1}.dv{height:2px;width:70%;background:#fff}
.rt{width:230px;min-height:110px;align-items:center;justify-content:center;gap:4px;text-align:center!important}.best{border:3px solid #d97706}
.owl{position:absolute;left:44px;top:250px;width:190px;align-items:center;gap:10px}.owl .g{padding:12px 16px;border-radius:22px;text-align:center}
.sg{flex:1;height:12px;border-radius:6px;background:#fff}.f{background:#4a4ae0}
.q{padding:36px 48px;gap:16px;align-items:center;text-align:center}.qt{font-size:clamp(34px,5vw,56px);font-weight:900}
.bl{display:inline-block;min-width:150px;border-bottom:6px solid #12805a;color:#12805a}
.opts{display:flex;gap:22px;flex-wrap:wrap}.a{flex:1;min-width:200px;min-height:120px;font-size:44px;text-align:center!important}
.good{background:#12805a!important;color:#fff!important;border-color:#12805a!important}.bad{background:#c2410c!important;color:#fff!important;border-color:#c2410c!important}.dim{opacity:.35}
.fb{padding:18px 28px;gap:18px;border:3px solid #a3aecb}.fb.okb{border-color:#12805a}
.tm{width:100%;animation:tm 8s linear forwards}@keyframes tm{to{width:0}}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.tile{aspect-ratio:1.3;font-size:64px;display:grid;place-items:center;text-align:center!important}
.ans{min-height:84px;gap:12px;padding:12px;border-radius:22px;background:rgba(255,255,255,.6);width:100%;justify-content:center}.big2{font-size:30px;min-height:64px}
.sr{min-height:64px;padding:0 24px;font:inherit;color:#1d2a4a;border-radius:22px;width:100%}
.row{width:100%;display:flex;align-items:center;gap:16px;padding:10px 8px;border-bottom:2px solid rgba(255,255,255,.8);text-align:left}
.resb{margin:auto;padding:48px 64px;gap:18px;align-items:center;text-align:center}
.av{width:60px;height:60px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;border:3px solid #fff;box-shadow:0 6px 16px rgba(60,80,140,.25);flex:none}
.ov{position:fixed;inset:0;z-index:9;background:rgba(29,42,74,.35);display:grid;place-items:center;padding:24px}.ov[hidden]{display:none}
.pn{padding:28px 32px;gap:22px;width:min(640px,100%);background:rgba(255,255,255,.82)}
.pu{align-items:center;gap:6px;padding:18px 22px;min-width:150px;text-align:center!important}.pu .av{width:76px;height:76px;font-size:34px}.pu b{font-size:24px}.pu.sel{border:3px solid #4a4ae0}
@media(max-width:1100px){.owl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<body><div id="app"></div><div id="pm" class="ov" hidden></div>
<script>
const TOTAL=35,OPEN_ALL=true; // OPEN_ALL=false: Level n+1 erst ab 6 gelernten Verben in Level n

/* ===== LEVEL-DATEN – neue Level einfach unten anhängen (max. TOTAL) =====
   Verb-Zeile:  englisch|deutsch|Bild(Emoji)|Past|Partizip|Satz (_ = Verb)|Person 0-5|deutscher Satz|Nomen en|Nomen de
   Person: 0 I, 1 you, 2 he/she/it, 3 we, 4 you all, 5 they. Konjugation & Zeiten werden automatisch erzeugt. */
const LEVELS=[
{t:'Ich & du',c:'#12806f',v:[
'be|sein|🙋|was|been|I _ happy today.|0|Ich bin heute glücklich.|the child|das Kind',
'have|haben|🎒|had|had|She _ a red ball.|2|Sie hat einen roten Ball.|the ball|der Ball',
'go|gehen|🚶|went|gone|She _ to school every day.|2|Sie geht jeden Tag zur Schule.|the school|die Schule',
'come|kommen|👋|came|come|We _ from Germany.|3|Wir kommen aus Deutschland.|the house|das Haus',
'do|machen|✅|did|done|I _ my homework.|0|Ich mache meine Hausaufgaben.|the homework|die Hausaufgabe',
'see|sehen|👀|saw|seen|I _ a big dog.|0|Ich sehe einen großen Hund.|the dog|der Hund',
'say|sagen|💬|said|said|He _ hello to me.|2|Er sagt Hallo zu mir.|the word|das Wort',
'like|mögen|❤️|liked|liked|They _ pizza.|5|Sie mögen Pizza.|the pizza|die Pizza',
'want|wollen|🤲|wanted|wanted|You _ an ice cream.|1|Du willst ein Eis.|the ice cream|das Eis',
'know|wissen|💡|knew|known|He _ the answer.|2|Er weiß die Antwort.|the answer|die Antwort']},
{t:'Zuhause',c:'#c2410c',v:[
'eat|essen|🍎|ate|eaten|I _ an apple.|0|Ich esse einen Apfel.|the apple|der Apfel',
'drink|trinken|🥤|drank|drunk|She _ cold milk.|2|Sie trinkt kalte Milch.|the milk|die Milch',
'sleep|schlafen|😴|slept|slept|The baby _ in bed.|2|Das Baby schläft im Bett.|the bed|das Bett',
'play|spielen|🧸|played|played|We _ in the garden.|3|Wir spielen im Garten.|the garden|der Garten',
'sit|sitzen|🪑|sat|sat|The cat _ on the chair.|2|Die Katze sitzt auf dem Stuhl.|the chair|der Stuhl',
'wash|waschen|🧼|washed|washed|I _ my hands.|0|Ich wasche meine Hände.|the hand|die Hand',
'cook|kochen|🍳|cooked|cooked|Dad _ soup.|2|Papa kocht Suppe.|the soup|die Suppe',
'read|lesen|📖|read|read|She _ a book.|2|Sie liest ein Buch.|the book|das Buch',
'write|schreiben|✏️|wrote|written|I _ a letter.|0|Ich schreibe einen Brief.|the letter|der Brief',
'open|öffnen|🚪|opened|opened|He _ the door.|2|Er öffnet die Tür.|the door|die Tür']},
{t:'Unterwegs',c:'#5b4bd8',v:[
'run|rennen|🏃|ran|run|The dog _ fast.|2|Der Hund rennt schnell.|the road|die Straße',
'jump|springen|🤸|jumped|jumped|They _ on the bed.|5|Sie springen auf dem Bett.|the trampoline|das Trampolin',
'ride|radfahren|🚴|rode|ridden|I _ my bike.|0|Ich fahre mit meinem Fahrrad.|the bike|das Fahrrad',
'swim|schwimmen|🏊|swam|swum|We _ in the lake.|3|Wir schwimmen im See.|the lake|der See',
'fly|fliegen|✈️|flew|flown|The bird _ high.|2|Der Vogel fliegt hoch.|the bird|der Vogel',
'walk|laufen|🥾|walked|walked|She _ to the park.|2|Sie läuft zum Park.|the park|der Park',
'drive|fahren|🚗|drove|driven|Mum _ the car.|2|Mama fährt das Auto.|the car|das Auto',
'climb|klettern|🧗|climbed|climbed|You _ the tree.|1|Du kletterst auf den Baum.|the tree|der Baum',
'throw|werfen|⚾|threw|thrown|He _ the ball.|2|Er wirft den Ball.|the ball|der Ball',
'find|finden|🔍|found|found|I _ a key.|0|Ich finde einen Schlüssel.|the key|der Schlüssel']}
];

/* ===== Daten & Zustand ===== */
const P=['I','you','he/she/it','we','you all','they'],PD=['ich','du','er/sie/es','wir','ihr','sie'];
const V=[];LEVELS.forEach((L,l)=>L.v.forEach((s,i)=>{const a=s.split('|');V.push({id:V.length,l,i,en:a[0],de:a[1],e:a[2],pa:a[3],pp:a[4],s:a[5],p:+a[6],sd:a[7],n:a[8],nd:a[9]})}));
/* Nutzer: Keno (Standard), Hedy, Gast – jeder mit eigenem Fortschritt und änderbarem Namen */
const DEF=['Keno','Hedy','Gast'];
let DB={u:0,users:DEF.map(n=>({n,st:{},b:0,day:'',streak:0}))};
try{const j=JSON.parse(localStorage.vt2||'null');if(j)Object.assign(DB,j);else if(localStorage.vt)Object.assign(DB.users[0],JSON.parse(localStorage.vt))}catch(e){}
let S=DB.users[DB.u]||DB.users[0];
const save=()=>{try{localStorage.vt2=JSON.stringify(DB)}catch(e){}};
const touch=()=>{const td=new Date().toISOString().slice(0,10);if(S.day!=td){S.streak=S.day==new Date(Date.now()-864e5).toISOString().slice(0,10)?S.streak+1:1;S.day=td;save()}};
touch();
const app=document.getElementById('app');
const VS=l=>V.filter(v=>v.l==l),star=v=>S.st[v.id]|0,sh=a=>[...a].sort(()=>Math.random()-.5);
const done=l=>VS(l).filter(v=>star(v)).length;
const lstars=l=>{const a=VS(l);return Math.min(3,Math.round(a.reduce((s,v)=>s+star(v),0)/a.length))};
const total=()=>Object.values(S.st).reduce((a,b)=>a+b,0)+S.b;
const open=l=>OPEN_ALL||l==0||done(l-1)>=6;
const cur=()=>Math.max(0,LEVELS.findIndex((_,l)=>done(l)<VS(l).length));

/* ===== Grammatik (automatisch) ===== */
const s3=b=>/(s|sh|ch|x|o)$/.test(b)?b+'es':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ies':b+'s';
const pres=(v,p)=>v.en=='be'?['am','are','is','are','are','are'][p]:p!=2?v.en:v.en=='have'?'has':s3(v.en);
const past=(v,p)=>v.en=='be'?([0,2].includes(p)?'was':'were'):v.pa;
const tn=(v,t,p)=>t==0?pres(v,p):t==1?past(v,p):'will '+v.en;
const sent=(v,t,plain,blank)=>v.s.replace('_',plain?tn(v,t,v.p):blank??`<span class="hl">${tn(v,t,v.p)}</span>`);
const say=(t,l='en-US')=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.85;speechSynthesis.speak(u)}catch(e){}};

/* ===== Figuren & Icons ===== */
const FOX=n=>`<svg width="${n}" height="${n}" viewBox="0 0 110 110" role="img" aria-label="Fina, der Fuchs"><path d="M18 40L26 8L48 28ZM92 40L84 8L62 28Z" fill="#ff8a3d"/><ellipse cx="55" cy="62" rx="42" ry="38" fill="#ff8a3d"/><ellipse cx="55" cy="75" rx="24" ry="16" fill="#fff1e3"/><circle cx="40" cy="56" r="5.5" fill="#1d2a4a"/><circle cx="70" cy="56" r="5.5" fill="#1d2a4a"/><circle cx="55" cy="68" r="4" fill="#1d2a4a"/></svg>`;
const OWL='<svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Ollie, die Eule"><ellipse cx="50" cy="56" rx="38" ry="40" fill="#7b6cf6"/><path d="M20 24L30 8L42 22ZM80 24L70 8L58 22Z" fill="#7b6cf6"/><circle cx="34" cy="48" r="14" fill="#fff"/><circle cx="66" cy="48" r="14" fill="#fff"/><circle cx="36" cy="49" r="6" fill="#1d2a4a"/><circle cx="64" cy="49" r="6" fill="#1d2a4a"/><path d="M44 62h12l-6 10z" fill="#ffb400"/></svg>';
const ROBOT='<svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Robi, der Roboter"><path d="M50 10V22" stroke="#1d2a4a" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="9" r="5" fill="#ff8a3d"/><rect x="14" y="22" width="72" height="62" rx="22" fill="#3cc3b4"/><rect x="26" y="38" width="48" height="26" rx="13" fill="#fff"/><circle cx="40" cy="51" r="5" fill="#1d2a4a"/><circle cx="60" cy="51" r="5" fill="#1d2a4a"/></svg>';
const IC=d=>`<svg class="i" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const SPK=IC('<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>');
const TABS=[['home','Lernen','<path d="M3 5h7a2 2 0 012 2v12a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v12a2 2 0 012-2h7z"/>'],['tabcards','Karten','<rect x="3" y="6" width="14" height="14" rx="3"/><path d="M8 3h11a2 2 0 012 2v11"/>'],['games','Spiele','<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/>'],['dict','Wörterbuch','<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>'],['lists','Listen','<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>']];
const tabs=a=>`<nav class="g r tbar">${TABS.map(([k,n,d])=>`<button class="chip tb${k==a?' on':''}" data-a="${k}">${IC(d)}${n}</button>`).join('')}</nav>`;
const ss=n=>`<span class="y">${'★'.repeat(n)}</span><span class="e">${'★'.repeat(3-n)}</span>`;
const stars=n=>`<div class="g sb" role="img" aria-label="${n} von 3 Sternen">${ss(n)}</div>`;
const bar=p=>`<div class="bar"><i style="width:${p*100}%"></i></div>`;
const hd=(x,b='home')=>`<div class="r"><button class="ic" aria-label="Zurück" data-a="${b}">‹</button>${x}</div>`;
const ti=t=>`<div style="font-size:28px;font-weight:900">${t}</div>`;
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),nm=()=>esc(S.n),ini=n=>esc((n.trim()[0]||'?').toUpperCase());
const AVC=['#4a4ae0','#c2410c','#46567a'],pm=document.getElementById('pm');
const av=()=>`<button class="av" style="background:${AVC[DB.u]}" data-a="prof" aria-label="Profil wechseln: ${nm()}">${ini(S.n)}</button>`;
const bk=()=>`<a class="chip g back" href="index.html">← Zurück zu Menu</a>`;
const tp=t=>`<div class="r" style="justify-content:space-between"><div class="r w">${bk()}<h1>${t}</h1></div>${av()}</div>`;
const pmr=()=>{pm.innerHTML=`<div class="g c pn" role="dialog" aria-label="Profil"><div class="r" style="justify-content:space-between"><div style="font-size:30px;font-weight:900">Wer lernt heute?</div><button class="ic" data-a="pclose" aria-label="Schließen">${IC('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div><div class="r w" style="gap:16px;justify-content:center">${DB.users.map((u,i)=>`<button class="g c pu${i==DB.u?' sel':''}" data-a="puser,${i}"><span class="av" style="background:${AVC[i]}">${ini(u.n)}</span><b id="pn${i}">${esc(u.n)}</b><span class="m">${Object.values(u.st).reduce((a,b)=>a+b,0)+u.b} Sterne</span></button>`).join('')}</div><label class="c" style="gap:8px"><span class="m">Name ändern</span><input id="pn" class="g sr" maxlength="14" value="${nm()}" autocomplete="off"></label><button class="btn" data-a="pclose">Fertig</button></div>`};

/* ===== Screens ===== */
const lvCard=(L,l,c)=>{const a=VS(l),d=done(l),s=lstars(l);return `<button class="g lv" style="${l==c?'border:3px solid #4a4ae0;':''}${open(l)?'':'opacity:.55'}" data-a="lvl,${l}"><div class="r" style="justify-content:space-between"><div class="num" style="background:${L.c}">${l+1}</div><div style="font-size:30px" role="img" aria-label="${s} Sterne">${ss(s)}</div></div><div style="font-size:28px;font-weight:900">${L.t}</div><div class="m">${a.slice(0,5).map(v=>v.en).join(' · ')}</div><div class="m" style="margin-top:auto">${d} von ${a.length} Verben</div><div class="bar"><i style="width:${d/a.length*100}%;background:${L.c}"></i></div></button>`};
const dl=q=>[...V].sort((a,b)=>a.en.localeCompare(b.en)).filter(v=>(v.en+' '+v.de).toLowerCase().includes(q.toLowerCase())).map(v=>`<button class="row" data-a="open,${v.id}"><span style="font-size:36px">${v.e}</span><b style="font-size:26px;min-width:150px">to ${v.en}</b><span style="flex:1">${v.de}</span><span class="m">Level ${v.l+1}</span><span>${ss(star(v))}</span></button>`).join('')||'<div class="m" style="padding:20px">Nichts gefunden</div>';

const VIEWS={
home:()=>{const c=cur(),n=Math.min(5,VS(c).filter(v=>!star(v)).length||5),hello=`Hallo ${nm()}! Heute lernen wir ${n} neue Verben.`;
return `<div class="r w" style="justify-content:space-between"><div class="r w">${bk()}<h1>Verben-Reise</h1></div><div class="r"><div class="g r pill"><span class="y" style="font-size:30px">★</span>${total()} Sterne</div><div class="g pill">${nm()} · ${S.streak} ${S.streak==1?'Tag':'Tage'} in Folge</div>${av()}</div></div>
<div class="g r hero"><span data-s="${hello}" data-l="de-DE">${FOX(110)}</span><div class="c" style="flex:1;gap:6px;min-width:260px"><div style="font-size:30px;font-weight:900">${hello}</div><div class="m">Fina: Tippe mich an, dann lese ich dir alles vor.</div></div><button class="btn" data-a="lvl,${c}">Weiter mit Level ${c+1}</button></div>
<div class="grid">${LEVELS.map((L,l)=>lvCard(L,l,c)).join('')}${LEVELS.length<TOTAL?`<div class="c lock"><div style="font-size:48px;font-weight:900;color:#46567a">${LEVELS.length+1}–${TOTAL}</div><div class="m">${TOTAL-LEVELS.length} weitere Level<br>warten auf dich</div></div>`:''}</div>`+tabs('home')},

learn:()=>{const a=VS(st.l),v=a[st.i],t=st.t|0;
return hd(`<div class="c" style="flex:1;gap:8px">${ti(`Level ${st.l+1} · ${LEVELS[st.l].t}`)}${bar((st.i+1)/a.length)}</div><div class="m">Verb ${st.i+1} von ${a.length}</div>${stars(star(v))}`)
+`<div class="r w" style="flex:1 0 auto;align-items:stretch;gap:22px"><div class="g c ill"><button class="pic" data-a="pic" data-s="to ${v.en}" aria-label="to ${v.en}">${v.e}</button><div class="chip m">Tippe aufs Bild – es wird vorgelesen</div></div>
<div class="g c main"><div class="r"><div class="c" style="flex:1"><div class="big">${v.de}</div><div class="en">to ${v.en}</div></div><button class="ic" data-s="to ${v.en}" aria-label="Vorlesen">${SPK}</button></div>
<div class="m">Zeiten</div><div class="r w">${['Jetzt','Gestern','Morgen'].map((n,k)=>`<button class="chip${k==t?' on':''}" data-a="tense,${k}">${n} · ${tn(v,k,v.p)}</button>`).join('')}</div>
<div class="g r sent"><div class="c" style="flex:1"><div style="font-size:34px">${sent(v,t)}</div><div class="m">${t?['','Gestern – Vergangenheit','Morgen – Zukunft'][t]:v.sd}</div></div><button class="ic" data-s="${sent(v,t,1)}" aria-label="Satz vorlesen">${SPK}</button></div>
<div class="r w"><span class="m">Wörter dazu</span><button class="chip" data-s="${v.n}">${v.n} · ${v.nd}</button></div></div></div>
<div class="r w" style="justify-content:space-between"><div class="r" data-s="Say ${v.en} with me!">${FOX(84)}<div class="g bub">Fina: Gut gemacht! Sag ${v.en} laut mit mir.</div></div><div class="r">${st.i?'<button class="chip" data-a="step,-1">‹ Zurück</button>':''}<button class="chip" data-a="conj">Konjugation</button><button class="btn" data-a="step,1">Weiter</button></div></div>`},

conj:()=>{const v=VS(st.l)[st.i],t=st.t|0,all=P.map((_,p)=>P[p].split('/')[0]+' '+pres(v,p)).join('. ');
return hd(`<div style="font-size:30px;font-weight:900;flex:1">Konjugation · ${v.de} = to ${v.en}</div>${stars(star(v))}`,'learn')
+`<div class="r w" style="flex:1 0 auto;align-items:stretch;gap:22px"><div class="g c" style="flex:1;min-width:520px;padding:26px 32px;gap:12px"><div class="r w">${['Jetzt','Gestern','Morgen'].map((n,k)=>`<button class="chip${k==t?' on':''}" data-a="tense,${k}">${n}</button>`).join('')}<span class="m" style="margin-left:auto">Tippe auf ein Wort zum Anhören</span></div>
<table><tr class="m"><th>Person</th><th>Jetzt</th><th>Gestern</th><th>Morgen</th></tr>${P.map((_,p)=>`<tr><td>${PD[p]} · ${P[p]}</td>${[0,1,2].map(k=>`<td class="${k==t?'h':''}" data-s="${P[p].split('/')[0]} ${tn(v,k,p)}">${tn(v,k,p)}</td>`).join('')}</tr>`).join('')}</table></div>
<div class="c" style="width:300px;gap:22px"><div class="g c tip">${ROBOT}<div style="font-size:26px;font-weight:900">Merke dir!</div><div class="m">${v.en=='be'?'Bei he, she und it heißt es is. Bei I heißt es am.':`Bei he, she und it heißt es ${pres(v,2)}. Gestern heißt es ${v.pa}.`}</div></div><button class="btn r" style="justify-content:center;gap:10px" data-s="${all}">${SPK} Alles anhören</button></div></div>`},

cards:()=>{const v=V[st.d[st.k]];
return hd(`<div class="c" style="flex:1;gap:8px">${ti(`Lernkarten · Level ${st.l+1}`)}${bar(st.k/st.d.length)}</div><div class="m">Karte ${st.k+1} von ${st.d.length}</div>`)
+`<div class="cw"><div class="g ghost"></div><div class="g c cardf" data-a="flip"><div class="m">Englisch</div><div class="bigw">to ${v.en}</div><div style="font-size:56px">${v.e}</div><button class="ic" data-s="to ${v.en}" aria-label="Vorlesen">${SPK}</button>${st.r?`<div class="dv"></div><div style="font-size:40px">${v.de}</div><div class="r" style="font-size:30px">${[v.en,v.pa,v.pp].map(x=>`<span class="chip">${x}</span>`).join('')}</div>`:'<div class="m">Tippe die Karte zum Umdrehen</div>'}</div></div>
<div class="r w" style="justify-content:center;gap:22px">${[['Noch nicht',1],['Fast',2],['Kann ich!',3]].map(([n,k])=>`<button class="g c rt${k==3?' best':''}" data-a="rate,${k}"><span style="font-size:36px">${ss(k)}</span>${n}</button>`).join('')}</div>
<div class="c owl"><div class="g">Wie gut kannst du das?</div>${OWL}</div>`},

quiz:()=>{const v=V[st.q[st.k]],g=st.m=='gap',ans=st.s>=0,ok=st.s==st.c;
return hd(`${ti(`${g?'Test':'Schnell-Tippen'} · Level ${st.l+1}`)}<div class="r" style="flex:1;gap:6px">${st.q.map((_,i)=>`<i class="sg${i<st.k+(ans?1:0)?' f':''}"></i>`).join('')}</div><button class="chip" data-a="tip">Tipp von Fina</button>`,'games')
+`<div class="g c q"><div class="m">${g?'Ergänze den Satz':'Wie heißt das auf Englisch?'}</div><div class="qt">${g?sent(v,0,0,`<span class="bl">${ans?st.o[st.c]:'&nbsp;'}</span>`):v.de}</div>${g?`<div class="m" style="font-size:22px">${v.sd}</div>`:`<div style="font-size:70px">${v.e}</div>`}${!g&&!ans?'<div class="bar" style="width:60%"><i class="tm"></i></div>':''}</div>
<div class="opts">${st.o.map((o,i)=>`<button class="g a${ans?(i==st.c?' good':i==st.s?' bad':''):''}${st.x.includes(i)?' dim':''}" data-a="pick,${i}"${ans||st.x.includes(i)?' disabled':''}>${o}</button>`).join('')}</div>`
+(ans?`<div class="g r fb${ok?' okb':''}"><span class="y" style="font-size:40px">${ok?'★':'☆'}</span><div class="c"><div style="font-size:26px;font-weight:900">${ok?'Richtig! +1 Stern':(st.s==9?'Zeit vorbei! ':'Fast! ')+'Richtig: '+st.o[st.c]}</div><div class="m">${g?sent(v,0,1)+' – '+v.sd:'to '+v.en+' = '+v.de}</div></div><button class="btn" style="margin-left:auto" data-a="nextq">Weiter</button></div>`:'')},

mem:()=>hd(`<div style="font-size:28px;font-weight:900;flex:1">Bild-Memory · Level ${st.l+1}</div><div class="m">${st.mv} Züge</div>`,'games')
+`<div class="mgrid">${st.t.map((c,i)=>{const m=st.m.includes(c.id),up=m||st.f.includes(i),v=V[c.id];return `<button class="g tile${m?' good':''}" data-a="flip2,${i}" aria-label="Karte ${i+1}">${up?(c.k?`<span style="font-size:30px">to ${v.en}</span>`:v.e):'?'}</button>`}).join('')}</div>`,

sal:()=>{const v=V[st.q[st.k]];
return hd(`<div style="font-size:28px;font-weight:900;flex:1">Wortsalat · Level ${st.l+1}</div><div class="m">${st.k+1} von ${st.q.length}</div>`,'games')
+`<div class="g c q"><div class="m">Bringe die Wörter in die richtige Reihenfolge</div><div style="font-size:26px">${v.sd}</div><div class="r w ans${st.ok===true?' good':st.ok===false?' bad':''}">${st.a.map((o,j)=>`<button class="chip big2" data-a="unp,${j}">${o.x}</button>`).join('')||'&nbsp;'}</div></div>
<div class="r w" style="justify-content:center">${st.w.filter(o=>!st.a.includes(o)).map(o=>`<button class="chip big2" data-a="pw,${o.i}">${o.x}</button>`).join('')}</div>`},

games:()=>{const l=st.l??cur();
return `${tp('Spiele')}<div class="r w">${LEVELS.map((L,i)=>open(i)?`<button class="chip${i==l?' on':''}" data-a="gl,${i}">Level ${i+1} · ${L.t}</button>`:'').join('')}</div>
<div class="grid">${[['Test','quiz,gap','Ergänze den Satz'],['Schnell-Tippen','quiz,fast','Finde das englische Wort'],['Bild-Memory','mem','Finde die Paare'],['Wortsalat','salad','Ordne den Satz']].map(([n,a,d])=>`<button class="g lv" data-a="${a},${l}"><div style="font-size:30px;font-weight:900">${n}</div><div class="m">${d}</div></button>`).join('')}</div>`+tabs('games')},

dict:()=>`${tp('Wörterbuch')}<input id="q" class="g sr" placeholder="Verb suchen …" autocomplete="off" aria-label="Verb suchen"><div id="dl" class="g c" style="padding:8px 16px">${dl('')}</div>`+tabs('dict'),

lists:()=>`${tp('Listen')}<div class="grid">${[['Neu',v=>!star(v)],['Noch üben',v=>star(v)==1],['Fast geschafft',v=>star(v)==2],['Kann ich!',v=>star(v)==3],['Unregelmäßige Verben',v=>!/ed$/.test(v.pa)]].map(([n,f])=>{const a=V.filter(v=>open(v.l)&&f(v));return `<div class="g lv"><div class="r" style="justify-content:space-between"><div style="font-size:28px;font-weight:900">${n}</div><div class="m">${a.length}</div></div><div class="r w">${a.map(v=>`<button class="chip" data-a="open,${v.id}">${v.e} ${v.en}</button>`).join('')||'<span class="m">leer</span>'}</div></div>`}).join('')}</div>`+tabs('lists'),

res:()=>`<div class="g c resb">${FOX(120)}<div style="font-size:44px;font-weight:900">${st.ti}</div><div style="font-size:64px">${ss(st.n)}</div><div class="m">${st.sub}</div><div class="r"><button class="chip" data-a="home">Zur Karte</button>${st.ba?`<button class="btn" data-a="${st.ba}">${st.bl}</button>`:''}</div></div>`
};

/* ===== Steuerung ===== */
let st={v:'home'};
const render=()=>{app.innerHTML=VIEWS[st.v]()};
const go=(v,o={})=>{st={v,...o};render();app.scrollTop=0};
const nq=()=>{const v=V[st.q[st.k]],g=st.m=='gap',c=g?pres(v,v.p):'to '+v.en,pool=g?[...P.map((_,p)=>pres(v,p)),past(v,0),past(v,1)]:sh(VS(st.l)).concat(sh(V)).map(x=>'to '+x.en);
 st.o=sh([c,...sh([...new Set(pool)].filter(x=>x!=c)).slice(0,g?2:3)]);st.c=st.o.indexOf(c);st.s=-1;st.x=[];render()};
const sw=()=>{const v=V[st.q[st.k]];st.w=sh(sent(v,0,1).split(' ').map((x,i)=>({x,i})));st.a=[];st.lk=0;st.ok=null;render()};
const ACT={
home:()=>go('home'),games:()=>go('games'),dict:()=>go('dict'),lists:()=>go('lists'),
tabcards:()=>ACT.cards(cur()),
lvl:l=>{if(open(l))go('learn',{l,i:Math.max(0,VS(l).findIndex(v=>!star(v))),t:0})},
open:id=>{const v=V[id];go('learn',{l:v.l,i:v.i,t:0})},
learn:()=>go('learn',{l:st.l,i:st.i,t:st.t}),
tense:k=>{st.t=k;render()},
pic:b=>{b.classList.remove('jig');void b.offsetWidth;b.classList.add('jig')},
step:d=>{const i=st.i+d;if(i>=VS(st.l).length)return ACT.cards(st.l);if(i>=0)go('learn',{l:st.l,i,t:0})},
conj:()=>go('conj',{l:st.l,i:st.i,t:st.t|0}),
cards:l=>go('cards',{l,d:VS(l).sort((a,b)=>star(a)-star(b)).map(v=>v.id),k:0,r:0}),
flip:()=>{st.r=!st.r;render()},
rate:n=>{const v=V[st.d[st.k]],l=st.l;S.st[v.id]=n;save();st.k++;st.r=0;if(st.k<st.d.length)render();else go('res',{ti:'Karten geschafft!',n:lstars(l),sub:`Level ${l+1}: ${done(l)} von ${VS(l).length} Verben gelernt`,bl:'Weiter zum Test',ba:'quiz,gap,'+l})},
gl:l=>go('games',{l}),
quiz:(m,l)=>{st={v:'quiz',m,l,q:sh(VS(l)).map(v=>v.id),k:0,sc:0};nq()},
tip:()=>{if(st.s>=0)return;const w=st.o.map((_,i)=>i).filter(i=>i!=st.c&&!st.x.includes(i));if(w.length>1){st.x.push(w[0]);render()}},
pick:i=>{if(st.s>=0)return;const v=V[st.q[st.k]];st.s=i;if(i==st.c){st.sc++;S.b++;save()}render();say(st.m=='gap'?sent(v,0,1):'to '+v.en)},
nextq:()=>{if(++st.k<st.q.length)return nq();const sc=st.sc,len=st.q.length;go('res',{ti:'Super gemacht!',n:Math.round(sc/len*3),sub:`${sc} von ${len} richtig`,bl:'Mehr Spiele',ba:'games'})},
mem:l=>go('mem',{l,t:sh(sh(VS(l)).slice(0,6).flatMap(v=>[{id:v.id,k:0},{id:v.id,k:1}])),f:[],m:[],mv:0,lk:0}),
flip2:i=>{const c=st.t[i];if(st.lk||st.f.includes(i)||st.m.includes(c.id))return;st.f.push(i);
 if(st.f.length==2){st.mv++;const[a,b]=st.f.map(j=>st.t[j]);
  if(a.id==b.id){st.m.push(a.id);st.f=[];say('to '+V[a.id].en);
   if(st.m.length==6){const mv=st.mv,n=mv<=9?3:mv<=14?2:1;S.b+=n;save();setTimeout(()=>st.v=='mem'&&go('res',{ti:'Alle Paare gefunden!',n,sub:`${mv} Züge`,bl:'Mehr Spiele',ba:'games'}),900)}}
  else{st.lk=1;setTimeout(()=>{if(st.v=='mem'){st.f=[];st.lk=0;render()}},900)}}
 render()},
salad:l=>{st={v:'sal',l,q:sh(VS(l)).slice(0,5).map(v=>v.id),k:0,sc:0};sw()},
pw:i=>{if(st.lk)return;st.a.push(st.w.find(o=>o.i==i));render();if(st.a.length<st.w.length)return;
 const t=sent(V[st.q[st.k]],0,1),ok=st.a.map(o=>o.x).join(' ')==t;st.lk=1;st.ok=ok;if(ok){st.sc++;S.b++;save();say(t)}render();
 setTimeout(()=>{if(st.v!='sal')return;if(!ok){st.a=[];st.lk=0;st.ok=null;return render()}if(++st.k<st.q.length)return sw();const sc=st.sc,len=st.q.length;go('res',{ti:'Wortsalat gelöst!',n:Math.round(sc/len*3),sub:`${sc} von ${len} richtig`,bl:'Mehr Spiele',ba:'games'})},ok?1400:800)},
unp:j=>{if(!st.lk){st.a.splice(j,1);render()}},
prof:()=>{pmr();pm.hidden=false;pm.querySelector('.sel').focus()},
pclose:()=>{if(!S.n.trim())S.n=DEF[DB.u];save();pm.hidden=true;render()},
puser:i=>{if(!S.n.trim())S.n=DEF[DB.u];DB.u=i;S=DB.users[i];touch();save();pmr();pm.querySelector('.sel').focus();go('home')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-s],[data-a]');if(!b)return;if(b.dataset.s)say(b.dataset.s,b.dataset.l);if(b.dataset.a){const[a,...r]=b.dataset.a.split(',');ACT[a](...r.map(x=>x!==''&&!isNaN(x)?+x:x),b)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q')document.getElementById('dl').innerHTML=dl(t.value);if(t.id=='pn'){S.n=t.value.slice(0,14);save();const el=document.getElementById('pn'+DB.u);if(el)el.textContent=S.n.trim()?S.n:DEF[DB.u]}});
pm.addEventListener('click',e=>{if(e.target==pm)ACT.pclose()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!pm.hidden)ACT.pclose()});
document.addEventListener('animationend',e=>{if(e.target.classList.contains('tm'))ACT.pick(9)});
render();
</script>
</body>
</html>
