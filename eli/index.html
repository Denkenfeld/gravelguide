<title>GoGo English Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f3ff;--card:rgba(255,255,255,.5);--ink:#12305a;--soft:#5b7499;--sun:#ffc83d;--sunink:#3a2a00;--coral:#ff6b5b;--mint:#2fc79a;--line:#cfe3f7;--bubA:#d9ecff;--bubB:#ffe9b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1d38;--card:rgba(40,70,125,.45);--ink:#f1f6ff;--soft:#a7bbdd;--line:#2b4a7c;--bubA:#21457c;--bubB:#6b5416;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1d38;--card:rgba(40,70,125,.45);--ink:#f1f6ff;--soft:#a7bbdd;--line:#2b4a7c;--bubA:#21457c;--bubB:#6b5416;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 12% 8%,rgba(255,200,61,.55),transparent 38%),radial-gradient(circle at 88% 18%,rgba(255,107,91,.45),transparent 40%),radial-gradient(circle at 55% 100%,rgba(70,190,255,.5),transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 20px 10px;border-bottom:3px solid var(--line)}
h1{margin:0 0 10px;font-weight:900;font-size:30px}
.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.v{background:var(--card);border:4px solid var(--line);border-radius:22px;padding:10px 6px;text-align:center;font-weight:900;font-size:20px;min-height:68px}
.v small{display:block;font-size:13px;font-weight:700;color:var(--soft)}
.v[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sunink)}
.v[aria-pressed="true"] small{color:var(--sunink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.tab{padding:10px 20px;border-radius:999px;background:var(--card);font-weight:900;border:3px solid var(--line)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.t{display:flex;gap:8px;align-items:center;font-weight:800}
label.t input{width:26px;height:26px;accent-color:var(--mint)}
.rate{display:flex;gap:6px;align-items:center;margin-left:auto}
.rate button{padding:8px 14px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-weight:900}
.rate button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#04281d}
main{padding:16px 20px 60px;max-width:1100px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.chip{flex:none;min-width:56px;padding:10px 16px;border-radius:18px;background:var(--card);border:3px solid var(--line);font-weight:900}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.chip small{display:block;font-size:11px;font-weight:700;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border-radius:28px;padding:18px;border:3px solid var(--line)}
.emo{font-size:46px;line-height:1}
.word{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:28px;font-weight:900;margin:6px 0 2px}
.word::after{content:"🔊";font-size:20px}
.de{color:var(--coral);font-weight:900;font-size:21px}
.pl{display:inline-block;background:var(--bubA);border-radius:12px;padding:2px 10px;font-size:15px;margin:6px 0}
.sent{display:block;text-align:left;margin-top:8px;padding:10px 12px;border-radius:16px;background:var(--bubB);color:var(--ink);font-size:17px}
.sent::before{content:"🔊 "}
.exde{margin:6px 4px 0;font-size:15px;line-height:1.35;color:var(--soft);font-style:italic}
.forms{font-size:15px;color:var(--soft);margin-top:8px}
.pg{margin-top:8px;font-size:14px;color:var(--soft)}
h2{font-size:26px;font-weight:900;margin:8px 0 14px}
.line{display:flex;margin:10px 0}
.line.b{justify-content:flex-end}
.bub{max-width:82%;text-align:left;padding:14px 18px;border-radius:26px;background:var(--bubA);font-size:21px;line-height:1.5}
.line.b .bub{background:var(--bubB)}
.bub.on{outline:5px solid var(--coral)}
.big{padding:14px 26px;border-radius:20px;font-weight:900;font-size:21px;background:var(--mint);color:#04281d}
.big.stop{background:var(--coral);color:#fff}
.note{color:var(--soft);font-size:15px}
@media (max-width:640px){.voices{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.card:active,.v:active,.bub:active{transform:scale(.97)}}
/* Sprecher-Profilbilder */
.v{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px 8px 8px}
.v div{min-width:0}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.av.ph{display:grid;place-items:center;background:var(--coral);color:#fff;font-weight:900;font-size:26px}
.v[aria-pressed="true"] .av{border-color:var(--ink)}
/* Glass */
.card,.v,.tab,.chip,.rate button,.sent,.bub{backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 30px rgba(18,48,90,.12),inset 0 1px 0 rgba(255,255,255,.6)}
header,body::before{background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)}
header{border-bottom:1px solid rgba(255,255,255,.5)}
.sent,.bub{background:color-mix(in srgb,var(--bubA) 65%,transparent)}
.sent,.line.b .bub{background:color-mix(in srgb,var(--bubB) 65%,transparent)}
h1{font-size:32px;letter-spacing:.5px}
.dict{border-radius:28px;padding:22px 26px;column-width:270px;column-gap:36px;background:var(--card);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 30px rgba(18,48,90,.12)}
.dict h3{margin:14px 0 6px;font-size:28px;font-weight:900;color:var(--coral);break-after:avoid;border-bottom:2px solid var(--line)}
.dict h3:first-child{margin-top:0}
.de-e{display:block;width:100%;text-align:left;padding:5px 2px;break-inside:avoid;font-size:17px;line-height:1.3}
.de-e b{font-weight:900}
.de-e span{color:var(--soft)}
.de-e i{font-style:normal;font-size:13px;color:var(--coral);margin-left:4px}

/* ---- Bild immer mittig ---- */
.emo{text-align:center}
/* ---- A-Z Buttons ---- */
.letters{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px}
.lt{min-width:46px;height:46px;padding:0 8px;border-radius:14px;background:var(--card);font-weight:900;font-size:20px;backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 30px rgba(18,48,90,.12),inset 0 1px 0 rgba(255,255,255,.6)}
.lt[aria-pressed="true"]{background:var(--coral);color:#fff}
.lt:disabled{opacity:.3;cursor:default}
h2 .note{font-weight:700}
#vinfo{margin-top:8px;font-size:13px}
/* ---- Vokabeltraining: Karten zum Umdrehen ---- */
:root{--face:#f6fbff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--face:#1c3866}}
:root[data-theme="dark"]{--face:#1c3866}
.flip{perspective:1200px;cursor:pointer;min-width:0}
.flip-in{display:grid;grid-template-columns:minmax(0,1fr);transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:260px;background:var(--face);border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 8px 30px rgba(18,48,90,.12);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.face.back{transform:rotateY(180deg)}
.flip:not(.flipped) .back,.flip.flipped .front{pointer-events:none}
.fw{font-size:36px;font-weight:900;line-height:1.15;word-break:break-word}
.fwde{color:var(--coral)}
.lang{font-size:12px;font-weight:800;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
.stars{display:flex;justify-content:center;gap:4px;margin-top:8px}
.star{font-size:42px;line-height:1;padding:2px 6px;color:var(--soft)}
.star.on{color:#ffb400}
.hint{font-size:13px;color:var(--soft);text-align:center;margin-top:4px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bkc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;min-height:132px;border-radius:22px;background:var(--card);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:0 8px 30px rgba(18,48,90,.12)}
.bkc .emo{display:block;font-size:40px}
.bkc b{font-size:19px;font-weight:900}
.bkc small{font-size:13px;color:var(--soft);min-height:16px;text-align:center}
.bkc i{font-style:normal;font-size:13px;font-weight:800;color:var(--coral)}

/* ---- Karten einheitlich: Sterne klein oben rechts ---- */
.face{position:relative;padding-top:46px}
.stars{position:absolute;top:8px;right:10px;margin:0;gap:0;justify-content:flex-end}
.star{font-size:27px;padding:4px 3px}
/* ---- Schnellleiste rechts: Scrollbalken + A–Z ---- */
body.rail main{padding-right:96px}
#rail{position:fixed;right:max(4px,env(safe-area-inset-right,0px));top:calc(var(--hh,210px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:78px;z-index:6;display:flex;gap:4px;user-select:none;-webkit-user-select:none;touch-action:none}
#rail[hidden]{display:none}
#sbar{position:relative;flex:none;width:28px;border-radius:14px;background:color-mix(in srgb,var(--ink) 16%,transparent);border:1px solid rgba(255,255,255,.5);touch-action:none}
#sthumb{position:absolute;left:3px;right:3px;top:0;height:56px;border-radius:11px;background:var(--coral);box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
#lets{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0;border-radius:16px;background:var(--card);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 30px rgba(18,48,90,.12);touch-action:none}
#lets[hidden]{display:none}
#lets span{flex:1;display:grid;place-items:center;font-weight:900;font-size:clamp(11px,2.3vh,18px);line-height:1;margin:0 3px;border-radius:8px}
#lets span.off{opacity:.25}
#lets span.on{background:var(--coral);color:#fff}
#bub{position:fixed;right:104px;top:50%;transform:translateY(-50%);width:92px;height:92px;border-radius:26px;background:var(--coral);color:#fff;font-size:56px;font-weight:900;display:grid;place-items:center;z-index:7;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#bub[hidden]{display:none}
/* ---- Kompakt-Layout: Karten im Fokus ---- */
header{padding:8px 16px;transition:transform .25s ease}
header.hide{transform:translateY(-115%)}
h1{margin:0;font-size:22px;letter-spacing:0;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:12px}
.voices{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.v{min-height:52px;padding:4px 10px 4px 4px;gap:8px;font-size:18px;border-radius:999px}
.v small{display:none}
.av{width:42px;height:42px;border-width:2px}
.av.ph{font-size:22px}
header .row{margin-top:8px;gap:8px}
.tab{padding:8px 14px;font-size:17px}
label.t{font-size:15px}
label.t input{width:24px;height:24px}
.rate button{padding:6px 8px;font-size:22px;min-width:46px;min-height:44px}
main{padding:10px 18px 60px}
.chips{padding:2px 0 8px}
.chip{min-width:48px;min-height:44px;padding:6px 14px;border-radius:16px;font-size:19px}
.chip small{display:none}
.letters{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 8px}
.lt{flex:none;min-width:44px;height:44px}
h2{font-size:22px;margin:4px 0 10px}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{padding:8px 14px;font-weight:900;font-size:16px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tools>.tab{padding:8px 14px;font-size:18px;min-height:44px}
@media (max-width:700px){.hrow{flex-wrap:wrap}.voices{flex-basis:100%}}
/* Schnellleiste: nur der Scrollbalken ist immer da, A–Z blendet beim Ziehen/Scrollen ein */
#rail{width:30px;gap:0;top:calc(var(--hh,0px) + 8px);transition:top .25s ease}
#sbar{width:30px;height:100%}
#lets{position:absolute;right:38px;top:0;bottom:0;width:54px;flex:none;opacity:0;pointer-events:none;transition:opacity .2s}
#rail.show #lets{opacity:1;pointer-events:auto}
#bub{right:104px}
body.rail main{padding-right:46px}
#rail.always #lets{opacity:1;pointer-events:auto}
body.rail.lets main{padding-right:104px}
/* eine Zeile: Kapitel + Werkzeuge */
.navrow{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.navrow .chips{flex:1;min-width:0;padding:2px 0}
.navrow .tools{flex:none;flex-wrap:nowrap;margin:0;gap:6px}
.seg button{padding:8px 11px}
.tools>.tab{padding:8px 12px}
@media (max-width:1050px){.seg .lbl{display:none}}
#sthumb{will-change:transform;transition:none}
#rail{transition:none}
</style>
</head>

const st={tab:"w",voice:0,rate:0.9,view:"ch",ch:1,sc:1,two:true,de:true,on:-1,token:0,bkMsg:0,mode:"cards",dir:"en",letter:"A",shuf:false,rnd:[],cur:null};
let vs=[],vsKey="";
function loadV(){
  const all=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(!all.length)return false;
  const key=all.map(v=>v.voiceURI).join("|");
  vs=all;
  if(key!==vsKey){vsKey=key;renderVoices()}
  return true;
}
function isEn(v){return /^en/i.test((v.lang||"").replace("_","-"))}
function qual(v){const q=(v.name+" "+v.voiceURI).toLowerCase();return q.includes("premium")?3:q.includes("enhanced")?2:1}
function byName(n){
  n=n.toLowerCase();
  return vs.filter(v=>isEn(v)&&(v.name.toLowerCase().split(/[\s(]/)[0]===n||v.voiceURI.toLowerCase().split(/[.\s_-]/).includes(n))).sort((a,b)=>qual(b)-qual(a))[0]||null;
}
function pick(i){
  for(const n of VN[i][2]){const v=byName(n);if(v)return v}
  return null;
}
// Notfall: Premium/Enhanced, dann natürliche Standardstimmen – nie Spaß-/Robotikstimmen
function fallback(){
  const en=vs.filter(isEn);
  return en.find(v=>qual(v)>1)||NATURAL.map(byName).find(Boolean)||en.find(v=>/en-US/i.test(v.lang))||en[0]||null;
}
function say(text,i){
  if(!vs.length)loadV();
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    const v=pick(i)||fallback();
    if(v){u.voice=v;u.lang=(v.lang||"en-US").replace("_","-")}else u.lang="en-US";
    u.rate=st.rate;
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=u.onerror=fin;
    window._u=u; // iOS/Safari: Utterance nicht vom Garbage Collector einsammeln lassen
    speechSynthesis.speak(u);
  });
}
function stop(){st.token++;speechSynthesis.cancel();st.on=-1;document.querySelectorAll(".bub.on").forEach(e=>e.classList.remove("on"));const b=document.getElementById("play");if(b){b.textContent="▶ Alles vorlesen";b.classList.remove("stop")}}
function speakOne(text){const busy=speechSynthesis.speaking||speechSynthesis.pending;stop();busy?setTimeout(()=>say(text,st.voice),90):say(text,st.voice)}

function renderVoices(){
  document.getElementById("voices").innerHTML=VN.map((v,i)=>{
    const ok=!!pick(i);
    return `<button class="v" data-i="${i}" aria-pressed="${st.voice===i}" title="${ok?"Stimme: "+pick(i).name.split(" (")[0]:"Ersatzstimme"}"><img class="av" src="${PIC[i]}" alt="" onerror="this.outerHTML='<span class=&quot;av ph&quot;>${v[0][0]}</span>'"><div>${v[0]}<small>${ok?(pick(i).name.split(" (")[0]===v[0]?v[1]+" ✓":"Stimme: "+pick(i).name.split(" (")[0]):"Ersatzstimme"}</small></div></button>`;
  }).join("");
  const info=document.getElementById("vinfo"),miss=VN.some((v,i)=>!pick(i));
  if(!miss)info.hidden=true;
  else{
    info.hidden=false;
    info.textContent=vs.length?"Nicht alle Stimmen gefunden → Ersatzstimme. Auf diesem Gerät verfügbar: "+[...new Set(vs.filter(isEn).map(v=>v.name))].join(", "):"Stimmen werden geladen …";
  }
}

let R={};try{R=JSON.parse(localStorage.getItem("eli_stars")||"{}")||{}}catch(e){}
function saveR(){try{localStorage.setItem("eli_stars",JSON.stringify(R))}catch(e){}}
const LBL=["","noch gar nicht","geht so","perfekt"];
function starsHTML(id){
  const n=R[W[id][0]]||0;
  return [1,2,3].map(k=>`<button class="star${k<=n?" on":""}" data-star="${k}" data-id="${id}" aria-label="${k} Stern${k>1?"e":""}: ${LBL[k]}" aria-pressed="${k===n}">${k<=n?"★":"☆"}</button>`).join("");
}
function rate(b){
  const id=+b.dataset.id,k=+b.dataset.star,w=W[id][0];
  R[w]=(R[w]===k?0:k);saveR();
  document.querySelectorAll(`.stars[data-id="${id}"]`).forEach(e=>e.innerHTML=starsHTML(id));
  updateProgress();
}
function updateProgress(){
  const p=document.getElementById("prog");if(!p||!st.cur)return;
  const c=[0,0,0,0];st.cur.forEach(i=>c[R[W[i][0]]||0]++);
  p.textContent=`★★★ perfekt: ${c[3]} von ${st.cur.length} · ★★: ${c[2]} · ★: ${c[1]} · noch nicht bewertet: ${c[0]}`;
}
function chaptersWithData(){return [...new Set(W.flatMap(w=>w[1]))].sort((a,b)=>a-b)}
function inner(w,showDe){
  const z=w[6];
  return `<div class="emo">${w[5]}</div>
    <button class="word" data-say="${w[0]}">${w[0]}</button>
    ${showDe?(w[2]?`<div class="de">${w[2]}</div>`:`<div class="note">Übersetzung folgt noch</div>`):""}
    ${w[3]?`<div class="pl">${w[3]}</div>`:""}
    ${z?`<div class="forms">${z.inf} · ${z.pres}<br>past: ${z.past} · participle: ${z.pp} · ${z.ing}</div>`:""}
    ${w[4]?`<button class="sent" data-say="${w[4].replace(/"/g,"&quot;")}">${w[4]}</button>`:""}
    ${w[7]?`<div class="exde">${w[7]}</div>`:""}
    <div class="pg">Kapitel ${w[1].join(", ")}</div>`;
}
function card(i){return `<article class="card">${inner(W[i],st.de)}</article>`}
function tcard(i){
  const w=W[i],en=st.dir==="en";
  return `<div class="flip"><div class="flip-in">
    <div class="face front"><span class="lang">${en?"English":"Deutsch"}</span><div class="fw${en?"":" fwde"}">${en?w[0]:w[2]}</div>
      <div class="stars" data-id="${i}">${starsHTML(i)}</div><div class="hint">Tippen zum Umdrehen</div></div>
    <div class="face back">${inner(w,true)}<div class="stars" data-id="${i}">${starsHTML(i)}</div><div class="hint">Auf die Karte tippen = zurückdrehen</div></div>
  </div></div>`;
}
function fcard(i,back){
  const w=W[i],en=st.dir==="en",de=st.mode==="train"?true:st.de;
  return `<div class="flip${back?" flipped":""}" data-l="${ltr(i)}"><div class="flip-in">
    <div class="face front"><div class="stars" data-id="${i}">${starsHTML(i)}</div><span class="lang">${en?"English":"Deutsch"}</span><div class="fw${en?"":" fwde"}">${en?w[0]:w[2]}</div><div class="hint">Tippen zum Umdrehen</div></div>
    <div class="face back"><div class="stars" data-id="${i}">${starsHTML(i)}</div>${inner(w,de)}</div>
  </div></div>`;
}
function railSet(mode,avail,cur){RAIL.mode=mode;RAIL.avail=avail||new Set();RAIL.cur=cur||null;RAIL.tops=null;RAIL.ver++}
function renderWords(){
  const chs=chaptersWithData(),all=W.map((_,i)=>i),tr=st.mode==="train",back=!tr;
  const chips=`<div class="chips"><button class="chip" data-view="az" aria-pressed="${st.view==="az"}">A–Z</button>`+
    chs.map(c=>`<button class="chip" data-ch="${c}" aria-pressed="${st.view==="ch"&&st.ch===c}">${c}<small>Kapitel</small></button>`).join("")+`</div>`;
  const az=st.view==="az";
  const bar=`<div class="tools"><div class="seg"><button data-mode="cards" aria-pressed="${!tr}" aria-label="Lernen">🗂️<span class="lbl"> Lernen</span></button><button data-mode="train" aria-pressed="${tr}" aria-label="Training">🎯<span class="lbl"> Training</span></button></div><div class="seg"><button data-dir="en" aria-pressed="${st.dir==="en"}" aria-label="Englisch nach Deutsch">🇬🇧→🇩🇪</button><button data-dir="de" aria-pressed="${st.dir==="de"}" aria-label="Deutsch nach Englisch">🇩🇪→🇬🇧</button></div>${az?"":`<button class="tab" data-shuf="1" aria-label="Mischen">🔀</button>${st.shuf?`<button class="tab" data-shuf="0" aria-label="Reihenfolge">↕</button>`:""}`}</div>`;
  let list,head,letters="";
  if(az){
    const avail=new Set(all.map(ltr));
    if(!avail.has(st.letter))st.letter=[...avail].sort()[0];
    letters=letterBar(avail);
    list=sortIds(all.filter(i=>ltr(i)===st.letter));
    head="";
    railSet("select",avail,st.letter);
  }else{
    list=all.filter(i=>W[i][1].includes(st.ch));
    if(st.shuf)list.sort((a,b)=>st.rnd[a]-st.rnd[b]);else sortIds(list);
    head="";
    if(st.shuf)railSet("off");else{const av=new Set(list.map(ltr));railSet("scroll",av,list.length?ltr(list[0]):null)}
  }
  let noDe=0;
  if(st.dir==="de"){noDe=list.filter(i=>!W[i][2]).length;if(noDe)list=list.filter(i=>W[i][2])}
  st.cur=list;
  main.innerHTML=`<div class="navrow">${chips}${bar}</div>`+
    `<div class="grid">${list.map(i=>fcard(i,back)).join("")}</div>`+
    `<p class="note" id="prog"></p>`+
    (noDe?`<p class="note">${noDe} Wörter ohne deutsche Übersetzung sind in dieser Richtung ausgeblendet.</p>`:"")+
    `<p class="note">${az?"Buchstabe "+st.letter+" · ":""}${list.length} Karten. ${tr?"Training: zuerst nur das Wort.":"Lernen: zuerst alle Infos."} Antippen = umdrehen. Sterne: ★ = kann ich noch gar nicht · ★★ = geht so · ★★★ = kann ich perfekt. Denselben Stern nochmal antippen = zurücksetzen. Deine Sterne bleiben gespeichert. Tippe auf ein Wort oder einen Satz, um ihn zu hören.</p>`;
  updateProgress();
}

function emojiFor(en,c){
  const k=en.toLowerCase();
  if(EM.has(k))return EM.get(k);
  const look=t=>EM.get(t)||EM.get(t.replace(/'s$/,""))||EM.get(t.replace(/e?s$/,""));
  const toks=k.replace(/\([^)]*\)/g,"").split(/[\s\/,\-]+/).filter(t=>t.length>2&&!NOICON.has(t));
  for(let i=toks.length-1;i>=0;i--){const r=look(toks[i]);if(r)return r}
  return CHE[c[0]]||"📘";

function ltr(i){const m=W[i][0].match(/[A-Za-z]/);return m?m[0].toUpperCase():"#"}
function sortIds(ids){return ids.sort((a,b)=>W[a][0].replace(/^[^A-Za-z]+/,"").toLowerCase().localeCompare(W[b][0].replace(/^[^A-Za-z]+/,"").toLowerCase()))}
function letterBar(avail){return `<div class="letters">`+"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L=>`<button class="lt" data-letter="${L}" aria-pressed="${st.letter===L}"${avail.has(L)?"":" disabled"}>${L}</button>`).join("")+`</div>`}
function renderDict(){
  const all=W.map((_,i)=>i),avail=new Set(all.map(ltr));
  if(!avail.has(st.letter))st.letter=[...avail].sort()[0];
  const list=sortIds(all.filter(i=>ltr(i)===st.letter));
  railSet("select",avail,st.letter);
  const h=list.map(i=>{const e=W[i];return `<button class="de-e" data-say="${e[0]}"><b>${e[0]}</b>${st.de&&e[2]?` <span>${e[2]}</span>`:""} <i>${e[1].join(", ")}</i></button>`}).join("");
  main.innerHTML=`<div class="dict">${h}</div><p class="note">${list.length} Wörter mit ${st.letter} · ${W.length} Wörter insgesamt · die kleine Zahl ist das Kapitel · Tippen = anhören.</p>`;
}

async function playFrom(start){
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  stop();const my=st.token;
  if(busy)await new Promise(r=>setTimeout(r,90));
  const b=document.getElementById("play");b.textContent="⏹ Stopp";b.classList.add("stop");
  const L=S[st.sc];
  for(let i=start;i<L.length;i++){
    if(my!==st.token)return;
    mark(i);
    await say(L[i],st.two&&i%2?(st.voice+1)%4:st.voice);
  }
  if(my===st.token)stop();
}
function mark(i){
  document.querySelectorAll(".bub.on").forEach(e=>e.classList.remove("on"));
  const e=document.querySelector(`.bub[data-l="${i}"]`);
  if(e){e.classList.add("on");e.scrollIntoView({block:"center",behavior:"smooth"})}
}

// ---- Buch: Kapitel 1–35 öffnen sich im Vollbild als eigene Seiten (1.html … 35.html) ----
const bkStat={};let bkProbed=false;
function bkProbe(){
  if(bkProbed||location.protocol==="file:")return;
  bkProbed=true;let left=35;
  const done=()=>{if(--left===0&&st.tab==="b")renderBook()};
  for(let n=1;n<=35;n++){
    try{fetch(n+".html",{method:"HEAD",cache:"no-store"}).then(r=>{bkStat[n]=!(r.status===404||r.status===410)}).catch(()=>{}).then(done)}
    catch(e){done()}
  }
}
function renderBook(){
  bkProbe();
  const cells=Array.from({length:35},(_,i)=>i+1).map(n=>`<button class="bkc" data-bk="${n}" aria-label="Kapitel ${n}"><span class="emo">${CHE[n]||"📕"}</span><b>Kapitel ${n}</b><small>${CH[n]||""}</small><i>${bkStat[n]===false?"folgt":"öffnen"}</i></button>`).join("");
  main.innerHTML=`<p class="note">📕 Tippe auf ein Kapitel. Es öffnet sich im Vollbild.</p>`+(st.bkMsg?`<p class="note"><b>Kapitel ${st.bkMsg}:</b> Der Inhalt folgt noch.</p>`:"")+`<div class="bkgrid">${cells}</div>`;
}
function openChapter(n){
  st.bkMsg=0;
  const go=()=>{try{localStorage.setItem("gg-tab","b")}catch(e){}location.href=n+".html"};
  if(bkStat[n]===false){st.bkMsg=n;renderBook();return}
  try{fetch(n+".html",{method:"HEAD",cache:"no-store"}).then(r=>{
    if(r.status===404||r.status===410){bkStat[n]=false;st.bkMsg=n;renderBook()}else go()
  }).catch(go)}catch(e){go()}
}

const RAIL={mode:"off",avail:new Set(),cur:null,ver:0,tops:null};
const hdr=document.querySelector("header"),rail=document.getElementById("rail"),sbar=document.getElementById("sbar"),sthumb=document.getElementById("sthumb"),lets=document.getElementById("lets"),bub=document.getElementById("bub");
const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const vpH=()=>document.documentElement.clientHeight||window.innerHeight;
const docH=()=>Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
function hdrBottom(){const safe=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;return hdr.classList.contains("hide")?safe:safe+hdr.offsetHeight}
// Kopfzeile: beim Runterscrollen aus, beim Hochscrollen ein
let lastY=window.scrollY,hdrHide=false,hdrLock=0;
function hdrSet(h){hdrHide=h;hdr.classList.toggle("hide",h);updateRail()}
function hdrScroll(){
  const y=window.scrollY;
  if(Date.now()<hdrLock){lastY=y;return}
  const dy=y-lastY;if(Math.abs(dy)<10)return;
  lastY=y;
  const h=dy>0&&y>120;
  if(h!==hdrHide)hdrSet(h);
}
// Position des ersten Eintrags je Buchstabe (zwischengespeichert, spart Layout-Arbeit beim Scrollen)
function topsOf(){
  if(RAIL.tops)return RAIL.tops;
  const seen=new Set(),arr=[];
  main.querySelectorAll("[data-l]").forEach(el=>{const L=el.dataset.l;if(!seen.has(L)){seen.add(L);arr.push({L,top:el.getBoundingClientRect().top+window.scrollY})}});
  return RAIL.tops=arr;
}
let lastHh=-1,lastCur=undefined,lastVer=-1,sdrag=null;
function updateRail(){
  const show=st.tab==="w"||st.tab==="d"||st.tab==="s";
  rail.hidden=!show;document.body.classList.toggle("rail",show);
  if(!show)return;
  const hb=hdrBottom();
  if(hb!==lastHh){lastHh=hb;document.documentElement.style.setProperty("--hh",hb+"px")}
  const on=RAIL.mode!=="off";
  lets.hidden=!on;rail.classList.toggle("always",on);document.body.classList.toggle("lets",on);
  if(RAIL.mode==="scroll"){
    const t=topsOf(),line=window.scrollY+hb+24;let cur=t.length?t[0].L:null;
    for(const x of t){if(x.top<=line)cur=x.L;else break}
    RAIL.cur=cur;
  }
  if(RAIL.cur!==lastCur||RAIL.ver!==lastVer){
    lastCur=RAIL.cur;lastVer=RAIL.ver;
    lets.querySelectorAll("span").forEach(sp=>{const L=sp.dataset.L;sp.classList.toggle("off",!RAIL.avail.has(L));sp.classList.toggle("on",L===RAIL.cur)});
  }
  if(sdrag&&RAIL.cur&&on){bub.textContent=RAIL.cur;bub.hidden=false}
  if(!sdrag){   // beim Ziehen folgt der Balken direkt dem Finger
    const vh=vpH(),dh=docH(),tr=sbar.clientHeight||1,maxS=Math.max(0,dh-vh);
    const th=Math.max(56,Math.min(tr,tr*vh/Math.max(dh,1))),f=maxS>0?Math.min(1,Math.max(0,window.scrollY/maxS)):0;
    sthumb.style.height=th+"px";sthumb.style.transform=`translateY(${f*(tr-th)}px)`;
    sbar.style.opacity=maxS>40?"1":".4";
  }
}
let railRaf=0;
function railSoon(){if(!railRaf)railRaf=requestAnimationFrame(()=>{railRaf=0;updateRail()})}
window.addEventListener("scroll",()=>{hdrScroll();railSoon()},{passive:true});
const railReset=()=>{RAIL.tops=null;railSoon()};
window.addEventListener("resize",railReset);
window.addEventListener("orientationchange",railReset);
if("ResizeObserver" in window)new ResizeObserver(railReset).observe(document.getElementById("main"));

// Scrollbalken ziehen: Maße beim Anfassen festhalten, Balken folgt dem Finger, Seite folgt per rAF
function sApply(){
  if(!sdrag)return;
  sdrag.raf=0;
  window.scrollTo(0,sdrag.f*sdrag.maxS);
  updateRail();
}
function sMove(e){
  if(!sdrag)return;
  const y=e.clientY-sdrag.top-sdrag.off,f=Math.min(1,Math.max(0,y/Math.max(1,sdrag.tr-sdrag.th)));
  sdrag.f=f;
  sthumb.style.transform=`translateY(${f*(sdrag.tr-sdrag.th)}px)`;
  if(!sdrag.raf)sdrag.raf=requestAnimationFrame(sApply);
}
sbar.addEventListener("pointerdown",e=>{
  try{sbar.setPointerCapture(e.pointerId)}catch(_){}
  const r=sbar.getBoundingClientRect(),t=sthumb.getBoundingClientRect(),th=sthumb.offsetHeight;
  hdrLock=Infinity;   // Kopfzeile während des Ziehens nicht verändern, sonst ändert sich die Leistenhöhe
  sdrag={top:r.top,tr:r.height,th,maxS:Math.max(0,docH()-vpH()),f:0,raf:0,off:(e.clientY>=t.top&&e.clientY<=t.bottom)?e.clientY-t.top:th/2};
  sMove(e);sApply();e.preventDefault();
});
sbar.addEventListener("pointermove",sMove);
["pointerup","pointercancel"].forEach(ev=>sbar.addEventListener(ev,()=>{
  if(sdrag&&sdrag.raf)cancelAnimationFrame(sdrag.raf);
  sdrag=null;hdrLock=Date.now()+400;lastY=window.scrollY;
  bubT=setTimeout(()=>{bub.hidden=true},450);railSoon();
}));

// A–Z: nächstliegenden vorhandenen Buchstaben wählen
function nearLetter(L){
  if(RAIL.avail.has(L))return L;
  const i=ABC.indexOf(L);
  for(let d=1;d<26;d++){const a=ABC[i+d],b=ABC[i-d];if(a&&RAIL.avail.has(a))return a;if(b&&RAIL.avail.has(b))return b}
  return null;
}
function scrollToEl(el){hdrLock=Date.now()+600;hdrSet(true);window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-hdrBottom()-12),behavior:"auto"})}
function letterAt(e){const r=lets.getBoundingClientRect();return ABC.charAt(Math.min(25,Math.max(0,Math.floor((e.clientY-r.top)/r.height*26))))}
let ldrag=null,bubT=0;
function letterPreview(e){
  const L=nearLetter(letterAt(e));if(!L)return;
  ldrag=L;bub.textContent=L;bub.hidden=false;clearTimeout(bubT);
  lets.querySelectorAll("span").forEach(sp=>sp.classList.toggle("on",sp.dataset.L===L));
  if(RAIL.mode==="scroll"){const el=main.querySelector(`[data-l="${L}"]`);if(el)scrollToEl(el)}
}
function letterApply(){
  const L=ldrag;ldrag=null;
  if(L&&RAIL.mode==="select"){
    st.letter=L;render();
    const t=main.querySelector(".grid,.dict");if(t)scrollToEl(t);
  }
  bubT=setTimeout(()=>{bub.hidden=true},450);
}
lets.addEventListener("pointerdown",e=>{try{lets.setPointerCapture(e.pointerId)}catch(_){}letterPreview(e);e.preventDefault()});
lets.addEventListener("pointermove",e=>{if(ldrag)letterPreview(e)});
lets.addEventListener("pointerup",letterApply);
lets.addEventListener("pointercancel",()=>{ldrag=null;bub.hidden=true});

// ---- Steuerung ----
const main=document.getElementById("main");
function render(){
  stop();
  RAIL.mode="off";RAIL.avail=new Set();RAIL.cur=null;RAIL.tops=null;RAIL.ver++;
  tabW.setAttribute("aria-pressed",st.tab==="w");tabS.setAttribute("aria-pressed",st.tab==="s");tabD.setAttribute("aria-pressed",st.tab==="d");tabB.setAttribute("aria-pressed",st.tab==="b");
  st.tab==="w"?renderWords():st.tab==="d"?renderDict():st.tab==="b"?renderBook():renderStory();
  document.querySelectorAll(".rate button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.r===st.rate));
  document.querySelectorAll(".chips,.letters").forEach(c=>{const a=c.querySelector('[aria-pressed="true"]');if(a){const cr=c.getBoundingClientRect(),ar=a.getBoundingClientRect();c.scrollLeft+=ar.left-cr.left-(cr.width-ar.width)/2}});
  updateRail();
}
document.addEventListener("click",e=>{
  if(!vs.length&&"speechSynthesis" in window)loadV();
  const sb=e.target.closest(".star");
  if(sb){rate(sb);return}
  const fl=e.target.closest(".flip");
  if(fl&&!e.target.closest("[data-say]")){fl.classList.toggle("flipped");return}
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.i!==undefined){st.voice=+t.dataset.i;renderVoices();if(st.tab==="s")renderStory()}
  else if(t.id==="tabW"){st.tab="w";st.shuf=false;render()}
  else if(t.id==="tabD"){st.tab="d";render()}
  else if(t.id==="tabS"){st.tab="s";render()}
  else if(t.id==="tabB"){st.tab="b";render()}
  else if(t.dataset.bk){openChapter(+t.dataset.bk)}
  else if(t.dataset.r){st.rate=+t.dataset.r;document.querySelectorAll(".rate button").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  else if(t.dataset.view){st.view="az";render()}
  else if(t.dataset.ch){st.view="ch";st.ch=+t.dataset.ch;st.shuf=false;render()}
  else if(t.dataset.mode){st.mode=t.dataset.mode;st.shuf=false;render()}
  else if(t.dataset.dir){st.dir=t.dataset.dir;render()}
  else if(t.dataset.shuf!==undefined){st.shuf=t.dataset.shuf==="1";if(st.shuf)st.rnd=W.map(()=>Math.random());render()}
  else if(t.dataset.letter){st.letter=t.dataset.letter;render()}
  else if(t.dataset.sc){st.sc=+t.dataset.sc;render()}
  else if(t.dataset.say){speakOne(t.dataset.say)}
  else if(t.id==="play"){st.token&&speechSynthesis.speaking&&t.classList.contains("stop")?stop():playFrom(0)}
  else if(t.dataset.l!==undefined){const i=+t.dataset.l;stop();playFrom(i)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="showDe"){st.de=e.target.checked;if(st.tab==="w")renderWords();if(st.tab==="d")renderDict()}
  if(e.target.id==="two"){st.two=e.target.checked;renderStory()}
});
if("speechSynthesis" in window){
  loadV();speechSynthesis.onvoiceschanged=loadV;
  // iOS/iPadOS feuert voiceschanged oft nicht -> kurz nachladen, bis die Stimmen da sind
  let tries=0;const iv=setInterval(()=>{loadV();if(++tries>40)clearInterval(iv)},250);
}
else{document.querySelector("h1").insertAdjacentText("afterend","Dieser Browser kann nicht vorlesen.")}
try{if(localStorage.getItem("gg-tab")==="b"){st.tab="b";localStorage.removeItem("gg-tab")}}catch(e){}
renderVoices();render();
</script>
</body>
